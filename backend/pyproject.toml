[tool.ruff]
target-version = "py311"
line-length = 140
# Applied migrations are never rewritten, not even for formatting.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs, modern syntax, and the security checks from bandit.
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # line length is the formatter's job
    "S101",  # assert is how tests are written
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106"]  # synthetic passwords in tests
"config/test_settings.py" = ["S105", "S324"]
"records/guards.py" = ["S608"]  # trigger SQL is built from constants in that file only
"billing/guards.py" = ["S608"]  # the same, for bills

[tool.ruff.lint.isort]
known-first-party = ["accounts", "audit", "billing", "config", "knowledge", "modules", "printing", "records", "vault"]
