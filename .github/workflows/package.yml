name: Build installers and portable builds
# Builds Jivni on each system and processor type, runs the browser tests against the built program,
# and keeps the installer and the portable archive. PyInstaller builds only for the machine it runs on,
# so every row needs its own runner; this is the only way to produce the macOS and arm64 builds.
#
# Windows x64 and Linux x64 were built and tested by hand with the same script (packaging/build.py).
# This workflow itself has never run: treat it as unverified until it has passed once.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, program: dist/Jivni/Jivni.exe }
          - { os: windows-11-arm, name: windows-arm64, program: dist/Jivni/Jivni.exe }
          - { os: macos-latest, name: macos-arm64, program: dist/Jivni.app/Contents/MacOS/Jivni }
          - { os: macos-15-intel, name: macos-x64, program: dist/Jivni.app/Contents/MacOS/Jivni }
          - { os: ubuntu-22.04, name: linux-x64, program: dist/Jivni/Jivni }
          - { os: ubuntu-22.04-arm, name: linux-arm64, program: dist/Jivni/Jivni }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock -r backend/requirements-dev.txt
      - name: Install Inno Setup (Windows installer builder)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - run: python packaging/build.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests against the built program
        run: npm run e2e:app
        working-directory: frontend
        env:
          JIVNI_APP: ../${{ matrix.program }}
      - uses: actions/upload-artifact@v4
        with:
          name: Jivni-${{ matrix.name }}
          path: dist/release
          if-no-files-found: error
