symptoms = [
  { section = "General", text = "A slow acting remedy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Corresponds to ailments requiring several days to reach their maximum.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Persistent, dull, rheumatic pains permeate the body.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A spleen medicine; stitches under left free ribs.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Important heart and kidneys medicine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Broncho-pneumonia.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Acts especially on mucous membranes of the respiratory and digestive tracts, and also upon the kidneys.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Valuable in chronic bronchitis of old people with mucous rales, dyspnœa, and scanty urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Feel irritable; child bores into them with fists.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Sensation as if swimming in cold water.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Pressure like a stone.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Fluent coryza; margins of nostrils feel sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sneezing; throat irritated; short, dry cough; must take a deep breath.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dyspnœa and stitches in chest, and painful contraction of abdominal muscles.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Violent, furious, exhausting cough, with much mucus; profuse, salty, slimy expectoration, and with involuntary spurting of urine and sneezing.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Child rubs face with fist during cough (Caust; Puls).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough provoked by taking a deep breath or cold drinks, from exertion, change from warm to cold air.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough of measles.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Frequent calls to urinate at night, passing large quantities (Phos ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sneezing with coughing.", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "A cardiac stimulant affecting the peripheral vessels and coronary arteries.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Great urging; much watery urine.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Involuntary spurting of urine when coughing (Caustic; Puls).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Small, red spots over body, with prickling pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Icy cold hands and feet, with warmth of the rest of the body (Menyanthes).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Feet get sore from standing.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tender feet with shop girls.", grade = 1, source = "boericke-mm-9" },
]

