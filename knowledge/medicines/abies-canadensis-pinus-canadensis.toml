  { section = "General", text = "Wants to lie down all the time; skin cold and clammy, hands cold; very faint.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Right lung and liver feel small and hard.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gleet.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feels light-headed, tipsy.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Irritable.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Canine hunger with torpid liver.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gnawing, hungry, faint feeling at the epigastrium.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Great appetite, craving for meat, pickles, radishes, turnips, artichokes, coarse food.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tendency to eat far beyond capacity for digestion.", grade = 2, source = "boericke-mm-9" },
