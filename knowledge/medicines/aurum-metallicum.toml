  { section = "General", text = "Palpitation and congestions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Ascites often in conjunction with heart affections.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Frequently indicated in secondary syphilis and effects of mercury.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This use of gold as an anti-venereal and anti-scrofulous remedy is very old, but has been well-nigh forgotten by the old school until rediscovered and placed on its scientific basis by homeopathy, and now it can never be lost again.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "When syphilis is implanted on the scrofulous constitution, we have one of the most intractable morbid conditions, and gold seems to be especially suited to the vile combination.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Ennui.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Ozæna; sexual hyperæsthesia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Arterio-sclerosis, high blood pressure; nightly paroxysms of pain behind sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sclerosis of liver, arterial system, brain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pining boys; low spirited, lifeless, weak memory.", grade = 1, source = "boericke-mm-9" },
