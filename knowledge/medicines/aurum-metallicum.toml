notes = [
  { section = "Relationship", text = "Compare: Aur ars (chronic aortitis; lupus, phthisis in syphilitic headaches; also in anæmia and chlorosis. It causes rapid increase of appetite). Aur brom (in headaches with neurasthenia, megrim, night terrors, valvular diseases). Aur mur (Burning, yellow, acrid leucorrhœa; heart symptoms, glandular affections; warts on tongue and genitals; sclerotic and exudative degeneration of the nervous system. Multiple sclerosis. Morvan's disease. Second trituration. Aur mur is a sycotic remedy, causing suppressed discharges to reappear. Valuable in climacteric hæmorrhages from the womb. Diseases of frontal sinus. Stitching pain in left side of forehead. Weariness, aversion to all work. Drawing feeling in stomach. Cancer, tongue as hard as leather; induration after glossitis). Aur mur kali.--Double chloride of Potassium and gold (In uterine induration and hæmorrhage). Aur iod (Chronic pericarditis, valvular diseases, arterio-sclerosis ozæna, lupus, osteitis, ovarian cysts, myomata uteri, are pathological lesions, that offer favorable ground for the action of this powerful drug. Senile paresis). Aur sulph (Paralysis agitans; constant nodding of the head; affections of mammæ; swelling, pain, cracked nipples with lancinating pains). Also, Asafaet (in caries of bones of ears and nose). Syphilin: Kali iod; Hep; Merc; Mez; Nit ac; Phosph. Antidotes: Bell; Cinch; Cupr; Merc.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency. Latter potency especially for increased blood pressure.", source = "boericke-mm-9" },
]

