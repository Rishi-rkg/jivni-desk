symptoms = [
  { section = "General", text = "Given full play, Aurum develops in the organism, by attacking the blood, glands, and bone, conditions bearing striking resemblance to mercurial and syphilitic infections; and it is just for such deteriorations of the bodily fluids and alterations in the tissues, that Aurum assumes great importance as a remedy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Like the victim of syphilis, mental states of great depression are produced by it.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hopeless, despondent, and great desire to commit suicide.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Every opportunity is sought for self-destruction.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Exostosis, caries, nightly bone-pains, especially cranial, nasal, and palatine.", grade = 1, source = "boericke-mm-9" },
