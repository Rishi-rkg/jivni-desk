notes = [
  { section = "Relationship", text = "Incompatible: Camph; Coccul. Complementary: Acon. Compare: Coffea tosta (Roasting develops certain vitamin-like substances (P. T. Mattei). Pigeons which have developed \"deficiency\" neuritis and paralysis on diet of polished rice lost their disabilities on the addition of 8 cc to a 5 % infusion of coffee to their food. Unroasted coffee was useless). Caffeine.--(A crystalline alkaloid-is a direct heart stimulant and diuretic. Dropsy depending on cardiac insufficiency. Myocardial degeneration. Cardiac insufficiency in pneumonia and other infectious diseases. Raises the blood pressure, increases pulse rate and stimulates the heart muscle; hence, a support in extreme feebleness or threatened failure. Stimulates the respiratory center, nerve centers and increases diuresis. One of the best stimulants of the vaso-motor centers. Acute pulmonary œdema. Brachialgia and other neuralgias characterized by nocturnal exacerbations. Jousset uses equal parts of caffeine and sachar lac. 3 grains taken in divided doses every other day. Hypodermically, 1/4 grain. Excruciating facial neuralgia from decayed teeth); Acon; Cham; Nux; Cyp; Caffeine and plants containing it, as Kola, Thea, etc. Strong black coffee, drunk as hot as possible, is indispensable as an antidote in a large number of poisons, especially narcotics. Hot coffee by rectum in cases of extreme collapse. Antidotes: Nux; Tabac.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to two hundredth potency.", source = "boericke-mm-9" },
]

