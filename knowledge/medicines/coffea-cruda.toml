id = "coffea-cruda"
name = "Coffea cruda"
abbreviation = "Coff."
aliases = ["Unroasted Coffee"]

symptoms = [
  { section = "General", text = "Stimulates the functional activity of all organs, increasing the nervous and vascular activity.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The drinking of coffee by the aged is likely to increase production of uric acid, causing irritation of kidneys; muscle and joint pains, and with the increased susceptibility of old people to the stimulating action of coffee and tea, their use should be curtailed or carefully watched.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great nervous agitation and restlessness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Extreme sensitiveness characterizes this remedy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Neuralgia in various parts; always with great nervous excitability and intolerance of pain, driving to despair.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Unusual activity of mind and body.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Bad effects of sudden emotions, surprises, joy, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nervous palpitation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Coffea is specially suited to tall, lean, stooping persons with dark complexions, temperament choleric and sanguine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Skin hypersensitive.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Gaiety, easy comprehension, irritability, excited; senses acute.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Impressionable, especially to pleasurable impressions.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Full of ideas, quick to act.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Tossing about in anguish (Acon).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Tight pain, worse from noise, smell, narcotics.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Seems as if brain were torn to pieces, as if nail were driven in head. Worse in open air.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Sensitive hearing.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Dry heat, with red cheeks.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Prosopalgia extending to molar teeth, ears, forehead, and scalp.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Toothache; temporarily relieved by holding ice-water in the mouth (Mangan opposite).", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Hasty eating and drinking.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Delicate taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Excessive hunger.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Intolerance of tight clothing.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "After wine and liquor.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses too early and long lasting.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Dysmenorrhœa, large clots of black blood.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Hypersensitive vulva and vagina.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Voluptuous itching.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Wakeful; on a constant move.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Sleeps till 3 am, after which only dozing.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Wakes with a start, sleep disturbed by dreams.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Sleepless, on account mental activity; flow of ideas, with nervous excitability.", grade = 2, source = "boericke-mm-9" },
  { section = "Sleep", text = "Disturbed by itching of anus.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Short, dry cough of measles in nervous, delicate children.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Violent irregular palpitation especially after excessive joy or surprise.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Rapid high tension pulse and urinary suppression.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Crural neuralgia; worse, motion, afternoon and night; better, by pressure.", grade = 1, source = "boericke-mm-9" },
]

