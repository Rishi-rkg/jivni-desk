  { section = "General", text = "Epistaxis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chronic deafness and tinnitus due to gout.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Meatus dry.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pseudo-leucæmia.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Deafness before menses.", grade = 1, source = "boericke-mm-9" },
