id = "niccolum-sulphuricum"
name = "Niccolum sulphuricum"
abbreviation = "Nicc-s."
aliases = ["Sulphate of Nickel"]

symptoms = [
  { section = "General", text = "Useful in climacteric disturbances.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Periodic neuralgias of malarial origin.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Urine and saliva increased.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Coppery taste.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Weak, asthenopic literally persons with weak digestion and constipation, are worse in morning and suffer from periodic headaches and hoarseness.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nervous, uneasy, desire to recline, tired, cannot settle down to any occupation.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Periodic headaches, occipital pain, extending down to spine, worse lying on back; sore pain in eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Stiff, numb sensation, worse in neck.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Spine sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Awakened in morning with burning soles, Spinal pains, legs and arms heavy and weak, cannot lie on back.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Dull aching in ovaries, with sensation as if menses appear.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Hot flashes, followed by perspiration on parts touching each other, when separated become dry.", grade = 2, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Second trituration.", source = "boericke-mm-9" },
]

