id = "chlorum"
name = "Chlorum"
abbreviation = "Chlor."
aliases = ["Chlorine Gas in Water"]

symptoms = [
  { section = "General", text = "The marked effect on the respiratory organs, producing spasm of the glottis, is the chief symptom of the drug.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Asthma to relieve the spasm of glottis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Useful externally and internally in gangrene.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Fear of becoming crazy.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Marked loss of memory, especially for names.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sooty, smoky nostrils.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Coryza with sudden gushes of sharp, corroding fluid, making nose sore inside and about the alæ.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Constriction, with suffocation.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Spasm of the glottis.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Irritation of epiglottis, larynx, and bronchi.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Loss of voice from damp air.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sudden dyspnœa from spasm of the vocal cords, with staring protruding eyes, blue face, cold sweat, pulse small.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Inspiration free, with obstructed expiration. (Mephit).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Livid face.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Prolonged, loud, whistling rales.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Extreme dryness of tongue.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Chlorine water, when required of full strength, must be freshly prepared. Fourth to sixth potency.", source = "boericke-mm-9" },
]

