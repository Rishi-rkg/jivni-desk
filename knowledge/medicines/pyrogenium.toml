  { section = "General", text = "This remedy was introduced by English Homeopathists, prepared from decomposed lean beef allowed to stand in the sun for two weeks and then potentized.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The provings and most of the clinical experience have been obtained from this preparation.", grade = 1, source = "boericke-mm-9" },
