  { section = "General", text = "Swan potentized some septic pus, which preparation has also been proved and clinically applied.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "There does not seem to be any marked difference in their effects.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pyrogen is the great remedy for septic states, with intense restlessness. \"In septic fevers, especially puerperal, Pyrogen has demonstrated its great value as a homeopathic dynamic antiseptic. \" (H.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Allen).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hectic, typhoid, typhus, ptomaine poisoning, diphtheria, dissecting wounds, sewer-gas poisoning, chronic malaria, after-effects of miscarriage, all these conditions at times may present symptoms calling for this unique medicine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "All discharges are horribly offensive -menstrual, lochial, diarrhœa, vomit, sweat, breath, etc.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Great pain and violent burning in abscesses.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chronic complaints that date back to septic conditions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Threatening heart failure in zymotic and septic fevers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Influenza, typhoid symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Full of anxiety and insane notions.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Loquacious.", grade = 1, source = "boericke-mm-9" },
