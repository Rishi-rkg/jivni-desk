id = "helonias-dioica"
name = "Helonias dioica"
abbreviation = "Helon."
aliases = ["Unicorn-root", "Helonias - chamaelirium"]

symptoms = [
  { section = "General", text = "Sensation of weakness, dragging and weight in the sacrum and pelvis, with great languor and prostration, are excellent indications for this remedy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "There is a sensitiveness expressed as a consciousness of a womb.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tired, backachy females.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The weakness shows itself also in a tendency to prolapse and other malposition of the womb.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The menses are often suppressed and the kidneys congested.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It seems as if the monthly congestion, instead of venting itself as it should through the uterine vessels, had extended to the kidneys.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "With it all, there is a profound melancholia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Patient must be doing something to engage the mind.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Remember it, for women with prolapsus from atony, enervated by indolence and luxury (better when attention is engaged-hence when the doctor comes), or for those worn out with hard work; tired, strained muscles burn and ache; sleepless.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Diabetes mellitus, and insipidus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Constant aching and tenderness over kidneys.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Profound melancholy.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Patient is better when kept busy, with mind engaged, when doing something.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Irritable; cannot endure the least contradiction.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Burning sensation on top.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache, better mental exertion.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Pain and weight in back; tired and weak.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Aching and burning across the lumbar region; can trace outlines of kidneys by constant burning.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Boring pain in lumbar region, extending down legs.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Great languor, better exercising.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Dragging in sacral region, with prolapse, especially after a miscarriage.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pruritus vulvæ.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Backache after miscarriage (Kali c).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Weight and soreness in womb; conscious of womb.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Menses too frequent, too profuse.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Leucorrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Breasts swollen, nipples painful and tender.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Parts hot, red, swollen; burn and itch terribly.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Albuminuria during pregnancy.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Debility attending the menopause.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Albuminous, phosphatic; profuse and clear, saccharine.", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Diabetes.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Sensation as if a cool wind streamed up calves of legs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Feet feel numb when sitting.", grade = 1, source = "boericke-mm-9" },
]

