  { section = "Extremities", text = "Rheumatic pain in back, especially near shoulder and limbs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain at acromion process of left scapula under clavicle and down arm, with feeble pulse.", grade = 1, source = "boericke-mm-9" },
