  { section = "Respiratory", text = "False croup; cannot exhale.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Spasmodic and whooping-cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Few paroxysms in day-time, but many at night; with vomiting after eating.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthma, as if inhaling sulphur; cough from talking; hollow, deep, with rawness, hoarseness, and pains through chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Violent spasmodic cough; worse at night.", grade = 2, source = "boericke-mm-9" },
  { section = "Sleep", text = "Awakes at night with rush of blood to lower legs.", grade = 1, source = "boericke-mm-9" },
