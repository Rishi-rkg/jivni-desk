  { section = "General", text = "Child must be raised up, gets blue in face, cannot exhale, Mucous rales through upper part of chest.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Patient wants to bathe in ice-cold water.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Excited, full of fancies.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Can neither sleep nor work.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pain from overexertion; blur; unable to distinguish letters; conjunctiva red; eyes hot and painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Painful jerks in root of teeth.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Bloated face.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Coppery taste, as after eating onions.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sudden contraction of glottis, when drinking or talking.", grade = 1, source = "boericke-mm-9" },
