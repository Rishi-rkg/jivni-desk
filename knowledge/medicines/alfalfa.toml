symptoms = [
  { section = "General", text = ">From its action on the sympathetic, Alfalfa favorably influences nutrition, evidenced in \"toning up\" the appetite and digestion resulting in greatly improved mental and physical vigor, with gain in weight.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Disorders characterized by malnutrition are mainly within its therapeutic range, for example, neurasthenia, splanchnic blues, nervousness, insomnia, nervous indigestion, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts as a fat producer, corrects tissue waste.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Deficient lactation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Increases quality and quantity of milk in nursing mothers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Its pronounced urinary action suggests it clinically in diabetes insipidus and phosphaturia; and it is claimed to allay vesical irritability of prostatic hypertrophy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The rheumatic diathesis seems especially amenable to its action.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "It induces mental exhilaration of buoyancy, i.e, a general feeling of well being; clear and bright, so that all blues are dissipated.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Dull, drowsy, stupid (Gels); gloomy and irritable, worse during evening.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Dull, heavy feeling in occiput, in and above the eyes, worse toward evening.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in left side of head.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Violent headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Stuffed feeling in eustachian tubes (Kali mur) at night; patulous in morning.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Increased thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Appetite impaired, but chiefly increased even to bulimia.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "He must eat frequently, so that he cannot wait for regular meals; hungry in forenoon (Sul).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Much nibbling of food and craving for sweets.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Flatulence with distention.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Shifting, flatulent pain along colon several hours after meals.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Frequent, loose, yellow, painful stools, with burning of flatulence.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Chronic appendicitis.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Kidneys inactive; frequent urging to urinate.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Polyuria (Phos ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Increased elimination of urea, indican and phosphates.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Slept better than usual, especially in early morning; it induces quiet, reposeful and refreshing sleep.", grade = 1, source = "boericke-mm-9" },
]

