notes = [
  { section = "Relationship", text = "Complementary: Ars; Cepa; Lyc; Silica. Sanguisuya 30-Leech--(Persistent hæmorrhages; effects of use of leeches). Phosph pentachloride (great soreness of mucous membrane of eyes and nose, throat and chest sore). Incompatible: Caust. Compare: Tuberculinum follows Phosphor well and complements its action. Phosphorus hydrogenatus (crumbling teeth; hyperæsthesia; locomotor ataxia); Amphisbæna (right jaw swollen and painful). Thymol (Typical sexual neurasthenia; irritable stomach; aching throughout lumbar region; worse, mental and physical exertion); Calc; Chin; Antim; Sep; Lyc; Sulph. In Pneumonia, Pneumococin 200 and Pneumotoxin (Cahis) taken from the Diplococcus lanceolatus of Fraenkel. Pneumonia and paralytic phenomena; pleuritic pain and pain in ilio-cecal region (Cartier). Antidote: Antidote to Phosph. Poisoning: Turpentine with which it forms an insoluble mass. Also Potass permang. Nux. Phos antidotes the nausea and vomiting of chloroform and ether.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency. Should not be given too low or in too continuous doses. Especially in tuberculous cases. It may act as Euthanasia here.", source = "boericke-mm-9" },
]

