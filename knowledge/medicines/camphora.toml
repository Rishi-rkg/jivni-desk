notes = [
  { section = "Relationship", text = "Camphor antidotes or modifies the action of nearly every vegetable medicine--tobacco, opium, worm medicines, etc. Laffa acutangula (whole body ice-cold, with a restlessness and anxiety; burning thirst). Camphoric acid --(a prophylactic against catheter fever; cystitis 15 grains three times a day; also for prevention of night sweats). Incompatible: Kali nit. Complementary: Canth. Antidotes: Opium; Nitr sp dulc; Phos. Compare: Carbo; Cuprum; Arsenic; Veratr.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, in drop doses, repeated frequently, or smelling of Spirits of Camphor. Potencies are equally effective.", source = "boericke-mm-9" },
