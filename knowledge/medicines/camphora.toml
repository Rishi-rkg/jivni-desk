symptoms = [
  { section = "General", text = "Hahnemann says: \"The action of this substance is very puzzling and difficult of investigation, even in the healthy organism because its primary action, more frequently than with any other remedy, alternates and becomes intermixed with the vital reactions (after effects) of the organism.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "On this account it is often difficult to determine what belongs to the vital reactions of the body and what to the alternating effects due to the primary action of the camphor.\" Pictures a state of collapse.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Icy coldness of the whole body; sudden sinking of strength; pulse small and weak.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "After operations, if temperature is subnormal, low blood pressure, 3 doses camph. 1x, 15-minute intervals.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This condition is met with in cholera, and here it is that Camphor has achieved classical fame.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "First stages of a cold, with chilliness and sneezing.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Subsultus and extreme restlessness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cracking of joints.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Epileptiform convulsions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Camphor has a direct relationship to muscles and fascia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In local rheumatic affections in cold climates necessary.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Distention of veins.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "As a heart stimulant for emergency use of Camphor is the most satisfactory remedy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Drop doses on sugar as often as every five minutes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is characteristic of Camphor that the patient will not be covered, notwithstanding the icy coldness of the body.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "One of the main remedies in shock.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain better while thinking of it.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Very sensitive to cold and to touch.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sequelæ of measles.", grade = 1, source = "boericke-mm-9" },
