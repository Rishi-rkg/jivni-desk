id = "canchalagua"
name = "Canchalagua"
abbreviation = "Canch."
aliases = ["Erythraea venusta-Centaury"]

symptoms = [
  { section = "General", text = "Used extensively as a fever remedy and bitter tonic (Gentiana), antimalarial and antiseptic.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Of use in severe type of intermittent fever in hot countries; also, in influenza.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sore, as if bruised all over.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation of drops falling from and upon different spots.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Congested.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Scalp feels tight; head feels as if bound; burning in eyes; buzzing in ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill all over; worse in bed at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Sensitive to cold trade-winds on Pacific Coast.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "General sore and bruised feeling; nausea and retching.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Wrinkled like a washer-woman's.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Scalp feels tight, as if drawn together by India-rubber.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Tincture, in drop doses. Must be made from the fresh plant. Its medicinal properties are lost in the dry.", source = "boericke-mm-9" },
]

