symptoms = [
  { section = "General", text = "Is apparently formed in muscle tissue during the stage of muscle exhaustion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Differs from ordinary Lactic acid in its relation to polarized light.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It represents a much broader and more profoundly acting drug and its pathogenesis is quite dissimilar from the normal acid.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Proved by Wm.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Griggs, M.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "D, who found it of great value in the most violent form of Epidemic influenza, especially with violent and retching and greatest prostration, when Arsenic had failed.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Spinal neurasthenia, muscular weakness, dyspnœa with myocardial weakness.", grade = 1, source = "boericke-mm-9" },
  { section = "General Symptoms", text = "Tired feeling with muscular prostration, worse any exertion.", grade = 2, source = "boericke-mm-9" },
  { section = "General Symptoms", text = "Sore feeling all over, worse in afternoon.", grade = 1, source = "boericke-mm-9" },
  { section = "General Symptoms", text = "Restless at night.", grade = 1, source = "boericke-mm-9" },
  { section = "General Symptoms", text = "Difficulty in getting to sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "General Symptoms", text = "Tired feeling in morning on getting up.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Constriction in pharynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Sore throat with tightness in naso-pharynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Tickling in throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Uncontrollable vomiting even of water followed by extreme weakness.", grade = 1, source = "boericke-mm-9" },
  { section = "Back and Extremities", text = "Tired feeling in back and neck and shoulders.", grade = 1, source = "boericke-mm-9" },
  { section = "Back and Extremities", text = "Paralytic weakness.", grade = 1, source = "boericke-mm-9" },
  { section = "Back and Extremities", text = "Wrist tires easily from writing.", grade = 1, source = "boericke-mm-9" },
  { section = "Back and Extremities", text = "Extreme weakness from climbing stairs.", grade = 1, source = "boericke-mm-9" },
  { section = "Back and Extremities", text = "Stiffness of thigh and calves.", grade = 1, source = "boericke-mm-9" },
  { section = "Back and Extremities", text = "Arms feel as if no strength in them.", grade = 1, source = "boericke-mm-9" },
  { section = "Back and Extremities", text = "Cramp in the calves.", grade = 1, source = "boericke-mm-9" },
]

