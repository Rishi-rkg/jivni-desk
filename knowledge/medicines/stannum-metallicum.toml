  { section = "Head", text = "Aching in temples and forehead.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Obstinate acute coryza and influenza with cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain worse motion; gradually increasing and decreasing as if constricted by a band; forehead feels pressed inwards.", grade = 2, source = "boericke-mm-9" },
