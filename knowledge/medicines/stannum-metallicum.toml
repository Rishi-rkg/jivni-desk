  { section = "Head", text = "Ulceration of ringhole in lobe of ear.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Much adhesive mucus, difficult to detach; efforts to detach cause nausea.", grade = 1, source = "boericke-mm-9" },
