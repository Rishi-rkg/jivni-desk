notes = [
  { section = "Relationship", text = "Complementary: Puls. Compare: Stann iod. 3x (Valuable in chronic chest diseases characterized by plastic tissue changes). Persistent inclination to cough, excited by tickling dry spot in the throat, apparently at root of tongue. Dryness of throat. Trachial and bronchial irritation of smokers. Pulmonary symptoms; cough, loud, hollow, ending with expectoration (Phellandrium). State of purulent infiltration. Advanced phthisis sometimes when Stann jod has not taken effect, an additional dose of Iodine in milk caused the drug to have its usual beneficial effect (Stonham). Compare: Caust; Calc; Sil; Tuberc; Bacil; Helon. Myrtus chekan (chronic bronchitis, cough of phthisis, emphysema, with gastric catarrhal complications and thick, yellow difficult sputum. Old persons with weakened power of expectoration).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency.", source = "boericke-mm-9" },
]

