  { section = "General", text = "Talking causes a very weak feeling in the throat and chest.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Pains that come and go gradually, call unmistakably for Stannum.", grade = 1, source = "boericke-mm-9" },
