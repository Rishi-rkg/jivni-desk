id = "adrenalinum"
name = "Adrenalinum"
abbreviation = "Adren."
aliases = ["An Internal Secretion of Suprarenal Glands", "Adrenalin"]

symptoms = [
  { section = "General", text = "Adrenaline or Epinephrine, the active principle of the medulla of the suprarenal gland, (cortical secretion not as yet isolated), is employed as a chemical messenger in the regulation of the activities of the body; in fact, its presence is essential to the activity of the sympathetic nerve.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Adrenaline action on any part is the same as stimulation of the sympathetic nerve endings thereto.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Local application (1: 1,000 solution) to mucous membranes promptly induces transient ischemia, seen in a blanching, persisting several hours from conjunctival instillation.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Its action is very prompt, efficient, evanescent, owing to rapid oxidation and therefore practically harmless, unless too frequently repeated, when atheroma and heart lesions--myocardial--in animals have been reported.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Arteries, heart, supra-renal bodies and vaso-motor system are prominently affected.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The main action of Adrenaline is stimulation of the sympathetic endings, notably the splanchnic area, causing constriction of the peripheral arterioles, with resulting rise in blood pressure.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "This is especially observed in stomach, intestines; less in uterus, skin; nil in brain and lungs.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Furthermore, is noticed, slowing of pulse, (medullary vagus stimulation), and strengthening of heart beat (increased myocardial contractility), resembling Digitalis; increased glandular activity, glycosuria; depression of respiratory center; contraction of muscular tissue of eye, uterus, vagina; relaxation of muscular tissue of stomach, intestines, bladder.", grade = 2, source = "boericke-mm-9" },
  { section = "Uses", text = "Its chief therapeutic use depends on its vaso-constriction action; therefore a most powerful and prompt astringent and hæmostatic; and invaluable in checking capillary hæmorrhages, from all parts, where local or direct application is feasible: nose, ear, mouth, throat, larynx, stomach, rectum, uterus, bladder.", grade = 2, source = "boericke-mm-9" },
  { section = "Uses", text = "Hæmorrhagic condition not due to defective coagulation of the blood.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Complete bloodlessness, ischemia, may be induced with impunity.", grade = 2, source = "boericke-mm-9" },
  { section = "Uses", text = "Locally, solutions (1: 10,000-1: 1,000) sprayed or applied on cotton have been very efficient in bloodless operations about the eye, nose, throat, and larynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Congestions of the ethmoid and sphenoid sinuses, also hay fever, have been markedly alleviated by warm spray of Adrenaline chloride, 1: 5,000.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Here compare, Hepar 1x, which will start up secretions and so facilitate drainage.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Werlhoff's disease, hypodermically, 1: 1,000.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Externally, it has been used in neuritis, neuralgia, reflex pains, gout, rheumatism, as an ointment, 1-2 m of (1: 1,000) solution, along the nerve trunk at point of skin nearest its origin which could be reached (H.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Carlton).", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Therapeutically, Adrenaline has been suggested in acute congestion of lungs, Asthma, Grave's and Addison's diseases, arterio-sclerosis, chronic aortitis, angina pectoris, hæmophilia chlorosis, hay fever, serum rashes, acute urticaria, etc.", grade = 2, source = "boericke-mm-9" },
  { section = "Uses", text = "Dr.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Jousset reports success in treating, homeopathically, cases of angina and of aortitis, sub-acute and chronic, when Adrenaline has been prescribed per os and in infinitesimal dose.", grade = 2, source = "boericke-mm-9" },
  { section = "Uses", text = "The symptom guiding to this is, Sensation of thoracic constriction with anguish.", grade = 2, source = "boericke-mm-9" },
  { section = "Uses", text = "This, with vertigo, nausea and vomiting have been produced by the drug.", grade = 1, source = "boericke-mm-9" },
  { section = "Uses", text = "Abdominal pain.", grade = 2, source = "boericke-mm-9" },
  { section = "Uses", text = "Shock or heart failure during anæsthesia, as it causes very prompt rise of blood pressure by its action on nerve endings in the vessel wall.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Hypodermically, 1-5 m (1: 1,000 solution, as chloride) diluted in water. Internally, 5-30m of 1: 1,000 solution. Caution.-- On account of its affinity for oxygen, the drug easily decomposes in watery and dilute acid solutions. The solution must be protected from air and light. It must not be too frequently repeated, owing to cardiac and arterial lesions. For homeopathic use 2x to 6x attenuation.", source = "boericke-mm-9" },
]

