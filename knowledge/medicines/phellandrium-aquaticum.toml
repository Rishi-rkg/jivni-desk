symptoms = [
  { section = "General", text = "The respiratory symptoms are most important, and have been frequently verified clinically.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A very good remedy for the offensive expectoration and cough in phthisis, bronchitis, and emphysema.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Tuberculosis, affecting generally the middle lobes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Everything tastes sweet.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Hæmoptysis, hectic and colliquative diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Weight on vertex; aching and burning in temples and above eyes.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Crushing feeling in vertex.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, dizzy when lying down.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Ciliary neuralgia; worse any attempt to use eyes: burning in eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Lachrymation.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Cannot bear light.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Headache; involving nerves going to eye.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pain in milk ducts; intolerable between nursing.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Pain in nipples.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Sticking pain through right breast near sternum, extending to back near shoulders.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Dyspnœa, and continuous cough, early in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Cough, with profuse and fetid expectoration; compels him to sit up.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Hoarseness.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Hectic; profuse and debilitating perspiration; intermittent, with pain in arms.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Desire for acids.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tired feeling when walking.", grade = 1, source = "boericke-mm-9" },
]

