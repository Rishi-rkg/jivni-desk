id = "tongo-dipterix-odorata"
name = "Tongo-dipterix odorata"
abbreviation = "Tong."
aliases = ["Seeds of Coumarouna-a tree in Guiana", "Tongo - diptrix odorata"]

symptoms = [
  { section = "General", text = "Useful in neuralgia; pertussis.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Tearing pain in supra-orbital nerve, with heat and throbbing pain in head and epiphora.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Confused, especially the occiput, with somnolence and a sort of intoxication.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Trembling in right upper lid.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Coryza; nose stopped, must breathe through mouth.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tearing pains in hip-joints, femur, and knee, especially left side.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Melilotus. Anthoxanthum, Asperula, and Tonga contain Coumarin, the active principle. Compare them in hay-fever; also, Trifol; Napth; Sabad.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture and lower potencies.", source = "boericke-mm-9" },
]

