notes = [
  { section = "Relationship", text = "Complementary: Aloe; Psorin; Acon; Pyrarara (a fish caught in the Amazon, clinically used for various skin affections). Lepra, tuberculides, syphilides, varicosities, etc. Compare: Acon (Sulph often follows in acute diseases); Mercur and calcarea are frequently useful after Sulphur, not before. Lyc; Sep; Sars; Puls; Sulphur hydrogenisatum (delirium, mania, asphyxia); Sulphur terebinthinatum (chronic rheumatic arthritis; chorea); Tannic acid (Nasal hæmorrhage; elongated uvula; gargle; constipation). Magnes artificialis (great hunger in evening, profuse sweat on face, bruised pain in joints, rectal constriction after stool). Magnetis polus Articus (anxious, coldness of eyes as if a piece of ice lay in orbit, increased flow of saliva, constipation, sopor, trembling, abdominal flatulence). Magnetis polus Australis (dryness of lids, easy dislocation of ankle, ingrowing toe-nails, aching in patella, shooting in soles). Compare in adenoids: Agraphis.", source = "boericke-mm-9" },
  { section = "Dose", text = "Acts in all potencies from the lowest to the highest. Some of the best results are obtained from the higher, and not too frequent doses. The twelfth potency is a good one to begin treatment with, going higher or lower according to the susceptibility of the patient. In chronic diseases, 200th and upward. In torpid eruptions the lowest potencies.", source = "boericke-mm-9" },
]

