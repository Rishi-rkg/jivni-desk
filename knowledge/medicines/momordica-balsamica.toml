id = "momordica-balsamica"
name = "Momordica balsamica"
abbreviation = "Mom-b."
aliases = ["Balsam Apple"]

symptoms = [
  { section = "General", text = "Griping, colic, pain in back and hypogastrium with painful and excessive menses.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Accumulation of flatus in splenic flexure of colon.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dropsy.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dizzy, contents of head feel lighter; mist before eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rumbling, griping, colicky pains, starting from back, spreading over abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Painful and profuse menses; labor-like pains, followed by gushes of blood; pain at small of back coming towards front of pelvis.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Momordica charantia -Indian variety--(more sever symptoms-intestines full of yellow watery fluid, discharged explosively -cramps, thirst, prostration. Choleraic symptoms. Similar to Croton, Elaterium. Use 3x).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture. Used also externally as a liniment and poultice for burns, chapped hands, etc.", source = "boericke-mm-9" },
]

