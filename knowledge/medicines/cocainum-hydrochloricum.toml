aliases = ["An Alkaloid from Erythroxylon Coca", "Cocaina"]

symptoms = [
  { section = "General", text = "Besides the great usefulness of Cocaine as a local anæsthetic, it has specific homeopathic uses, though the symptoms are mainly clinical only.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation as if small foreign bodies or worms were under the skin.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Talkative.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Constant desire to do something great, to undertake vast feats of strength.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Cerebral activity.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Frightful persecutory hallucinations; sees and feels bugs and worms.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Moral sense blunted.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Personal appearance neglected.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Thinks he hears unpleasant remarks about himself.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Hallucinations of hearing.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Irrational jealousy.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Insomnia.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Throbbing and bursting sensation.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pupils dilated.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Hearing greatly increased.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Roaring and noises in head.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Glaucoma, increased tension, decreased corneal sensibility.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Eyes staring, expressionless.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Dry, burning, tickling, constricted, paralysis of muscles of deglutition.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Speech difficult.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Loss of appetite for solid food.", grade = 1, source = "boericke-mm-9" },
