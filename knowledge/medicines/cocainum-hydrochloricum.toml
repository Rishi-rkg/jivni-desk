  { section = "Stomach", text = "Hæmorrhages from bowels, stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Nervous System", text = "Chorea; paralysis agitans; alcoholic tremors and senile trembling.", grade = 1, source = "boericke-mm-9" },
  { section = "Nervous System", text = "Local sensory paralysis.", grade = 1, source = "boericke-mm-9" },
  { section = "Nervous System", text = "Formication and numbness in hands and forearms.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Restless, cannot sleep for hours after retiring.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Coldness with intense pallor.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Stovain (an analgesic, a vasomotor dilator). Antidote to disagreeable effects occasionally resulting from injection of cocaine into skin or gums, drop doses of nitroglycer. 1 % sol.", source = "boericke-mm-9" },
  { section = "Dose", text = "Lower potencies. As a local application to mucous membranes, 2-4 %.", source = "boericke-mm-9" },
