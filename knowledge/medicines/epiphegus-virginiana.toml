id = "epiphegus-virginiana"
name = "Epiphegus virginiana"
abbreviation = "Epiph."
aliases = ["Beechdrop", "Epiphegus - orobanche"]

symptoms = [
  { section = "General", text = "A remedy for sick, neurasthenic, and nervous headaches, especially in women, brought on or made worse by exertion, shopping, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tongue coated yellow; bitter taste.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Drowsy after meals.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Loose stools.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Subinvolution, with painful menstruation and congestion.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Pressing pain in temples from without inwards, worse, left side.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Viscid salivation, constant inclination to spit.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Sick headache coming on when deviating from ordinary pursuits.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headaches from nerve tire caused by mental or physical exhaustion, preceded by hunger.", grade = 2, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "working in open air", source = "boericke-mm-9" },
  { kind = "better", text = "sleep", source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Iris, Melilot; Sanguinar. Fagus-Beech-nuts --(headache and salivation; swelling on mouth; dread of water).", source = "boericke-mm-9" },
  { section = "Dose", text = "First to thirtieth potency.", source = "boericke-mm-9" },
]

