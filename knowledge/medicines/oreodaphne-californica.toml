id = "oreodaphne-californica"
name = "Oreodaphne californica"
abbreviation = "Oreo."
aliases = ["California Laurel", "Oreodaphne"]

symptoms = [
  { section = "General", text = "Neuralgic headache, cervico-occipital pain, cerebro-spinal meningitis, atonic diarrhœa, and intestinal colic.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dizziness; worse on stopping or moving.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Head heavy, eyelids heavy, twitching.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Intense aching, with pressure at inner angle of either orbit, generally left, extending through brain and across scalp to the base of the occiput; worse light, noise; better, closing eyes and perfect quiet.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Constant, dull ache in cervical and occipital region, extending to scapula down spine, into the head; pain into the ears.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Great heaviness of head, with constant desire to move the head, which does not relieve.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Drooping eyelids.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Twitching.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Atonic diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Eructations, with nausea and shuddering.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "First to Third potency. Olfaction of the tincture.", source = "boericke-mm-9" },
]

