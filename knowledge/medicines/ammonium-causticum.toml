  { section = "General", text = "See Causticum.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Difficult respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Accumulation of mucus with incessant coughing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Loss of voice.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Burning rawness in throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Spasm of the glottis with suffocation; patient gasps for breath.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pain in œsophagus on breathing deeply.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Scraping and burning in throat and œsophagus.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Uvula covered with white mucus.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Nasal diphtheria, with burning excoriating discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Excessive exhaustion and muscular debility.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatism of shoulders.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Skin hot and dry.", grade = 1, source = "boericke-mm-9" },
]

notes = [
