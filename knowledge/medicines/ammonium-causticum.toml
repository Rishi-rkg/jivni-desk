  { section = "General", text = "As such in syncope, thrombosis, hæmorrhage, snake-bites, chloroform narcosis, may be given by inhalation.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The œdema and ulceration of mucous membranes produced by this powerful drug have been utilized as guiding symptoms for its use; hence in membranous croup with burning in œsophagus.", grade = 1, source = "boericke-mm-9" },
