notes = [
  { section = "Relationship", text = "Compare: Mandragora -also called mandrake--(must not be confounded with Podoph. Great desire for sleep; exaggeration of sounds and enlarged vision. Bowels inactive; stools large, white and hard). Aloe; Chelid; Merc; Nux; Sulph. Prunella -Self-head--(Colitis).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture to sixth potency. The 200th and 1000th seem to do good work in cholera infantum, when indicated.", source = "boericke-mm-9" },
]

