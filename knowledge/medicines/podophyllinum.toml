id = "podophyllinum"
name = "Podophyllinum"
abbreviation = "Podo."
aliases = ["May-apple", "Podophyllum"]

symptoms = [
  { section = "General", text = "Is especially adapted to persons of bilious temperament.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It affects chiefly the duodenum, small intestines, liver, and rectum The Podophyllum disease is a gastro-enteritis with colicky pain and bilious vomiting.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Stool is watery with jelly-like mucus, painless, profuse.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Gushing and offensive.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Many troubles during pregnancy; pendulous abdomen after confinement; prolapsus uteri; painless cholera morbus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Torpidity of the liver; portal engorgement with a tendency to hæmorrhoids, hypogastric pain, fullness of superficial veins, jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Loquacity and delirium from eating acid fruits.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Depression of spirits.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, with tendency to fall forward.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache, dull pressure, worse morning, with heated face and bitter taste; alternating with diarrhœa.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Rolling of head from side to side, moaning and vomiting and eyelids half closed.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Child perspires on head during sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Grinding the teeth at night; intense desire to press the gums together (Phytol).", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Difficult dentition.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue broad, large, moist.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Foul, putrid taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Burning sensation of tongue.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hot, sour belching; nausea and vomiting.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Thirst for large quantities of cold water (Bry).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting of hot, frothy mucus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Heartburn; gagging or empty retching.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting of milk.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Distended; heat and emptiness.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Sensation of weakness or sinking. Can lie comfortably only on stomach.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Liver region painful, better rubbing part.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rumbling and shifting of flatus in ascending colon.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Cholera infantum and morbus.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Diarrhœa of long standing; early in morning; during teething, with hot, glowing cheeks while being bathed or washed; in hot weather after acid fruits.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Morning, painless diarrhœa when not due to venous stasis or intestinal ulceration.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Green, watery, fetid, profuse, gushing.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Prolapse of rectum before or with stool.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Constipation; clay-colored, hard, dry, difficult.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Constipation alternating with diarrhœa (Ant crud).", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Internal and external piles.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pain in uterus and right ovary, with shifting noises along ascending colon.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Suppressed menses, with pelvic tenesmus.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Prolapsed uteri, especially after parturition.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Hæmorrhoids, with prolapsus ani during pregnancy.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain between shoulders, under right scapula, in loins and lumbar region.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in right inguinal region; shoots down inner thigh to knees.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Paralytic weakness on left side.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill at 7 am, with pain in hypochondria, and knees, ankles, wrists, Great loquacity during fever.", grade = 2, source = "boericke-mm-9" },
  { section = "Fever", text = "Profuse sweat.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "early morning, in hot weather, during dentition", source = "boericke-mm-9" },
]

