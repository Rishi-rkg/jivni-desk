id = "eupatorium-perfoliatum"
name = "Eupatorium perfoliatum"
abbreviation = "Eup-per."
aliases = ["Thoroughwort"]

symptoms = [
  { section = "General", text = "Known as \"Bone-set\", from the prompt manner in which it relieves pain in limbs and muscles that accompanies some forms of febrile disease, like malaria and influenza.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Eupatorium acts principally upon the gastro-hepatic organs and bronchial mucous membrane.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is a boon in miasmatic districts, along rivers, marshes, etc, and in all conditions where there is a great deal of bone-pain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cachexia from old chronic, bilious intermittents.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Worn-out constitutions from inebriety.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sluggishness of all organs and functions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bone-pains, general and severe.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Soreness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Marked periodicity (Ars; China; Cedron).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Throbbing pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pressure as if a cap of lead pressed over the whole skull.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo; sensation of falling to left.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Vomiting of bile.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Top and back of head with pain and soreness of eyeballs.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Periodical headache, every third and seventh day.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Occipital pain after lying down, with sense of weight.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Cracks in corners of mouth, yellow coated tongue, thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tongue yellow.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Taste bitter.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hepatic region sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Great thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting and purging of bile, of green liquid several quarts at a time.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting preceded by thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hiccough (Sulph ac; Hydrocy ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Avoids tight clothing.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Frequent, green watery.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Cramps.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Constipated, with sore liver.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Coryza, with sneezing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarseness and cough, with soreness in chest; must support it.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Influenza, with great soreness of muscles and bones.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Chronic loose cough, chest sore; worse at night.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough relieved by getting on hands and knees.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Perspiration relieves all symptoms except headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill between 7 and 9 am, preceded by thirst with great soreness and aching of bones.", grade = 2, source = "boericke-mm-9" },
  { section = "Fever", text = "Nausea, vomiting of bile at close of chill or hot stage; throbbing headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Knows chill is coming on because he cannot drink enough.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Aching pain in back.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Aching in bones of extremities with soreness of flesh.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Aching in arms and wrists.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Swelling of left great toe.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Gouty soreness and inflamed nodosities of joints, associated with headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Dropsical swelling.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "periodically", source = "boericke-mm-9" },
  { kind = "better", text = "conversation, by getting on hands and knees", source = "boericke-mm-9" },
]

