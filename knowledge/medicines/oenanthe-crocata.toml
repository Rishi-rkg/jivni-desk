  { section = "Extremities", text = "Pain along crural and sciatic nerves, commencing in back.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cold hands and feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Numbness of hand and foot.", grade = 1, source = "boericke-mm-9" },
