  { section = "Relationship", text = "Complementary: Nat mur; Phosph. Nux intensifies action. Guaiacum often beneficial after Sepia. Inimical: Lach; Puls. Compare: Lit; Murex; Silica; Sulph; Asperula -Nacent oxygen. Distilled water charged with the gas--(leucorrhœa of young girls and uterine catarrh); Ozonum (sacral pain; tired feeling through pelvic viscera and perineum); Dictamnus --Burning Bush--(Soothes labor pains); (metrorrhagia, leucorrhœa, and constipation; also somnambulism). Lapathum (Leucorrhœa with constriction and expulsive effort through womb and pain in kidneys).", source = "boericke-mm-9" },
  { section = "Dose", text = "Twelfth, 30th and 200th potency. Should not be used too low or be repeated too frequently. On the other hand Dr. Jousset's unique experience is that is should be continued for some time in strong doses. 1x twice a day.", source = "boericke-mm-9" },
]

