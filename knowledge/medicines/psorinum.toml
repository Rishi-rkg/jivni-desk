  { section = "Relationship", text = "Complementary: Sulphur. Compare: Pediculus -Head-louse--(psoric manifestations in children. Eruption on dorsum of hands, feet neck. Prurigo; pellagra. Unusual aptitude for study and work). Pediculus (Cooties) transmit typhus and trench fever). In lack of reaction compare Calcarea and Natrum ars. Gaertner (Pessimistic, lack of confidence, subjective troublesome eye symptoms, fear of heights. Urticaria. Use 30th and 200th (Wheeler).", source = "boericke-mm-9" },
  { section = "Dose", text = "Two hundredth and higher potencies. Should not be repeated too often. Psorinum requires something like 9 days before it manifests its action, and even a single dose may elicit other symptoms lasting for weeks (Aegedi).", source = "boericke-mm-9" },
]

