id = "anthemis-nobilis"
name = "Anthemis nobilis"
abbreviation = "Anth."
aliases = ["Roman Chamomile"]

symptoms = [
  { section = "General", text = "This remedy is akin to the ordinary Chamomilla.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gastric disturbance with coldness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensitive to cold air and cold things.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Coryza with much lachrymation, sneezing, and discharge of clear water from the nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Symptoms worse indoors.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Constriction and rawness of throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Cough, tickling; worse in warm room.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Aching in region of liver; griping and chilliness inside of abdomen and into legs.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Itching of anus, with white putty-like stools.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Bladder feels distended.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Pain along spermatic cord, which feels full, as if varicosed.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Frequent urination.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching of the soles, as if from chilblains.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Gooseflesh.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Use the third potency.", source = "boericke-mm-9" },
]

