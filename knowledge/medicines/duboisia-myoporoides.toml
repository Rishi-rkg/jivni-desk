id = "duboisia-myoporoides"
name = "Duboisia myoporoides"
abbreviation = "Dubo-m."
aliases = ["Corkwood Elm", "Duboisia"]

symptoms = [
  { section = "General", text = "Acts chiefly on the nervous system, eyes, upper respiratory tract.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Recommended in pharyngitis sicca, with black, stringy mucus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It dilates the pupil, dries the mouth, checks perspiration, causes headache and drowsiness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "On the eye it acts more promptly than Atropia, much stronger as a mydriatic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Red spots floats in the field of vision.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sensation as if stepping on empty space.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Vertigo with pale face; not gastric in origin.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Scarlet fever; locomotor ataxia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Palliative in exophthalmic goitre.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Absent-minded, incoherent, silly and nonsensical, memory impaired.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Impossible to stand with eyes shut, tendency to fall backwards.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Conjunctivitis, acute and chronic.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Mydriasis.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Paralysis of accommodation.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Hyperæmia of retina with weakness of accommodation, fundus red, blood-vessels full and tortuous; pupils dilated, with dim vision.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pain over eye, between it and brow.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Larynx dry, voice hoarse, phonation difficult.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry cough with oppressed breathing.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Loss of power in limbs, staggers; feels as if he stepped on empty space.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Trembling, numbness and weakness.", grade = 1, source = "boericke-mm-9" },
]

