notes = [
  { section = "Relationship", text = "It antagonizes Muscarine. Duboisin sulphate 1-100 gr sedative in mania. 2-4 milligrams a day. Hystero-epilepsy. Motor restlessness of insane (Has been used as a substitute for Atropia in doses of 1-20 of a grain hypodermically). Antidotes: Morphia; Pilocarp. Compare: Bellad; Stram; Hyos.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to twelfth potency.", source = "boericke-mm-9" },
]

