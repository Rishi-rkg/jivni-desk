  { section = "Stool", text = "Anus moist and sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Cloudy.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Burning in urethra.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Oxaluria.", grade = 1, source = "boericke-mm-9" },
