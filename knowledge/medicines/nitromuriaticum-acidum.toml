  { section = "General", text = "Three to five drops three times a day.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "So-called bilious conditions; torpid liver, hepatitis and early cirrhosis of liver.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "More adapted to hepatic torpor and gastric catarrh common in hot and damp climates and aggravated by meat eating and alcohol (Hale).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Constricted anus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gravel.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Gums bleed easily.", grade = 1, source = "boericke-mm-9" },
