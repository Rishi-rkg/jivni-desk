aliases = ["Mercuric Sulphide", "Mercurius sulphuratus ruber"]

symptoms = [
  { section = "General", text = "For certain forms of ciliary neuralgia and ulceration upon a syphilitic base, this remedy is most effective.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sleepless during night.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Congestion to head; face purple red.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pains from lachrymal duct around eye to temple, from inner canthus across brows to ear.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Severe shooting pain in bones of orbit, especially running from inner to outer canthus in the bone.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Redness of whole eye.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Lids granulated; canthi and lids red.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Pressive sensation, as from heavy spectacles.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Pain about root, extending into bones on each side (Aur; Kal hyd).", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Stringy mucus passed through posterior nares into throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Dryness of mouth and throat; must rinse the mouth.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Fiery-looking ulcers in mouth and throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Prepuce swollen; warts on it which bleed easily; testicles enlarged; buboes; angry-looking chancres.", grade = 2, source = "boericke-mm-9" },
  { section = "Male", text = "Syphilides, squamous and vesicular.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Leucorrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Feeling of pressure in vagina.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in forearm from elbow down, including hands.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in long bones when barometer lowers; coldness of joints.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Very fiery-red looking ulcers.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Nodes on shin-bones.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Buboes.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Condyloma, easily bleeding.", grade = 1, source = "boericke-mm-9" },
]

