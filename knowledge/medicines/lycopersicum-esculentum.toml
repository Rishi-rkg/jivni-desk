symptoms = [
  { section = "General", text = "Marked symptoms of rheumatism and influenza.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Severe aching pains all over body.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pains left after influenza.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Head always shows signs of acute congestion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hay-fever, with marked aggravation from breathing the least dust.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Frequent urination and profuse watery diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Bursting pain, beginning in occiput and spreading all over.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Whole head and scalp feels sore, bruised, after pain has ceased.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Dull, heavy; pupils contracted; eyeballs feel contracted; aching in and around eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Eyes suffused.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Profuse, watery coryza; drops down throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Itching in anterior chamber; worse, breathing any dust; better, indoors.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Decided decrease in pulse rate with anxiety and apprehensiveness.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Voice husky.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pain in chest, extending to head.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarseness; constant desire to clear throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Expulsive cough, deep and harsh.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Chest oppressed; dry, hacking cough coming on at night and keeping one awake.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Constant dribbling in open air.", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Must rise at night to urinate.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Aching through back.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Dull pain in lumbar region.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Sharp pain in right deltoid and pectoralis muscles.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain deep in middle of right arm.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatic pain in right elbow and wrist, and hands of both sides.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Intense aching in lower limbs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Right crural neuralgia.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tingling along right ulnar nerve.", grade = 1, source = "boericke-mm-9" },
]

