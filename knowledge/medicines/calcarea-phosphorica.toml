symptoms = [
  { section = "General", text = "One of the most important tissue remedies, and while it has many symptoms in common with Calcarea carb, there are some differences and characteristic features of its own.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "It is especially indicated in tardy dentition and troubles incident to that period, bone disease non-union of fractured bones, and the anæmias after acute diseases and chronic wasting diseases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Anæmic children who are peevish, flabby, have cold extremities and feeble digestion.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "It has a special affinity where bones form sutures or symphyses, and all its symptoms are worse from any change of weather.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Numbness and crawling are characteristic sensations, and tendency to perspiration and glandular enlargement are symptoms it shares with the carbonate.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Scrofulosis, chlorosis and phthisis.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Peevish, forgetful; after grief and vexation (Ignat; Phos ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Always wants to go somewhere.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache, worse near the region of sutures, from change of weather, of school children about puberty.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Fontanelles remain open too long.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Cranial bones soft and thin.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Defective hearing.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache, with abdominal flatulence.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Head hot, with smarting of roots of hair.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Diffused opacity in cornea following abscess.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Swollen tonsils; cannot open mouth without pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Complaints during teething; teeth develop slowly; rapid decay of teeth.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Adenoid growths.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Infant wants to nurse all the time and vomits easily.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Craving for bacon, ham, salted or smoked meats.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Much flatulence.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Great hunger with thirst flatulence temporarily relieved by sour eructations.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Heartburn.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Easy vomiting in children.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "At every attempt to eat, colicky pain in abdomen.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Sunken and flabby.", grade = 2, source = "boericke-mm-9" },
