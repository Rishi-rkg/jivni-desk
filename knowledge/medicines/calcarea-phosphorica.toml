notes = [
  { section = "Relationship", text = "Complementary: Ruta; Hepar. Compare: Calcar hypophosphorosa (is to be preferred when it seems necessary to furnish the organism with liberal doses of phosphorus in consequence of continued abscesses having reduced the vitality. Give first and second decimal trits. Loss of appetite, rapid debility, night sweats; Acne pustulosa.--Pallor of skin, habitually cold extremities. Phthisis-diarrhœa and cough; acute pains in chest. Mesenteric tuberculosis. Bleeding from lungs; angina pectoris; asthma; affection of arteries. Veins stand out like whipcords. Attacks of pain occurring two hours after meals (relieved by a cup of milk or light food). Cheiranthus (effects of cutting wisdom teeth). Calcarea renalis -Lapis renalis--(arthritic nodosities. Rigg's disease; lessens tendency to accumulation of tartar on teeth; gravel and renal calculi). Conchilion.--Meter perlarum.--Mother of pearl (Osteitis.--Has a wide range of action in bone affections, especially when the growing ends are affected. Petechiæ). Silica; Psorin; Sulph.", source = "boericke-mm-9" },
  { section = "Dose", text = "First to third trituration. Higher potencies often more effective.", source = "boericke-mm-9" },
]

