  { section = "Stool", text = "Bleeding after hard stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Diarrhœa from juicy fruits or cider; during dentition.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Green, slimy, hot, sputtering, undigested, with fetid flatus.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Fistula in ano, alternating with chest symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Increased, with sensation of weakness.", grade = 1, source = "boericke-mm-9" },
