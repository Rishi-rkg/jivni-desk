notes = [
  { section = "Relationship", text = "Antimon iod; Lach; Arsenic iod; Myosotis. Levico, 5-10 drops, follows as an intercurrent where much debility is present (Burnett). Complementary: Calc phos; Kali carb. Compare: Its effects seem to be identical to that of Koch's Tuberculinum. Both are useful in the tubercular diathesis before phthisis had developed. In the early stages of tubercular disease of glands, joints, skin and bones. Psorinum. Seems to be its chronic equivalent. Bacillin testium acts especially on lower half of the body.", source = "boericke-mm-9" },
  { section = "Dose", text = "The does is important. Should not be given below the thirtieth and not repeated frequently. One dose a week often sufficient to bring about reaction. It is rapid in action, and good results ought to be seen, otherwise there is no need of repetition.", source = "boericke-mm-9" },
]

