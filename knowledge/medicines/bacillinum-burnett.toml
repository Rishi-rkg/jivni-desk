id = "bacillinum-burnett"
name = "Bacillinum burnett"
abbreviation = "Bac."
aliases = ["A Maceration of a Typical Tuberculous Lung introduced by Dr. Burnett", "Bacillinum"]

symptoms = [
  { section = "General", text = "Has been employed successfully in the treatment of tuberculosis; its good effects seen in the change of the sputum, which becomes decreased and more aerated and less purulent.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Many forms of chronic non-tubercular disease are influenced favorably by Bacillinum, especially when bronchorrhœa and dyspnœa are present.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Respiratory pyorrhea.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The patient expectorates less. Bacillinum is especially indicated for lungs of old people, with chronic catarrhal condition and enfeebled pulmonary circulation, attacks of suffocation at night with difficult cough.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Suffocative catarrh.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tubercular meningitis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Favors falling off of tartar of teeth.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Constant disposition to take cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Irritable, depressed.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Severe, deep-in headache, also as of a tight hoop.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Ringworm.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Eczema of eyelids.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Abdominal pains, enlarged lands in groins, tabes mesenterica.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Sudden diarrhœa before breakfast.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Obstinate constipation, with offensive flatus.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Oppression.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Catarrhal dyspnœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Humid asthma.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Bubbling rales and muco-purulent expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Note.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "This muco-purulent expectoration of bronchitic patients is equally poly-bacillary; it is a mixture of diverse species and hence Bacillinum is truly indicated (Cartier).", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Often relieves congestion of the lungs, thus paving way for other remedies in Tuberculosis.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Ringworm; pityriasis.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Eczema of eyelids.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Glands of neck enlarged and tender.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "night and early morning", source = "boericke-mm-9" },
