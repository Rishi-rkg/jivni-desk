id = "diosma-lincaris"
name = "Diosma lincaris"
abbreviation = "Diosm."
aliases = ["Buku-from Cape of Good Hope"]

symptoms = [
  { section = "General", text = "Pathogenically it produces: Somnolence; nervous insomnia; night sweats.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Erratic pains, with bad humor, desire to weep or fear of sickness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Violent vertigo.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cephalalgia, chiefly frontal, radiating to the occiput.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Eyes brilliant, with lachrymation or itching, the conditions accompanied by a species of stupefaction, with hardness of hearing or noises from aural pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Earthy face with disseminated rosaceous eruption.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nausea, fetid breath, with sensation of emptiness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation of meteorism, with stinging pains in the spleen.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Painful sensation in the abdomen, with pubic pressure-the pressure of the clothing becomes insupportable, with emission of high-colored, bloody urine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Frequent yellow diarrhœa, worse at night.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Catamenia abundant, anticipating, sometimes metrorrhagic in type; crampy pains on ingesting food.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation of heat or of cold in the hands, with convulsive movements of the fingers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Weakness of the legs, aggravated by sitting down.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Clinically, this pathogeny should be useful in cerebral affections with dullness or stupefaction; in convulsive or epileptiform attacks; in hysteria; in hepatitis (cirrhosis or atrophy); in hæmaturia with ovarian or uterine lesions.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "In splenitis, where it should surpass Ceanothus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Mental disorders in nervous or ascetic individuals, particularly where there is constant fear of death, or erotic or maniacal attacks.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gastralgia.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Gastro-enteritis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sudden fright, with trembling and weakness of the legs (Dr.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Leal La Rota).", grade = 1, source = "boericke-mm-9" },
]

