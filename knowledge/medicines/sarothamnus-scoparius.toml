id = "sarothamnus-scoparius"
name = "Sarothamnus scoparius"
abbreviation = "Saroth."
aliases = ["Broom", "Spartium scoparium - cystisus scoparius"]

symptoms = [
  { section = "General", text = "Spartein sulphate increase the strength of the heart, slows it and reduces the blood pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It continues the good effects of Veratrum and Digitalis without any of the undesirable effects of either (Hinsdale).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The effect of spartein sulphate (the alkaloid of Broom) is to cause a lowering of the systolic and diastolic pressures of the provers.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sphygmograms also show a condition of lowered blood-pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It depresses the heart by poisonous action exerted on the myocardium and this, with the stimulating action of the drug upon the vagus, accounts for the lowered blood pressure and reduced pulse rate.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It weakens the cardiac contraction.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The total amount of urine is increased.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The drug has, therefore, diuretic properties and is useful in dropsy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Albuminuria.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cheyne-Stokes respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Irregular heart following grip and various infections.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hypotension used palliatively in physiological dosage to combat arterial hypertension, arterio-sclerosis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Very useful hypodermically 1/10 to 1/4 grain in sustaining heart after stopping habit of Morphia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Spartium is indicated when primarily the muscles of the heart and especially the nervous apparatus is affected.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts rapidly and lasts three to four days.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Does not disturb digestion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nephritis.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Tobacco heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Angina pectoris.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Irregular action, disturbed rhythm due to gas, etc, feeble in nervous hysterical patients.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Myocardial degeneration, failing compensation.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Hypotension.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Spartein in 2 gr doses for water-logged cases, cannot lie down.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Here it produces much comfort.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Has specific action upon the kidneys, enabling them to eliminate and relieve the distress upon the heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Great accumulation of gas in gastro-intestinal canal, with mental depression.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Burning along urinary tract or in pudendum.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Profuse flow of urine.", grade = 2, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "For non-homeopathic use (palliative as above), one to two grains t.i.d by mouth, exerts a definite action upon the kidneys that will enable them to relieve the distress upon the heart. It is a safe drug and prompt in its action. Hypodermically, not less than 1/4 of a grain. Doses as high as 2 grains by mouth three times a day are safe (Hinsdale). Homeopathically. First to third trituration.", source = "boericke-mm-9" },
]

