symptoms = [
  { section = "General", text = "Hot days and cold nights towards the close of summer are especially favorable to the action of Dulcamara, and is one of the remedies that correspond in their symptoms to the conditions found as effects of damp weather, colds after exposure to wet, especially diarrhœa.", grade = 1, source = "boericke-mm-9" },
