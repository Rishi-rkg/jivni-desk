id = "baryta-muriatica"
name = "Baryta muriatica"
abbreviation = "Bar-m."
aliases = ["Barium Chloride"]

symptoms = [
  { section = "General", text = "The different salts of Baryta are called for in organic lesions of the aged and dwarfish, both mentally and physically.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Arterio-sclerosis and cerebral affections due to this condition.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Headaches, but without acute crisis, occurring in old people; heaviness rather than pain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Vertigo, due to cerebral anæmia and noises in ears.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts on lower alimentary canal, especially rectum; on muscles and joints, giving stiffness and weakness as from overwalking.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The white blood corpuscles increased.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hypertension and vascular degeneration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Increased tension of pulse.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Arterio-sclerosis (Aurum; Secale) where a high systolic pressure with a comparatively low diastolic tension is attended by cerebral and cardiac symptoms.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "This remedy has indurated and narrowing of the cardiac orifice with pain, immediately after eating, and epigastric tenderness, which has been repeatedly verified, also its use in aneurism and chronic hypertrophy of the tonsils.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Nymphomania and satyriasis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Convulsions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In every form of mania when the sexual desire is increased.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Icy coldness of body, with paralysis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Multiple sclerosis of brain and cord.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Voluntary muscular power gone but perfectly sensible.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Paresis after influenza and diphtheria.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "General feeling of lassitude in the morning, especially weakness of the legs, with muscular stiffness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Children who go around with their mouth open and who talk through the nose.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Stupid-appearing, hard of hearing.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Whizzing and buzzing.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Noises on chewing and swallowing, or sneezing.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Earache; better sipping cold water.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Parotids swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Offensive otorrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Inflates middle ear on blowing nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Difficult swallowing.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Tonsils enlarged.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Paresis of pharynx and eustachian tubes, with sneezing and noises.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Tubes feel too wide open.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Bronchial affection of old people with cardiac dilation.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Facilitates expectoration.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Great accumulation and rattling of mucus with difficult expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Arterio-sclerosis of the lung, thus in senile asthma, modifies the arterial tension.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gone feeling at epigastrium a good guiding symptom for it in chronic affections.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Retching and vomiting.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sensation of heat ascending to head.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Great increase in uric acid, diminution of chlorides.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Throbbing (Selen); induration of pancreas; abdominal aneurism.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Inguinal glands swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Spasmodic pain in rectum.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare in sclerotic degenerations, especially of spinal cord, liver, and heart. Plumbum met and Plumb iod. Also Aurum mur (which will often accomplish more in sclerotic and exudative degenerations than other remedies. Multiple sclerosis, fulgurating pains, tremors, Morvan's disease, hypertrophy of fingers).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third trituration. Bears repetition of dosage well.", source = "boericke-mm-9" },
]

