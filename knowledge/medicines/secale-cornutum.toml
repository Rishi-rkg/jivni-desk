notes = [
  { section = "Relationship", text = "Compare: Ergotin (Beginning arteriosclerosis progressing rather rapidly. Increased blood pressure: 2x trit. Œdema, gangrene and purpura hæmorrhagia: when Secale, though indicated, fails); Pedicularis Canadensis (Symptoms of locomotor ataxia; spinal irritation); Brassica napus -Rape-seed--(dropsical swellings, scorbutic mouth, voracious appetite, tympanitis, dropping of nails, gangrene); Cinnamon; Colch; Ars; Aurum mur. 2x (locomotor ataxia); Agrostema -Corn-cockle-active constituent is Saponin, which causes violent sneezing and sharp burning taste; burning in stomach, extends to œsophagus, neck and breast; (vertigo, headache, difficult locomotion, burning sensation); Ustilago; Carbo; Pituitrin (dilated os, little pain, no progress. Dose, 1/2 c, repeat in half hour, if necessary. Hypodermically contra-indicated in first stage of labor, valvular lesions or deformed pelvis). Antidotes: Camph; Opium.", source = "boericke-mm-9" },
  { section = "Dose", text = "First to thirtieth potency. Non-homeopathic use. In hæmorrhages of the puerperium, after the uterus in entirely emptied, when it fails to contract satisfactorily and in secondary puerperal hæmorrhage the result of incomplete involution of the uterus, give one-half to one dram of the fluid extract. Remember Pagot's law. \"As long as the uterus contains, anything, be it child, placenta, membranes, clots, never administer Ergot\".", source = "boericke-mm-9" },
]

