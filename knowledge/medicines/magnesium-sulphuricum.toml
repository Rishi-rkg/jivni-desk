id = "magnesium-sulphuricum"
name = "Magnesium sulphuricum"
abbreviation = "Mag-s."
aliases = ["Epsom Salt", "Magnesia sulphurica"]

symptoms = [
  { section = "General", text = "The skin, urinary, and female symptoms are most marked.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The purgative action of Sulphate of Magnesia is not a quality of the drug, but a quality of its physical state, which renders its absorption impossible.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The properties inherent in the substance itself can only be discovered by attenuation (Percy Wilde).", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Apprehensive; vertigo; head heavy during menses.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Eyes burn, noises in ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Frequent eructations, tasting like bad eggs.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Rising of water in mouth.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Stitches and burning in the orifice of the urethra after urinating.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Stream intermits and dribbles.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "The urine passed in the morning copious, bright yellow, soon becomes turbid, and deposits a copious red sediment.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "The urine is greenish as passed; is of a clear color, and in a large quantity.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Diabetes (Phos ac; Lact ac; Ars brom).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Thick leucorrhœa, as profuse as the menses, with weary pain in the small of the back and thighs, on moving about.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Some blood from the vagina between the menses.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menstruation returned after fourteen days; the discharge was thick, black, and profuse.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses too early, intermit.", grade = 1, source = "boericke-mm-9" },
  { section = "Neck and Back", text = "Bruised and ulcerative pain between the shoulders, with a feeling as of a lump as large as the first, on which account she could not lie upon her back or side; relieved by rubbing.", grade = 1, source = "boericke-mm-9" },
  { section = "Neck and Back", text = "Violent pain in the small of the back, as if bruised, and as before menstruation.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "The left arm and foot fall asleep in bed, in the morning after waking.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Small pimples over the whole body, that itch violently.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Suppressed itch (Sulph).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Crawling in the tips of the fingers of the left hand; better on rubbing.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Warts.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Erysipelas (applied locally as a saturated solution).", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Dropsy (physiological doses).", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill from 9 to 10 am.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Shuddering in back; heat in one part and chill in another.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "Magnes.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "Sulph is of diagnostic and therapeutic value in Gallstone colic.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "From 2 to 4 teaspoonfuls in glass hot water taken at onset of a colicky attack may abort or stop the colic.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "Epsom salt is one of the most active saline cathertics, operating with little pain or nausea, especially if pure.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "It has but little if any effect on intestinal peristalsis, its action causing a rush of fluid into the intestine, which by producing a distention of the bowel produces evacuation.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "It causes little or no irritation in the intestine.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "In common with the other salines, it is the classical evacuant to be employed in connection with mercurials and anthelmintics and in cases of poisoning.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "Epsom salt usually acts within from one to two hours, more quickly if taken in hot water and in the morning before breakfast.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "The ordinary dose as a mild laxative is a heaping teaspoonful; as a cathartic, two to four teaspoonfuls.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "The taste may be improved, if necessary, by the addition of a little lemon juice and sugar.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "Besides its chief use as a saline cathartic, magnesium sulphate is used to a considerable extent externally in saturated solution as an antiphlogistic and antipruritic in erysipelas, ivy poisoning, cellulitis and other local inflammations.", grade = 1, source = "boericke-mm-9" },
  { section = "Physiologic Dosage", text = "Use on compresses saturated with solution.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "It is claimed that the addition of a small amount of Magnes. Sulph to the usual hypodermic of Morphine increases the value of the hypodermic from 50 to 100 %.", source = "boericke-mm-9" },
  { section = "Dose", text = "The pure salt to the third potency. Locally 1:4 in water in septic conditions, erysipelas, orchitis, boils, etc.", source = "boericke-mm-9" },
]

