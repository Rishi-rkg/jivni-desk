id = "zincum-valerianicum"
name = "Zincum valerianicum"
abbreviation = "Zinc-val."
aliases = ["Valerinate of Zinc", "Zincum valerianum"]

symptoms = [
  { section = "General", text = "A remedy for neuralgia, hysteria, angina pectoris, and other painful affections, notably in ovarian affections.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Epilepsy without aura.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hysterical heart-pain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Facial neuralgia, violent in left temple and inferior maxillary.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sleeplessness in children.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Obstinate hiccough.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Violent, neuralgic, intermittent headaches.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Becomes almost insane with pain, which is piercing and stabbing.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Uncontrollable sleeplessness from pain in head with melancholy.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Ovaralgia; pain shoots down limbs, even too foot.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Severe pain in neck and spine.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cannot sit still; must keep legs in constant motion.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Sciatic neuralgia.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "First and second trituration. Must be continued for some time in treatment of neuralgia.", source = "boericke-mm-9" },
]

