symptoms = [
  { section = "General", text = "Has marked action on gastro-intestinal tract.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Increase the quantity of milk in nursing women.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Vomiting and purging.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Languor and weakness.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, occipital pain, congestive symptoms, buzzing in ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Face pale, twitching of mouth.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Anorexia with great thirst, burning in stomach, pyrosis, nausea profuse vomiting, pit of stomach sensitive.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Mouth dry.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rumbling with contraction of recti muscles, colic, incessant diarrhœa with purging.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rice water stools with cramps and chilliness.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Loose, incessant, painless, with painful cramps in muscles of extremities.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Anus inflamed.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Stools green, slimy, and bloody.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Fever, emaciation, somnolence.", grade = 1, source = "boericke-mm-9" },
]

