symptoms = [
  { section = "General", text = "Morning sickness, diabetes, and rheumatism offer a field for this remedy.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Troubles in the breasts.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Locally, in the tuberculous ulceration of vocal cords.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tongue dry, parched.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Thirst; voracious hunger.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Canker, copious salivation and water-brash.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea; morning sickness, especially in pale anæmic women.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hot, acrid eructation.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea; better, eating.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Burning, hot gas from stomach to throat, causing profuse secretion of tenacious mucus, worse smoking.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Fullness or lump like a puff ball.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Keeps swallowing.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Constricted low down.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Pain in breasts, with enlargement of axillary glands, and pain extends into hand.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatic pain in joints and shoulders, wrists, knees, with much weakness.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Trembling of whole body while walking.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Limbs feel chilly.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Large quantities passed, frequently.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Saccharine.", grade = 1, source = "boericke-mm-9" },
]

