symptoms = [
  { section = "General", text = "All spider poisons powerfully affect the nervous system (See tarentula, Mygale, etc).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "All symptoms of Aranea are characterized by periodicity, and coldness, and great susceptibility to dampness.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "It is the remedy for the constitution favorable to malarial poisoning, where every damp day or place favors chilliness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Patient feels cold to the very bones.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Coldness not relieved by anything.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Feeling as if parts were enlarged and heavier.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Wake up at night with hands feeling twice their natural size.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Spleen swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hydrogenoid Constitution, i.e, Abnormal sensitiveness to damp and cold, inability to live near fresh water, lakes, rivers, etc, or in damp, chilly places (Nat.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sulph.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Thuja).", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in right trifacial nerve from periphery inwards.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Confusion; better by smoking in open air.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Heat and flickering in eyes; worse in damp weather.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sudden violent pain in teeth at night immediately after lying down.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses too early, too copious.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Distention of abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Lumbo-abdominal neuralgia.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Pain in intercostal nerve from nerve endings to spine.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Bright red hæmorrhage from lungs (Millefol; Ferr phos).", grade = 2, source = "boericke-mm-9" },
