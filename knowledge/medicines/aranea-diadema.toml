  { section = "Abdomen", text = "Enlarged spleen.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Colic returns same hours.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Heaviness in lower abdomen, as of a stone.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Arms and legs feel as if asleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Bone-pains in extremities.", grade = 1, source = "boericke-mm-9" },
