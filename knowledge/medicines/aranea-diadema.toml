notes = [
  { section = "Relationship", text = "Tela aranearum -Spider's web.--Cardiac sleeplessness, increased muscular energy. Excitement and nervous agitation in febrile states. Dry asthma, harassing coughs; periodic headaches with extreme nervous erethism. Obstinate intermittents. Acts immediately on arterial system, pulse full, strong, compressible. Lowers pulse rate frequency. Masked periodical diseases, hectic, broken down patients. Symptoms come on suddenly with cool, clammy skin. Numbness of hands and legs when at rest. Continued chilliness. Aranea Scinencia -Grey Spider--(constant twitching of under eyelids. Sleepiness. Worse in warm room). Heloderma; Cedron; Arsenic.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture to thirtieth potency.", source = "boericke-mm-9" },
]

