  { section = "General", text = "Spigelia is an important remedy in pericarditis and other diseases of the heart, because the provings were conducted with the greatest regard for objective symptoms and the subjective symptoms are by innumerable confirmations proved to be correct (C.", grade = 1, source = "boericke-mm-9" },
