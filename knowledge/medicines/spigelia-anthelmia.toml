  { section = "General", text = "Neuralgia of the fifth nerve is very prominent in its effects.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Is especially adapted to anæmic, debilitated, rheumatic, and scrofulous subjects.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Stabbing pains.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Heart affections and neuralgia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Very sensitive to touch.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Parts feel chilly; send shudder through frame.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A remedy for symptoms due to the presence of worms.", grade = 1, source = "boericke-mm-9" },
