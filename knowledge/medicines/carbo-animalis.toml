notes = [
  { section = "Relationship", text = "The Carbon group all have putrid discharges and exhalations. All act on the skin, causing interrigo and excoriations. Glandular enlargements and catarrhal states, flatulency and asphyxiation. Carbon Tetrachlorid is said to cause fatty liver (Phosph; Ars; Chlorof). Paralysis of interosseus muscles of feet and hands. Wonderful clinical results in the treatment of Hook worm disease. See Thymol (Relationship). Complementary: Calc phos. Antidotes: Ars; Nux. Compare: Badiaga; Sepia; Sulph; Plumb iod.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency. The third trituration for insufflation in aural polypi.", source = "boericke-mm-9" },
]

