symptoms = [
  { section = "General", text = "Naja produces a typical bulbar paralysis (L.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Boyd).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Causes no hæmorrhage but only œdema, hence the victims of this reptile frequently bear very little sign of external injury a small scratch or puncture being the only indication where the fangs have worked their havoc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The tissue lying beneath the wound is colored dark purple, and a large quantity of viscid blood-like fluid collects in the vicinity of the wound.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "An intense burning pain at the spot bitten is the first symptom.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In man there follows an interval before fresh symptoms occur.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The average is about an hour.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Once developed, the symptoms follow a rapid course.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A feeling of intoxication is produced, followed by a loss of power over the limbs.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The patient is bereft of speech, swallowing, and the control over the movement of the lips.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The saliva is ejected in large quantities, the respiration gradually becomes slower and slower, and at length ceases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Conscious all time.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Is not a hæmorrhagic or septic, medicine like Lachesis and Crotalus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Its action settles around the heart; valvular troubles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Marked surging of blood upwards, marked dyspnœa, inability to lie on left side.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hypertrophy, and valvular lesions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Organs seem to be drawn together.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Very susceptible to cold.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "With heart symptoms, pain in forehead and temples.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Diseases, primarily depending upon degeneration of motor cells.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Control of sphincters lost.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Broods constantly over imaginary troubles.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Suicidal insanity (Aur).", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Depressed.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Aversion to talking.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Blurred speech.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Melancholy.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Dreads to be left alone.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Fear of rain.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in left temple and in left orbital region, extending to occiput, with nausea and vomiting.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Hay-fever, with dry larynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Suffocative spells after sleeping (Lach).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Eyes staring.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Ptosis of both lids.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Illusions of hearing; otalgia; chronic otorrhœa, black discharges; smells like herring brine.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Grasping at throat, with sense of choking.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Irritating, dry cough, dependent on cardiac lesions (Spong; Lauroc) Sticky mucus and saliva.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthmatic constriction in evening.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthma beginning with coryza.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Dragging and anxiety in præcordia.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Feeling of weight on heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Angina pains extending to nape of neck, left shoulder and arm with anxiety and fear of death.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "With the heart symptoms pain in forehead and temples.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Pulse irregular in force.", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "Threatened paralysis of heart, body cold, pulse slow, weak, irregular, tremulous.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Acute and chronic endocarditis.", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "Palpitation.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Stitching pain in region of heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Damaged heart after infections diseases.", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "Marked symptoms of low tension (Elaps, Vipera).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Neuralgia of left ovary; often serviceable in obscure pain in left groin, especially in post-operative cases; seems to be drawn to heart.", grade = 2, source = "boericke-mm-9" },
  { section = "Sleep", text = "Profound, like a log, with stertorous breathing, a typical reptilian state.", grade = 1, source = "boericke-mm-9" },
]

