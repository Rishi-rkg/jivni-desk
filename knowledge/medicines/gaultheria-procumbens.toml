id = "gaultheria-procumbens"
name = "Gaultheria procumbens"
abbreviation = "Gaul."
aliases = ["Wintergreen", "Gaultheria"]

symptoms = [
  { section = "General", text = "Inflammatory rheumatism, pleurodynia, sciatica, and other neuralgias, come within, the sphere of this remedy.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Cystic and prostatic irritation, undue sexual excitement, and renal inflammation.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Neuralgia of head and face.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Acute gastritis, severe pain in epigastrium; prolonged vomiting.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Uncontrollable appetite, notwithstanding irritable stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gastralgia from nervous depression (Give five drops of 1x of Oil).", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Smarting and burning.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Intense erythema, worse, cold bathing; better, olive oil and cool air blowing on part.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Spiræea. Gaultheria contains Arbutin. Salycyl acid. Methylium salicylicum (an artificial Gaultheria oil for rheumatism, especially when the salicylates cannot be used. Pruritus and epididymitis, locally). After Cantharis in burns.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture and lower potencies.", source = "boericke-mm-9" },
]

