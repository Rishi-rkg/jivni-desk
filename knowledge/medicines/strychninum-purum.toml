  { section = "Relationship", text = "Compare: Eucalyptus (neutralizes ill effects of Strychnin). Strych ars (Paresis in the aged, relaxed musculature. Prostration. Psoriasis; chronic diarrhœa with paralytic symptoms; compensatory hypertrophy of heart with beginning fatty degeneration; marked dyspnœa when lying down; œdema of lower extremities, urine scanty, high specific gravity, heavily loaded with glucose. Diabetes. 6x trit). Strych et Ferr cit (chlorotic and paralytic conditions; dyspepsia, with vomiting of ingesta; 2x and 3x trit); Strychnin nit (2x and 3x. Said to remove craving for alcohol. Use for two weeks); Strychnin sulph (Gastric atony); Strych valerin (exhaustion of brain-power; women of high nervous erethism; 2x trit). Compare: Cicuta; Arnica (tetanus).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency. For non-homeopathic use, to produce its direct physiological effects in paralysis the dose will range from one-fiftieth to one-twentieth of a grain, repeated three times a day. Under twelve years of age, one-fiftieth to one two-hundredth of a grain. Strych, hypodermically, is capable of arresting progressive muscular atrophy, and is a certain stimulant to the respiratory centers, and is useful in embarrassed breathing, in the course of pneumonia especially. Is an antidote to Chloral, used in asphyxia from gas and chloroform and early stages of Opium poisoning. Dose, one one-hundredth to one-sixtieth grain every three hours.", source = "boericke-mm-9" },
]

