id = "chelone-glabra"
name = "Chelone glabra"
abbreviation = "Chelo."
aliases = ["Snakehead", "Chelone"]

symptoms = [
  { section = "General", text = "A remedy in liver affections with pain or soreness of the left lobe of the liver and extending downwards.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dumb ague.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Soreness of external parts, as if skin were off; debility.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Malaise, following intermittents.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dyspepsia with hepatic torpor.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Round and thread worms.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "It is an enemy to every kind of worm infesting the human body.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Tincture, in one to five drop doses.", source = "boericke-mm-9" },
]

