  { section = "Mind", text = "Delirium, with singing, dancing and funny gestures.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Everything appears strange and terrible.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Confounds present with the past; feels like a child.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Stupid feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Melancholy, with indifference.", grade = 1, source = "boericke-mm-9" },
