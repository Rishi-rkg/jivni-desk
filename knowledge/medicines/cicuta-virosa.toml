  { section = "General", text = "The action on the nervous system, producing spasmodic affections, viz, hiccough, trismus, tetanus, and convulsions, give the pathological picture calling especially for this remedy, whenever this is further characterized, by the more individual symptoms of the drug.", grade = 1, source = "boericke-mm-9" },
