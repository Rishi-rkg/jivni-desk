  { section = "Mind", text = "Epilepsy; moaning and whining.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Vivid dreams.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Head turned or twisted to one side.", grade = 2, source = "boericke-mm-9" },
