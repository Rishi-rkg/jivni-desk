notes = [
  { section = "Relationship", text = "Antidotes: Ammon carb; Camph. Salt inhibits the action of Brom. Compare: Conium; Spongia; Iod; Aster; Arg nit. Avoid milk when taking Brom. Hydrobromic acid (Throat dry and puckering; constriction in pharynx and chest; waves of heat over face and neck; pulsating tinnitus with great nervous irritability (Houghton); vertigo, palpitation; arms heavy; seemed as if parts did not belong to him. Seems to have a specific effect on the inferior cervical ganglion, increasing the tonic action of the sympathetic, thus promoting vaso-constriction. Relieves headache, tinnitus and vertigo, especially in vaso-motor stomach disturbance. Dose, 20 minims).", source = "boericke-mm-9" },
  { section = "Dose", text = "First to third attenuation. Must be prepared fresh, as it is liable to rapid deterioration.", source = "boericke-mm-9" },
]

