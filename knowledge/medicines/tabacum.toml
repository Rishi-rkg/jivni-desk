aliases = ["Tobacco"]

symptoms = [
  { section = "General", text = "The symptomatology of Tabacum is exceedingly well marked.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The nausea, giddiness, death-like pallor, vomiting, icy coldness, and sweat, with the intermittent pulse, are all most characteristic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Has marked antiseptic qualities, antidotal to cholera germs.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Complete prostration of the entire muscular system.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Collapse.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gastralgia, enteralgia, seasickness, cholera infantum; cold, but wants abdomen uncovered.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Vigorous peristaltic activity diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Produces high tension and arteriosclerosis of the coronary arteries.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Should prove the most homeopathic drug for angina pectoris, with coronaritis and high tension (Cartier).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Constriction of throat, chest, bladder, rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pallor, breathlessness, hard-cordlike pulse.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Sensation of excessive wretchedness.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Very despondent.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Forgetful.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Discontented.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo on opening eyes; sick headache, with deathly nausea; periodical.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Tight feeling as from a band.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sudden pain, as if struck by a hammer.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nervous deafness.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Secretion from eyes, nose and mouth increased.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Dim sight; sees as through a veil; strabismus.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Amaurosis; muscæ volitantes.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Central scotoma.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Rapid blindness without lesion, followed by venous hyperæmia and atrophy of optic nerve.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Pale, blue, pinched, sunken, collapsed, covered with cold sweat (Ars; Verat).", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Freckles.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Nasopharyngitis and tracheitis, hemming, morning cough, sometimes with vomiting.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Hoarseness of public speakers.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Incessant nausea; worse, smell of tobacco smoke (Phos); vomiting on least motion, sometimes of fecal matter, during pregnancy with much spitting.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Seasickness; terrible faint, sinking feeling at pit of stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sense of relaxation of stomach, with nausea (Ipec).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gastralgia; pain from cardiac end extending to left arm.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Wants abdomen uncovered.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "It lessens the nausea and vomiting.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Painful distension.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Incarcerated hernia.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Constipation; rectum paralyzed, prolapsed.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Diarrhœa, sudden, watery, with nausea and vomiting, prostration, and cold sweat; discharges look like sour milk, thick, curdled, watery.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Rectal tenesmus.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Renal colic; violent pain along ureter, left side.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Palpitation when lying on left side.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Pulse intermits, feeble, imperceptible.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Angina pectoris, pain in præcordial region.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Pain radiates from center of sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Tachycardia.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Bradycardia.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Acute dilatation caused by shock or violent physical exertion (Royal).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Difficult, violent constriction of chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Præcordial oppression, with palpitation and pain between shoulders.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough followed by hiccough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough dry, teasing, must take a swallow of cold water (Caust; Phos).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dyspnœa, with tingling down left arm when lying on left side.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Legs and hands icy cold; limbs tremble.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Paralysis following apoplexy (Plumb).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Gait shuffling, unsteady.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Feebleness of arms.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Insomnia with dilated heart, with cold, clammy skin and anxiety.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chills, with cold sweat.", grade = 2, source = "boericke-mm-9" },
  { section = "Antidotes", text = "Vinegar; sour apples.", grade = 1, source = "boericke-mm-9" },
  { section = "Antidotes", text = "Camphor in the physiological antagonist.", grade = 2, source = "boericke-mm-9" },
  { section = "Antidotes", text = "Ars (chewing tobacco); Ign; (smoking); Sep (neuralgia and dyspepsia); Lycop (impotency); Nux (bad taste due to tobacco); Calad and Plantag (cause aversion to tobacco); Phosph (tobacco heart, sexual weakness).", grade = 2, source = "boericke-mm-9" },
]

