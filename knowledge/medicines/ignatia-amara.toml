id = "ignatia-amara"
name = "Ignatia amara"
abbreviation = "Ign."
aliases = ["St. Ignatius Bean", "Ignatia"]

symptoms = [
  { section = "General", text = "Produces a marked hyperæsthesia of all the senses, and a tendency to clonic spasms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Mentally, the emotional element is uppermost, and co-ordination of function is interfered with.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Hence, it is one of the chief remedies for hysteria.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is especially adapted to the nervous temperament-women of sensitive, easily excited nature, dark, mild disposition, quick to perceive, rapid in execution.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Rapid change of mental and physical condition, opposite to each other.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great contradictions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Alert, nervous, apprehensive, rigid, trembling patients who suffer acutely in mind or body, at the same time made worse by drinking coffee.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The superficial and erratic character of its symptoms is most characteristic.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Effects of grief and worry.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Cannot bear tobacco.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain is small, circumscribed spots (Oxal ac).", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The plague.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Hiccough and hysterical vomiting.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Changeable mood; introspective; silently brooding.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Melancholic, sad, tearful.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Not communicative.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Sighing and sobbing.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "After shocks, grief, disappointment.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feels hollow, heavy; worse, stooping.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Headache as if a nail were driven out through the side.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Cramp-like pain over root of nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Congestive headaches following anger or grief; worse, smoking or smelling tobacco, inclines head forward.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Asthenopia, with spasms of lids and neuralgic pain about eyes (Nat m).", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Flickering zigzags.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Twitching of muscles of face and lips.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Changes color when at rest.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Sour taste.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Easily bites inside of cheeks.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Constantly full of saliva.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Toothache; worse after drinking coffee and smoking.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Feeling of a lump in throat that cannot be swallowed.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Tendency to choke, globus hystericus.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Sore throat; stitches when not swallowing; better, eating something solid.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Stitches between acts of swallowing.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Stitches extend to ear (Hep).", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Tonsils inflamed, swollen, with small ulcers.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Follicular tonsillitus.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sour eructation.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "All-gone feeling in stomach; much flatulence; hiccough.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Cramps in stomach; worse slightest contact.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Averse to ordinary diet; longs for great variety of indigestible articles.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Craving for acid things.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sinking in stomach, relieved by taking a deep breath.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rumbling in bowels.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Weak feeling in upper abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Throbbing in abdomen (Aloe; Sang).", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Colicky, griping pains in one or both sides of abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Itching and stitching up the rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Prolapse.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Stools pass with difficulty; painful constriction of anus after stool.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Stitches in hæmorrhoids during cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Diarrhœa from fright.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Stitches from anus deep into rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Hæmorrhage and pain; worse when stool is loose.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Pressure as of a sharp instrument from within outward.", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Profuse, watery (Phos ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry, spasmodic cough in quick successive shocks.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Spasm of glottis (Calc).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Reflex coughs.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Coughing increases the desire to cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Much sighing.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hollow spasmodic cough, worse in the evening, little expectoration, leaving pain in trachea.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses, black, too early, too profuse, or scanty.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "During menses great languor, with spasmodic pains in stomach and abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Feminine sexual frigidity.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Suppression from grief.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Jerking of limbs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in tendo-Achillis and calf.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Ulcerative pain in soles.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Very light.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Jerking of limbs on going to sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Insomnia from grief, cares, with itching of arms and violent yawning.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Dreams continuing a long time; troubling him.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill, with thirst; not relieved by external heat.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "During fever, itching; nettle-rash all over body.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching, nettle-rash.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Very sensitive to draught of air.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Excoriation, especially around vagina and mouth.", grade = 1, source = "boericke-mm-9" },
]

