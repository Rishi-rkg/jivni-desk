notes = [
  { section = "Relationship", text = "Compare: Ipomea-Convolvulus Duratinus -Morning Glory. --(Pain in left lumbar muscles on stooping. Kidney disorders with pain in back. Much abdominal flatulence. Aching in top of right shoulder renal colic; aching in small of back and extremities), Aloe; Lycopod; Nux; Sarsap. Xanthorrhea arborea (severe pain in kidneys, cystitis and gravel. Pain from ureter to bladder and testicles; pain in small of back returns from least chill or damp). Xanthoriza apifolia -Shrub Yellow Root--contains Berberine. Dilatation of stomach and intestines, atony, enlarged spleen. Antidotes: Camphor; Bell.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, to sixth potency.", source = "boericke-mm-9" },
]

