id = "berberis-vulgaris"
name = "Berberis vulgaris"
abbreviation = "Berb."
aliases = ["Barberry"]

symptoms = [
  { section = "General", text = "Rapid change of symptoms-pains change in regard to place and character-thirst alternates with thirstlessness, hunger, and loss of appetite, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts forcibly on the venous system, producing pelvic engorgements and hæmorrhoids.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hepatic, and rheumatic affections, particularly with urinary, hæmorrhoidal and menstrual complaints.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Old gouty constitutions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain in region of kidneys is most marked; hence its use in renal and vesical troubles, gall-stones, and vesical catarrh.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It causes inflammation of kidneys with hæmaturia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pains may be felt all over body, emanating from small of back.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It has also marked action on the liver, promoting the flow of bile.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Often called for in arthritic affections with urinary disturbances.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Wandering, radiating pains.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Acts well in fleshy persons, good livers, but with little endurance.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Spinal irritation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "All Berberis pains radiate, are not worse by pressure, but worse in various attitudes, especially standing and active exercise.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Listless, apathetic, indifferent.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Puffy sensation, feeling as if becoming larger.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo with attacks of fainting.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Frontal headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Chilliness in back and occiput.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Tearing pain in auricle, and gouty concretions.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sensation of a tight cap pressing upon the whole scalp.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Dry; obstinate catarrh of left nostril.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Crawling in nostrils.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Pale, sickly.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Sunken cheeks and eyes, with bluish circles.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Sticky sensation.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Diminished saliva.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Sticky, frothy saliva, like cotton (Nux mosch).", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue feels scalded, vesicles on tongue.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea before breakfast.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Heartburn.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Stitches in region of gall-bladder; worse, pressure, extending to stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Catarrh of the gall-bladder with constipation and yellow complexion.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Stitching pain in front of kidneys extending to liver, spleen, stomach, groins, Poupart's ligament.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Sticking deep in ilium.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Constant urging to stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Diarrhœa painless, clay-colored, burning, and smarting in anus and perineum.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Tearing around anus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Fistula in ano.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Burning pains.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Sensation as if some urine remained after urinating.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Urine with thick mucus and bright-red, mealy sediment.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Bubbling, sore sensation in kidneys.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Pain in bladder region.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Pain in the thighs and loins on urinating.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Frequent urination; urethra burns when not urinating.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Neuralgia of spermatic cord and testicles.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Smarting, burning, stitching in testicles, in prepuce and scrotum.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pinching constriction in mons veneris, vaginismus, contraction and tenderness of vagina.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Burning and soreness in vagina.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Desire diminished, cutting pain during coition.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses scanty, gray mucus, with pain in kidneys and chilliness, pain down thighs.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Leucorrhœa, grayish mucus, with painful urinary symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Neuralgia of ovaries and vagina.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarseness; polypus of larynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tearing stitches in chest and region of heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Stitches in neck and back; worse, respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Sticking pain in region of kidneys radiating thence around abdomen, to hips and groins.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Numb, bruised sensation.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Stitches from kidneys into bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Tearing, sticking with stiffness, making rising difficult, involving hips, nates, limbs, with numbness.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Lumbago (Rhus; Tart em).", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Metatarsus and metacarpus feel sprained.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Post-operative pain in lumbar region; soreness with sharp pain following course of circumflex iliac nerve to bladder with frequent urination.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatic paralytic pain in shoulders, arms, hands and fingers, legs and feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Neuralgia under finger-nails, with swelling of finger-joints.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Sensation of cold on outside of thighs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Heels pain, as if ulcerated.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Stitching between metatarsal bones as from a nail when standing.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in balls of feet on stepping.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Intense weariness and lameness of legs after walking a short distance.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Flat warts.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching, burning and smarting; worse, scratching; better, cold applications.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Small pustules over whole body.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Eczema of anus and hands.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Circumscribed pigmentation following eczematous inflammation.", grade = 2, source = "boericke-mm-9" },
  { section = "Fever", text = "Cold sensation in various parts, as if spattered with cold water.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Warmth in lower part of back, hips, and thighs.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "motion, standing", source = "boericke-mm-9" },
  { kind = "note", text = "It brings on, or increases, urinary complaints.", source = "boericke-mm-9" },
]

