  { section = "Urine", text = "Constant dribbling.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Diabetes, large quantities of urine of low specific gravity (Phos ac; Acet ac).", grade = 2, source = "boericke-mm-9" },
