id = "formalinum"
name = "Formalinum"
abbreviation = "Formal."
aliases = ["Aqueous Solution (35 per cent) of Formaldehyde Gas", "Formalin"]

symptoms = [
  { section = "General", text = "Is a powerful disinfectant and deodorant; a potent poison.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Prevents growth and kills almost any pathogenic micro-organism.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It seems to have the peculiar property of eating into malignant tumors, leaving the surrounding healthy tissue uncharred and unchanged.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A plug of cotton wool soaked in a 20 per cent solution of Formaldehyde, and applied for a few hours, will produce a necrotic slough, which must be scraped away before the next application, otherwise it hardens.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Formalin in hot water as vapor most valuable therapeutic agent in pertussis, phthisis, in catarrhal affections of upper air-passages.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Forgetfulness.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Anxiety.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Unconscious.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Coryza; eyes water; vertigo.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Ptyalism, thick saliva; loss of taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Food feels as if it were a ball in stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Burning in mouth and stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Intense urging to stool, watery stools.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Anuria; albuminous urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dyspnœa.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Laryngismus stridulus.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Whooping-cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chills in forenoon, followed by long fever.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Bones ache during whole paroxysm.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "During fever forgets where he was.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Puckers skin like leather; wrinkles; scales off.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Eczema in neighborhood of wound.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Damp sweat most marked on right upper extremity.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Antidote: Ammonia water. Compare: Ammonium formaldehyde, known commercially as Cystogen (Dose, five to seven grains two to four times daily, dissolved in hot water, after meals. Prevents the decomposition of urine in the bladder, kidneys, and ureters. Turbid urine rendered clear and non-irritating; phosphatic deposits dissolved, and growth of pyogenic bacteria arrested). Also, Urotropin (A diuretic and solvent of uric acid concretions; relieves cystitis associated with putrefaction. Three to five grains well diluted. When administered invariably appears in the cerebro-spinal fluid and therefore advised in threatened meningeal infection).", source = "boericke-mm-9" },
  { section = "Dose", text = "As vapor in hot water in respiratory affections; 1 per cent spray, otherwise 3x potency.", source = "boericke-mm-9" },
]

