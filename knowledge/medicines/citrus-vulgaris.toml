notes = [
  { section = "Relationship", text = "Citrus decumana -Grape-fruit (Tinnitus, head noises and ringing in ears. Sensation of pressure in the temporal region). Aurantium -Orange (neuralgic and skin symptoms. Itching, redness and swelling of hands. Diseases of the aged with coldness and chilliness. Boiled dried orange peel excites the intestine in a manner similar to other forms of cellulose or agar. There is an increased flow of bile which continues for hours. It unites both a cholagogue action with a mechanical stimulus to peristalsis). Compare: Citrus Limonum (scorbutus, sore throat and cancer pains; checks excessive menstruation). (Citric Acid.--Useful in scurvy and chronic rheumatism and hæmorrhages. All forms of Dropsy are benefited with Citric acid and lemon juice, tablespoonful every 3-4 hours. Pain from cancer of tongue. Used as a local application and mouth wash, one dram to 8 ozs of water. For cancer pains generally, often effective).", source = "boericke-mm-9" },
]

