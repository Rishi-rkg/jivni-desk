symptoms = [
  { section = "General", text = "A drug having a marked action on the alimentary canal and respiratory organs.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is indicated in incipient phthisis, with hard, racking cough, bloody expectoration, arterial hæmorrhage, but no febrile disturbance.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Very weak in the morning, gains strength during day.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Progressive emaciation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "All pathological hæmorrhages having notably a morning aggravation.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Cough dry, hard, followed by hæmoptysis; worse in morning and at night.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Constant and severe pain in chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Blood bright red and not profuse in morning; dark and clotted in afternoon.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Pulse soft and compressible.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Burning in pharynx, œsophagus, and stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Burning in intestines.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Spluttering diarrhœa with forcible expulsion of noisy flatus, bearing down pains and tenesmus.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rumbling distention, and griping pain in abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rectal hæmorrhage; worse in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching and circumscribed furuncle-like swellings.", grade = 1, source = "boericke-mm-9" },
]

