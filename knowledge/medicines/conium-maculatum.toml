  { section = "Stool", text = "Frequent urging; hard, with tenesmus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Tremulous weakness after every stool. (Verat.; Ars.; Arg. n.) Heat and burning in rectum during stool.", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Much difficulty in voiding.", grade = 1, source = "boericke-mm-9" },
