symptoms = [
  { section = "General", text = "CONIUM MACULATUM Poison Hemlock (CONIUM) An old remedy, rendered classical by Plato's graphic description of its employment in the death of Socrates.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The ascending paralysis it produces, ending in death by failure of respiration, shows the ultimate tendency of many symptoms produced in the provings, for which Conium is an excellent remedy, such as difficult gait, trembling, sudden loss of strength while walking, painful stiffness of legs. etc.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Such a condition is often found in old age, a time of weakness, languor, local congestions, and sluggishness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This is the special environment that Conium choose to manifest its action.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It corresponds to the debility, hypochondriasis, urinary troubles, weakened memory, sexual debility found here.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Trouble at the change of life, old and bachelors.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Growth of tumors invite it also.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "General feeling as if bruised by blows.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great debility in the morning in bed.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Weakness of body and mind, trembling, and palpitation.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Cancerous diathesis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Arterio-sclerosis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Caries of sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Enlarged glands.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts on the glandular system, engorging and indurating it, altering its structure like scrofulous and cancerous conditions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tonic after grippe.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Insomnia of multiple neuritis.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Excitement causes mental depression.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Depressed, timid, averse to society, and afraid of being alone.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "No inclination for business or study; takes no interest in anything.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Memory weak; unable to sustain 'any mental effort.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, when lying down, and when turning over in bed, when turning head sidewise, or turning eyes; worse, shaking head, slight noise or conversation of others, especially towards the left.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Headache, stupefying, with nausea and vomiting of mucus, with a feeling as of foreign body under the skull.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Scorched feeling on top.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Tightness as if both temples were compressed; worse after a meal. (Gels.; Atropine.) Bruised, semilateral pains.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Dull occipital pain on rising in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Photophobia and excessive lachrymation.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Corneal pustules.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Dim-sighted; worse, artificial light.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "On closing eyes, he sweats.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Paralysis of ocular muscles. (Caust.) In superficial inflammations, as in phlyctenular conjunctivitis and keratitis.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "The slightest ulceration or abrasion will cause the intensest photophobia.", grade = 2, source = "boericke-mm-9" },
  { section = "Ears", text = "Defective hearing; discharge from ear blood colored.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Bleeds easily-becomes sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Polypus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Soreness about the root of tongue.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Terrible nausea, acrid heartburn and acid eructations; worse on going to bed.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Painful spasms of the stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Amelioration from eating and aggravation a few hours after meals; acidity and burning; painful spot the level of the sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Severe aching in and around the liver.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Chronic jaundice, and pains in right hypochondrium.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Sensitive, bruised, swollen, knife-like pains.", grade = 1, source = "boericke-mm-9" },
