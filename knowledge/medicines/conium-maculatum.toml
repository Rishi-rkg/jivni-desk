  { section = "Respiratory", text = "Dry cough, almost continuous, hacking; worse, evening and at night; caused by dry spot in larynx with itching in chest and throat, when lying down, talking or laughing, and during pregnancy.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Expectoration only after long coughing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Want of breath on taking the least exercise; oppressed breathing, constriction of chest; pains in chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Dorsal pain between shoulders.", grade = 1, source = "boericke-mm-9" },
