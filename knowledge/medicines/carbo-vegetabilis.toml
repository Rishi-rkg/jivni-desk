symptoms = [
  { section = "General", text = "Disintegration and imperfect oxidation is the keynote of this remedy.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The typical Carbo patient is sluggish, fat and lazy and has a tendency to chronicity in his complaints.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Blood seems to stagnate in the capillaries, causing blueness, coldness, and ecchymosis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Body becomes blue, icy-cold.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bacteria find a rich soil in the nearly lifeless stream and sepsis and typhoidal state ensues.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A lowered vital power from loss of fluids, after drugging; after other diseases; in old people with venous congestions; states of collapse in cholera, typhoid; these are some of the conditions offering special inducements to the action of Carbo veg.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The patient may be almost lifeless, but the head is hot; coldness, breath cool, pulse imperceptible, oppressed and quickened respiration, and must have air, must be fanned hard, must have all the windows open.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This is a typical state for Carbo veg.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The patient faints easily, is worn out, and must have fresh air.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hæmorrhage from any mucous surface.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Very debilitated.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Patient seems to be too weak to hold out.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Persons who have never fully recovered from the effects of some previous illness.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sense of weight, as in the head (occiput), eyes and eyelids, before the ears, in the stomach, and elsewhere in the body; putrid (septic) condition of all its affections, coupled with a burning sensation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "General venous stasis, bluish skin, limbs cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Aversion to darkness.", grade = 1, source = "boericke-mm-9" },
