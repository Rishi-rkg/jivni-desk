id = "corallium-rubrum"
name = "Corallium rubrum"
abbreviation = "Cor-r."
aliases = ["Red Coral", "Corallium"]

symptoms = [
  { section = "General", text = "The provings of coral develop much coryza and epistaxis, and even ulceration within the nostrils.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is to be thought of for whooping and spasmodic coughs, especially when the attack comes on with a very rapid cough, and the attacks follow so closely as to almost run into each other.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Often preceded by sensation of smothering, followed by exhaustion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Congestion of face after dinner.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Patient becomes purple in face.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Violence of paroxysm, even with expectoration of blood.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Feeling as if cold air were streaming through skull and air-passages.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "One is too cold when uncovered and too hot when covered; relieved by artificial heat.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feels very large; violent pain as if parietal bones were forced apart; worse stooping.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Eyes hot and painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Deep-seated frontal headache with severe pain back of eyeballs.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain aggravated by breathing cold air through nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Odors of smoke, onions, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Painful ulcer in nostrils.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Post-nasal catarrh.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Profuse secretion of mucus dropping through posterior nares; air feels cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Dry coryza; nose stopped up and ulcerated.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Epistaxis.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Food tastes like sawdust.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Bread tastes like straw.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Beer tastes sweet.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Pain in articulation of left lower jaw.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Craves salt.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hawking of profuse mucus.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Throat very sensitive, especially to air.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Profuse, nasal catarrh.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Inspired air feels cold (Cistus).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Profuse secretion of mucus dropping through posterior nares.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry, spasmodic, suffocative cough; very rapid cough, short, barking.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough with great sensitiveness of air-passages; feel cold on deep inspiration.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Continuous hysterical cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Feels suffocated and greatly exhausted after whooping-cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Ulcers on glans and inner prepuce, with yellow ichor.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Emissions and weakened sexual power.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Profuse perspiration of genitals.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Red, flat ulcers.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Coral-colored, then dark red spots, changing to copper-colored spots.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Psoriasis of palms and soles.", grade = 1, source = "boericke-mm-9" },
]

