notes = [
  { section = "Relationship", text = "Complementary: Bry; Calc fluor. Phytol (Rheumatism). In urticaria follow with Bovista. Inimical: Apis. Antidotes: Bathing with milk and Grindelia lotion very effective. Ampelopsis Trifolia -Three-leaf Woodbine--(Toxic dermatitis due to vegetable poisons-30 and 200. Very similar to Rhus poisoning). Desensitizing against Ivy poisoning by the use of descending doses of the tincture by mouth or by hypodermic injections is recommended by old school authorities, but is not as effective as the homeopathic remedies especially Rhus 30 and 200 and Anacard, etc. Anacard; Croton; Grindelia; Mezer; Cyprip; Plumbago (eczema of vulva); Graph. Compare: Rhus radicans (almost identical action); characteristics are, burning in tongue, tip feels sore, pains are often semilateral and in various parts, often remote and successive. Many symptoms are better after a storm has thoroughly set in, especially after an electric storm. Has pronounced yearly aggravation (Laches). Rhus radicans has headache in occiput even pain in nape of neck and from there pains draw over the head forwards. Rhus diversiloba -California Poison-oak (antidote to Rhus; violent skin symptoms, with frightful itching; much swelling of face, hands and genitals; skin very sensitive; eczema and erysipelas, great nervous weakness, tired from least effort; goes to sleep from sheer exhaustion); Xerophyllum (dysmenorrhœa and skin symptoms). Compare, also; Arn; Bapt; Lach; Ars; Hyos; Op (stupefaction more profound). Mimosa -Sensitive Plant--(rheumatism, knee stiff, lancinating pains in back and limbs. Swelling of ankles Legs tremble).", source = "boericke-mm-9" },
  { section = "Dose", text = "Sixth to thirtieth potency. The 200th and higher are antidotal to poisoning with the plant and tincture.", source = "boericke-mm-9" },
]

