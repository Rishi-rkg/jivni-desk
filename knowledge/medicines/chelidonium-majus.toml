notes = [
  { section = "Relationship", text = "Chelidonin.--(Spasm of smooth muscle everywhere, intestinal colic, uterine colic, bronchial spasm, tachycardia, etc). Boldo -Boldoa fragrans--(Bladder atony; cholecystitis and biliary calculus. Bitter taste, no appetite; constipation, hypochondriasis languor, congestion of liver; burning weight in liver and stomach. Painful hepatic diseases. Disturbed liver following malaria). Elemuy Gauteria --(Stones in kidneys and bladder; grain doses of powdered bark in water or 5 drops of tincture. Pellagra). Sulph often completes its work. Complementary: Lycop; Bryon. Antidote: Chamom. Compare: Nux; Sulph; Bry; Lyc; Opium; Podophyl; Sanguin; Ars.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture and lower attenuations.", source = "boericke-mm-9" },
]

