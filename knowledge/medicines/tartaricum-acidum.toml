id = "tartaricum-acidum"
name = "Tartaricum acidum"
abbreviation = "Tart-ac."
aliases = ["Tartaric Acid"]

symptoms = [
  { section = "General", text = "Found in grapes, pineapple, sorrel and other fruits.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is an antiscorbutic antiseptic, stimulating the mucous and salivary secretions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dullness and lassitude.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great weakness, with diarrhœa, with dry and brown tongue.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain in heels (Phytol).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Excessive thirst, continued vomiting burning in throat and stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Dyspepsia with copious secretions of mucus.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain around umbilicus and region of loins.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Stool color of coffee-grounds (worse at night), with brown and dry tongue, and dark-green vomiting.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Third trituration. The pure acid 10-30 grains dissolved in water.", source = "boericke-mm-9" },
]

