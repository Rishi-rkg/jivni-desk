id = "nux-vomica"
name = "Nux vomica"
abbreviation = "Nux-v."
aliases = ["Poison-nut"]

symptoms = [
  { section = "General", text = "Is the greatest of polychrests, because the bulk of its symptoms correspond in similarity with those of the commonest and most frequent of diseases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is frequently the first remedy, indicated after much dosing, establishing a sort of equilibrium of forces and counteracting chronic effects.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nux is pre-eminently the remedy for many of the conditions incident to modern life.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The typical Nux patient is rather thin, spare, quick, active, nervous, and irritable.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "He does a good deal of mental work; has mental strains and leads a sedentary life, found in prolonged office work, overstudy, and close application to business, with its cares and anxieties.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This indoor life and mental strain seeks stimulants, coffee, wine, possibly in excess; or, again, he hopes to quiet his excitement, by indulging in the sedative effects of tobacco, if not really a victim, to the seductive drugs, like opium, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "These things are associated with other indulgences; at table, he takes preferably rich and stimulating food; wine and women play their part to make him forget the close application of the day.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Late hours are a consequence; a thick head, dyspepsia, and irritable temper are the next day's inheritance.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Now he takes some cathartic, liver pills, or mineral water, and soon gets into the habit of taking these things, which still further complicate matters.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Since these frailties are more yielded to by men than women.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nux is pre-eminently a male remedy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "These conditions, produce an irritable, nervous system, hypersensitive and over-impressionable, which Nux will do much to soothe and calm.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Especially adapted to digestive disturbances, portal congestion, and hypochondrical states depending thereon.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Convulsions, with consciousness; worse, touch, moving.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Zealous fiery temperament.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Nux patients are easily chilled, avoid open air, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nux always seems to be out of tune; inharmonious spasmodic action.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Very irritable: sensitive to all impressions.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Ugly, malicious.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Cannot bear noises, odors, light, etc.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Does not want to be touched.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Time passes too slowly.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Even the least ailment affects her greatly.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Disposed to reproach others.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Sullen, fault-finding.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Headache in occiput or over eyes, with vertigo; brain feels turning in a circle.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Oversensitiveness.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, with momentary loss of consciousness.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Intoxicated feeling; worse, morning, mental exertion, tobacco, alcohol, coffee, open air.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pressing pain on vertex, as if a nail driven in.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo in morning and after dinner.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Scalp sensitive.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Frontal headache, with desire to press the head against something.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Congestive headache, associated with hæmorrhoids.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache in the sunshine (Glon; Nat carb).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Feels distended and sore within, after a debauch.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Photophobia; much worse in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Smarting dry sensation in inner canthi.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Infra-orbital neuralgia, with watering of eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Optic nerve atrophy, from habitual use of intoxicants.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Paresis of ocular muscles; worse, tobacco and stimulants.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Orbital twitching radiating towards the occiput, Optic neuritis.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Itching in ear through Eustachian tube.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Auditory canal dry and sensitive.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Otalgia; worse in bed.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Hyperæsthesia of auditory nerves; loud sounds are painful, and anger him.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Stuffed up, at night especially.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Stuffy colds, snuffles, after exposure to dry, cold atmosphere; worse, in warm room.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Odors tend to produce fainting.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Coryza: fluent in daytime; stuffed up at night and outdoors; or alternates between nostrils.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Bleeding in morning (Bry).", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Acrid discharge, but with stuffed up feeling.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Jaws, contracted.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Small aphthous ulcers, with bloody saliva.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "First half of tongue clean; posterior covered with deep fur; white, yellow, cracked edges.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Teeth ache; worse, cold things.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Gums swollen, white, and bleeding.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Rough, scraped feeling.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Tickling after waking in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Sensation of roughness, tightness, and tension.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Pharynx constricted.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Uvula swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Stitches into ear.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sour taste, and nausea in the morning, after eating.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Weight and pain in stomach; worse, eating, some time after.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Flatulence and pyrosis.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sour, bitter eructations.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea and vomiting, with much retching.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Ravenous hunger, especially about a day before an attack of dyspepsia.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Region of stomach very sensitive to pressure (Bry; Ars).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Epigastrium bloated, with pressure s of a stone, several hours after eating.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Desire for stimulants.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Loves fats and tolerates them well (Puls opposite).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Dyspepsia from drinking strong coffee.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Difficult belching of gas.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Wants to vomit, but cannot.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Bruised soreness of abdominal walls (Apis; Sulph).", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Flatulent distension, with spasmodic colic.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Colic from uncovering.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Liver engorged, with stitches and soreness.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Colic, with upward pressure, causing short breath, and desire for stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Weakness of abdominal ring region.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Strangulated hernia (Op).", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Forcing in lower abdomen towards genitals.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Umbilical hernia of infants.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Constipation, with frequent ineffectual urging, incomplete and unsatisfactory; feeling as if part remained unexpelled.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Constriction of rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Irregular, peristaltic action; hence frequent ineffectual desire, or passing but small quantities at each attempt.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Absence of all desire for defecation is a contra-indication.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Alternate constipation and diarrhœa-after abuse of purgatives.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Urging to stool felt throughout abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Itching, blind hæmorrhoids, with ineffectual urging to stool; very painful; after drastic drugs.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Diarrhœa after a debauch; worse, morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Frequent small evacuations.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Scanty stool, with much urging.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Dysentery; stools relieve pains for a time.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Constant uneasiness in rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Diarrhœa, with jaundice (Dig).", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Irritable bladder; from spasmodic sphincter.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Frequent calls; little and often.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Hæmaturia (Ipec; Tereb).", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Ineffectual urging, spasmodic and strangury.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Renal colic extending to genitals, with dribbling urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "While urinating, itching in urethra and pain in neck of bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Easily excited desire.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Emissions from high living.", grade = 1, source = "boericke-mm-9" },
