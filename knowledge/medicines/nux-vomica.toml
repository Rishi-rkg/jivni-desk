  { section = "Relationship", text = "Nux seeds contain copper, notice the cramp-causing proclivites of both. Complementary; Sulphur; Sepia. Inimical: Zinc. Compare: Strychnia. Compare: Kali carb; Hydr; Bry; Lyc; Graph. Antidotes: Coff; Ignat; Cocc.", source = "boericke-mm-9" },
