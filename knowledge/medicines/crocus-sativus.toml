id = "crocus-sativus"
name = "Crocus sativus"
abbreviation = "Croc."
aliases = ["Saffron", "Crocus satia"]

symptoms = [
  { section = "General", text = "Is a remedy often useful in hæmorrhages that are black and stringy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tingling in various parts.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chorea and hysterical affections.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Frequent and extreme changes in sensations and mental conditions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Anger with violence followed by repentance, Laughing mania.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Drowsiness and lassitude; better by literary labor.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Vacillating; pleasant mania; sings and laughs.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Happy and affectionate; then angry.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Sudden changes from hilarity to melancholy.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Vivid recollection from music heard (Lyc).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Throbs, pulsates, during climacteric; worse during menses.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Appearance as of electric sparks.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Must wipe eyes as if mucus or water were in them.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Feeling in eyes as after violent weeping.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Sensation as if she had been looking through too sharp spectacles.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Eyes feel as if in smoke.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pupils enlarged and react slowly.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Lids heavy.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Ciliary neuralgia, pain from eyes to top of head.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Sensation as if cold air was rushing through eye (Fluor ac; Syph).", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Asthenopia with extreme photophobia.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Threatened glaucoma; embolism of arteria centralis retinal.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Epistaxis.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Dark, stringy, clotted.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Strings of dark blood hanging down the nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Obstinate constipation due to portal stagnation.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Constipation in infants.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Crawling and stitches in anus.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Sensation of something alive in abdomen, stomach, etc., especially on left side (Calend).", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Abdomen swollen, feeling of something heavy.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Threatened abortion, especially when hæmorrhage is dark and stringy.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Urging of blood to genitals.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses dark, viscid, too frequent and copious, black and slimy.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Uterine hæmorrhage; clots with long strings; worse from least movement.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Jerking pain in interior of left breast, as if drawn toward back by means of thread (Crot tig).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "A bounding feeling, as if something alive in right breast.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Wheezy cough, with frothy expectoration, containing threads like fine twine; worse, lying down.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Breath has offensive, sickly smell.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Feeling as if the uvula is elongated in hysterical patients.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Sudden feeling of coldness in back as if cold water were thrown over him; icy-cold extremities.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Spasmodic contractions and twitchings of single set of muscles.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Chorea and hysteria, with great alterations of feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Whole upper extremity fall asleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cracking in hip-joint and knees.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Weakness in knees and legs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in ankles and soles.", grade = 1, source = "boericke-mm-9" },
]

