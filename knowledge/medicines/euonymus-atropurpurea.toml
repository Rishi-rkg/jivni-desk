  { section = "Abdomen", text = "Anus very sore and burning.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Constipation with hæmorrhoids and severe backache.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Diarrhœa; stools variable and profuse, bloody.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain about umbilical region.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Urine scanty, high-colored; acidity increased, poured out rapidly.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Dull pain between shoulders and about renal and splenic region; pain in lumbar region better lying down.", grade = 1, source = "boericke-mm-9" },
