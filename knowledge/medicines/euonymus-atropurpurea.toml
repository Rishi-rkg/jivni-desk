  { section = "General", text = "Migraine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Passive Congestion and torpor of liver; chronic catarrhal affections of stomach and intestines.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Weak heart.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chronic rheumatism and gout.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Mental confusion, despondent, irritable; loss of memory, unable to recall familiar names.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Heavy frontal headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sore, tired feeling; bruised feeling of scalp.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain over right eye extending back through the head.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Bilious headache; coated tongue, bad taste, constipation.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, obscure vision and gastric derangement, associated with albuminuria.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache over eyebrows.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Mouth dry, pasty taste; thirsty, stomach full and uncomfortable.", grade = 1, source = "boericke-mm-9" },
