notes = [
  { section = "Relationship", text = "Antidote: Sulph. Useful after too much Chlorate of Potash for sore throat. Compare: Xanthorrhiza apifolia; Kali bich; Conium; Ars iod; Phytol; Galium (cancer-nodulated tumor of the tongue); Asterias; Stann; Puls. Also Manzanita (diarrhœa, gonorrhœa, gleet, leucorrhœa, catarrhal conditions). Hydrastinum muriaticum -Muriate of Hydrastia (Locally, in aphthous sore mouth, ulcers, ulcerated sore throat, ozæna, etc. Internally, third dec trit. Is a uterine hæmostatic and vasoconstrictor; metrorrhagia, especially from fibroid tumors; hæmorrhages; in dilatation of the stomach, and chronic digestive disorders). Hydrastin sulph 1x (hæmorrhage of bowels in typhoid). Marrubium -Hoarhound--(a stimulant to mucous membranes, especially laryngeal and bronchial; chronic bronchitis, dyspepsia, and hepatic disorders; colds and coughs).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, to thirtieth attenuation. Locally colorless. Hydrastis, mother tincture, or fluid extract.", source = "boericke-mm-9" },
]

