  { section = "General", text = "Small-pox internally and locally.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The power of Hydrastis over smallpox seen in modifying the disease, abolishing its distressing symptoms, shortening its course, lessening its danger and greatly mitigating its consequences (J.", grade = 1, source = "boericke-mm-9" },
