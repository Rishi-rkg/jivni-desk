  { section = "General", text = "Emaciation and prostration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Its action on the liver is marked.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cancer and cancerous state, before ulceration, when pain is principal symptom.", grade = 1, source = "boericke-mm-9" },
