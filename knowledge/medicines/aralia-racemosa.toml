  { section = "General", text = "Drenching sweat during sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Extreme sensitiveness to draughts.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Diarrhœa, prolapse of rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Aching in rectum extending upwards; worse lying on side lain upon.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry cough coming on after first sleep, about middle of night.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthma on lying down at night with spasmodic cough; worse after first sleep, with tickling in throat.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Constriction of chest; feels as if a foreign body were in throat.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Obstruction worse in spring.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hay-fever; frequent sneezing.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Rawness and burning behind sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "The least current of air causes sneezing, with copious watery, excoriating nasal discharge, of salty acrid taste.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Menses suppressed; leucorrhœa foul-smelling, acrid, with pressing-down air.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Lochia suppressed, with tympanites.", grade = 1, source = "boericke-mm-9" },
]

