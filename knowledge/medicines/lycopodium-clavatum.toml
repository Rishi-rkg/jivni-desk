  { section = "Relationship", text = "Complementary: Lycop acts with special benefit after Calcar and Sulphur. Iod; Graphites, Lach; Chelidon. Antidotes: Camph; Puls; Caust. Compare: Carbo-Nitrogenoid Constitution: Sulphur; Rhus; Urtica; Mercur; Hepar. Alumina (Lycop is the only vegetable that takes up aluminum. T. F. Allen) Ant c; Nat m; Ery; Nux; Bothrops (day-blindness; can scarcely see after sunrise; pain in right great toe). Plumbago littoralis -A Brazilian plant--(Costive with red urine, pain in kidneys and joints and body generally; milky saliva, ulcerated mouth). Hydrast follows Lycop in indigestion.", source = "boericke-mm-9" },
