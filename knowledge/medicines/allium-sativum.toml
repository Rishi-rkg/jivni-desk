notes = [
  { section = "Relationship", text = "Allium Sat according to Dr. Teste, belongs to the Bryonia group, including Lycopod. Nux. Colocy, Digital and Ignatia which affect deeply all flesh eating animals and hardly at all vegetarians. Hence their special applicability to meat eaters rather than to exclusive vegetarians. Compare: Capsicum; Arsenic; Senega; Kali nit. Complementary: Arsenic. Antidote: Lycopod.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to sixth potency. In tuberculosis, dose, four to six grammes in moderate state of dessication daily, in divided doses.", source = "boericke-mm-9" },
