symptoms = [
  { section = "General", text = "Acts directly on intestinal mucous membrane increasing peristalsis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Colitis, with pathological flora.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Has vaso-dilatory properties.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Arterial hypotension begins usually in 30 to 45 minutes after twenty to forty drop doses of the tincture.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Adapted to fleshy subjects with dyspepsia and catarrhal affections.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "High livers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Patients who eat a great deal more, especially meat, than they drink.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Pain in hip, pain in psoas and iliac muscles.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Pulmonary tuberculosis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cough and expectoration diminishes, temperature becomes normal, weight is gained, and sleep becomes regular.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hæmoptysis.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Heavy; pulsation in temples; catarrhal deafness.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Much sweetish saliva after meals and at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Sensation of a hair on tongue or throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Voracious appetite.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Burning eructations.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Least change in diet causes trouble.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Constipation, with constant dull pains in bowels.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tongue pale, red papillæ.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Constant rattling of mucus in bronchi.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough in the morning after leaving bedroom, with mucous expectoration, which is tenacious and difficult to raise.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sensitive to cold air.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dilated bronchi, with fetid expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Darting pain in chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pain in swelling of breasts.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Eruption in vagina and on breasts and vulva during menses.", grade = 1, source = "boericke-mm-9" },
]

