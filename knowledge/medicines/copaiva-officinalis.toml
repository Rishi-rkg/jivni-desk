symptoms = [
  { section = "General", text = "Acts powerfully on mucous membranes, especially that of the urinary tract, the respiratory organs, and the skin, here producing a well-marked nettle-rash.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cold and catarrhs.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Excessive sensitiveness; pain in occiput.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dull, frontal headache, passes to occiput and back again, with throbbing, worse right side and motion.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Scalp sensitive.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sensitive to sharp sounds.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Rawness and soreness of nostrils with stopped-up feeling; dryness of posterior nares.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Profuse, thick, fetid discharge from nasal passages, running down throat at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Burning and dryness, crusts on turbinated bones.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Marked catarrhal condition in upper respiratory tract.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Food seems too salty.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gastric troubles during menstruation or following urticaria.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gas and intestinal flatulence, urging to stool and difficult passage with pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Burning pressure; painful micturition by drops.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Retention, with pain in bladder, anus, and rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Catarrh of bladder; dysuria.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Swelling of orifice.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Constant desire to urinate.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Urine smells of violets.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Greenish, turbid color; peculiar pungent odor.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Mucous Colitis.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Stools covered with mucus, with colic and chilliness.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Burning and itching of anus, caused by piles.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Testicles sensitive and swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Itching of vulva and anus, with bloody purulent discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Profuse, strong-smelling menstrual discharge, with pains radiating to hip bones, with nausea.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough, with profuse, gray, purulent expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tickling in larynx, trachea, and bronchi.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Bronchial catarrh, with profuse greenish, offensive discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Hives, with fever and constipation.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Roseola.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Erysipelatous inflammation, especially around abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Circumscribed lenticular patches, with itching; mottled appearance.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Chronic urticaria in children.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Bullous eruptions.", grade = 1, source = "boericke-mm-9" },
]

