  { section = "Relationship", text = "Compare: Spongia; Calc; Fucus; Lycopus; Iodothyrine, (the active principle isolated from thyroid gland, a substance rich in Iodine and nitrogen, affects metabolism, reducing weight, may produce glycosuria. Use cautiously in obesity, for a fatty heart may not be able to maintain the accelerated rhythm. Milk contains the internal secretion of the thyroid). Thymus gland extract (arthritis deformans; metabolic osteoarthritis, 5-grain tablets 3 times daily). High potencies very efficient in exophthalmic goitre.", source = "boericke-mm-9" },
