id = "dioscorea-villosa"
name = "Dioscorea villosa"
abbreviation = "Dios."
aliases = ["Wild Yam"]

symptoms = [
  { section = "General", text = "As a remedy for many kinds of pain, especially colic, and in severe, painful affections of abdominal and pelvic viscera; it ranks with the polychrests of the Materia Medica.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Persons of feeble digestive powers; tea-drinkers, with much flatulence.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gall stone colic.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Calls things by the wrong name.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dull pain in both temples; better pressure, but worse afterwards.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Buzzing in head.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Mouth dry and bitter in morning, tongue coated, no thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Belching of large quantities of offensive gas.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Neuralgia of stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sinking at the pit of the stomach; pyrosis.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Pain along sternum and extending into arms.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Eructations of sour, bitter wind, with hiccough.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sharp pain in epigastrium, relieved by standing erect.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pains suddenly shift to different parts; appear in remote localities, as fingers and toes.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rumbling, with emission of much flatus.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Griping, cutting in hypogastric region, with intermittent cutting in stomach and small intestines.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Colic; better walking about; pains radiate from abdomen, to back, chest, arms; worse, bending forwards and while lying.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Sharp pains from liver, shooting upward to right nipple.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain from gall-bladder to chest, back, and arms.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Renal colic, with pain in extremities.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Hurried desire for stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Angina pectoris; pain back of sternum into arms; labored breathing; feeble action of heart.", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "Especially with flatulence and pain through chest and tightness across.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Hæmorrhoids, with darting pains to liver; look like bunches or grapes or red cherries; protrude after stool, with pain in anus.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Diarrhœa (worse in morning), yellowish, followed by exhaustion, as if flatus and feces were hot.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Relaxation and coldness of organs.", grade = 2, source = "boericke-mm-9" },
  { section = "Male", text = "Pains shoot into testicles from region of kidneys.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Strong-smelling sweat on scrotum and pubes.", grade = 2, source = "boericke-mm-9" },
  { section = "Male", text = "Emissions in sleep, or from sexual atony, with weak knees.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Uterine colic; pains radiate from uterus.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Vivid dreams.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tight feeling all along sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Chest does not seem to expand on breathing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Short-winded.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Lameness in back; worse, stooping.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Aching and stiffness in joints.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Sciatica; pains shoot down thigh; worse, right side; better, when perfectly still.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Felons in beginning, when pricking is first felt.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Nails brittle.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cramps in flexors of fingers and toes.", grade = 1, source = "boericke-mm-9" },
]

