id = "asclepias-cornuti"
name = "Asclepias cornuti"
abbreviation = "Asc-c."
aliases = ["Silk-weed", "Asclepias syriaca"]

symptoms = [
  { section = "General", text = "Seems to act especially on nervous system and urinary organs.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A remedy for dropsy, hepatic, renal or cardiac and post-scarlatinal; causes diaphoresis and augments the urinary secretion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acute rheumatic inflammation of large joints.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Intermittent, pressing-down uterine pains.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feels as if a sharp instrument were thrust through from temple to temple.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Constriction across forehead.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nervous headache, after suppressed perspiration, followed by increased urine, with increase of specific gravity.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Headache from retention of effete matters in system.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Asclepias Vincetoxicum.--Swallow-wart.-- Cynanchum --(A gastro-intestinal irritant, producing vomiting and purgation).--(Useful in dropsy, diabetes, great thirst, profuse urination).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture.", source = "boericke-mm-9" },
]

