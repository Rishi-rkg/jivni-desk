notes = [
  { section = "Relationship", text = "Compare: Benzin.--Petroleum ether-not as pure a compound as Benzene (Benzol). It is the same, but with a mixture of hydrocarbons. It seems to exercise a special influence on the nervous system and on the blood. Oxyhemoglobinemia. Physical weakness, cramps, exaggeration of knee jerks, nausea, vomit, dizziness, heaviness and coldness of limbs. Tremor of eyelids and tongue. Benzin, dinitricum --D. N. B.--(The most obvious results of poisoning by skin absorption are changes in the red blood corpuscles and liver degeneration in amblyopia, color-blindness, retinitis. Field of vision contracted. Black urine). Benzin nitricum. Mirbane (Dark, black blood, coagulates with difficulty; venous hyperæmia of the brain and general venous engorgement. Burning taste in mouth. Blue lips, tongue, skin, nails and conjunctivæ. Cold skin, pulse small, weak, breathing slow and irregular, unconsciousness, symptoms of apoplectic coma. Rolling of eyeballs in their vertical axis; pupils dilated. Nystagmus. Respiration very slow, difficult, sighing). Trinitrotoluene (T. N. T), Trotyl-is a high explosive, obtained by nitrating toluene-a product of coal tar distillation. When the skin or hair is exposed to T.N.T by contact a characteristic yellow or tawny-orange stain is produce, which lasts for some weeks. Indicated in graver forms of anæmia (pernicious) and jaundice. Produces fatal toxic jaundice.", source = "boericke-mm-9" },
  { section = "Dose", text = "Sixth potency.", source = "boericke-mm-9" },
]

