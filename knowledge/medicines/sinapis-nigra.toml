symptoms = [
  { section = "General", text = "Is of use in hay-fever, coryza, and pharyngitis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dry nares and pharynx, with thick, lumpy secretion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Small-pox.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Scalp hot and itches.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sweat on upper lip and forehead.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Tongue feels blistered.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Mucus from posterior nares feels cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Scanty, acrid discharge.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Stoppage of left nostril all day, or in afternoon and evening.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Dry, hot, with lachrymation, sneezing; hacking cough; better lying down.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Nostrils alternately stopped.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Dryness of anterior nares.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough is relieved by lying down.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Feels scalded, hot inflamed.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Asthmatic breathing.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Loud coughing-spells with barking expiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Offensive breath, smelling like onions (Asaf; Armorac).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Burning in stomach, extending up œsophagus, throat, and mouth, which is full of canker sores.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hot sour eructations.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Colic; pains come on while bent forward; better, sitting up straight.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sweat better when nausea comes on.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Pain in bladder, frequent copious flow day and night.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Rheumatic pain in intercostal and lumbar muscles; sleeplessness from pain in back and hips.", grade = 1, source = "boericke-mm-9" },
]

