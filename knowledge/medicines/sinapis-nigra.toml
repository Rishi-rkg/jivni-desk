notes = [
  { section = "Relationship", text = "Compare: Sulph; Capsic; Colocy; Sinapis alba -White Mustard--(throat symptoms marked, especially pressure and burning, with obstruction in œsophagus; sensation of a lump in œsophagus behind the Manubrium Sterni and with much eructation; similar symptoms in rectum). Mustard oil by inhalation (acts on the sensory nerve endings of the trigeminal. Relieves pain in middle ear disease and in painful conditions of nose, nasal cavities, and tonsils).", source = "boericke-mm-9" },
