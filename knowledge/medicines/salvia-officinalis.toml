notes = [
  { section = "Relationship", text = "Compare: Chrysanhemum Leucanthemum --Ox-eye Daisy. Has specific action on sudoriparous glands. Quiets nervous system like Cypripedium. Right sided tearing pain in bones of jaw and temple. Pain in teeth and gums, worse touch, better warmth. Irritable and tearful. Here use 12x. Insomnia and night-sweats. For colliquative sweating and hyperæsthesia of nervous system. Material doses of tincture. Phelland; Tuberc; Salvia sclerata (tonic influence on nervous system; dose, teaspoonful to one pint hot water, as inhalent for sponging). Rubia tinctorum -Madder-A remedy for the spleen (Ceanothus). Chlorosis and amenorrhœa; tuberculosis. Anæmia; undernourished conditions; splenic anæmia. Dose, 10 drops of tincture.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, in twenty-drop doses, in a little water. The effects manifest themselves quickly two hours after taking a dose, and they persist for from two to six days.", source = "boericke-mm-9" },
]

