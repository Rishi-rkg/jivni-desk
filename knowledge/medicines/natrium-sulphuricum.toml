notes = [
  { section = "Relationship", text = "Compare: Natrum succinate (5 gr every 3 hours. Catarrhal jaundice). Malaria officinalis -decomposed vegetable matter--(Has evident power to cause the disappearance of the plasmodium of malaria. Malarial cachexia. General sense of weariness. Spleen affections. Malaria and rheumatism. Functional hepatic diseases. Sixth potency and higher). Natrum choleinicum -Fel Tauri Depuratum--(constipation; chronic gastric and intestinal catarrh; cirrhotic liver; diabetes; nape of neck pains; tendency to sleep after eating; much flatus; ascites); Momordica -Balsam Apple--(Colic, dysmenorrhœa with gushes of blood). Pulmo vulpis -Wolf's lung (persistent shortness of breath causing a paroxysm of asthma on the slightest motion. Strong, sonorous bubbling rales. 1x trit). Peumus Boldus-Boldo --(atonic states of stomach and intestinal canal; liver states following malaria. Burning weight in region of liver and stomach, bitter taste, languor; abscess of liver; asthma, bronchitis, catarrh, œdema of lungs); Natrum iodat (Incipient rheumatic endocarditis; chronic bronchitis, rheumatism and tertiary syphilis. Chronic catarrhal affections, arteriosclerosis. Here various symptoms, as angina pectoris, vertigo, dyspnœa become less marked after continued use of 5-10 grs, 3 times a day). Natrum hyposulph (liver-spots, locally and internally); Sulp; Thuja; Merc.: stilling. Complementary; Ars; Thuja.", source = "boericke-mm-9" },
  { section = "Dose", text = "First to twelfth trituration.", source = "boericke-mm-9" },
]

