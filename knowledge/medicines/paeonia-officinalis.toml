symptoms = [
  { section = "General", text = "The rectal and anal symptoms are most important.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chronic ulcers on lower parts of body, leg, foot, toe, also breast, rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Rush of blood to head and face.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nervous.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo when moving.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Burning in eyes and ringing in ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Biting, itching in anus; orifice swollen.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Burning in anus after stool; then internal chilliness.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Fistula ani, diarrhœa, with anal burning and internal chilliness.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Painful ulcer, oozing offensive moisture on perineum.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Hæmorrhoids, fissures, ulceration of anus and perineum, purple, covered with crusts.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Atrocious pains with and after each stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Sudden, pasty diarrhœa, with faintness in abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Sticking pain in left chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Heat in chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Dull shooting from front to back through heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in wrist and fingers; knees and toes.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Weakness of legs, inhibiting walking.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Terrifying dreams, nightmare.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Sensitive, painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Ulcers below coccyx, around sacrum; varicose veins.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Ulcers in general, from pressure, bedsores, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching, burning, as from nettles.", grade = 1, source = "boericke-mm-9" },
]

