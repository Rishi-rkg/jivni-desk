symptoms = [
  { section = "General", text = "Has many symptoms in common with Antimonium Crudum but also many peculiar to itself.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Clinically, its therapeutic application has been confined largely to the treatment of respiratory diseases, rattling of mucus with little expectoration has been a guiding symptom.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "There is much drowsiness, debility and sweat characteristic of the drug, which group should always be more or less present, when the drug is prescribed.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Gastric affections of drunkards and gouty subjects.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cholera morbus.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sensation of coldness in blood-vessels.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bilharziasis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Antimonium tart is homeopathic to dysuria, strangury, hæmaturia, albuminuria, catarrh of bladder and urethra, burning in rectum, bloody mucous stools, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Antimon tart acts indirectly on the parasites by stimulating the oxidizing action of the protective substance.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "By-effects following injection for Bilharziasis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chills and contractures and pain in muscles.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Trembling of whole body, great prostration and faintness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Lumbago.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chills, contractures and muscular pains.", grade = 1, source = "boericke-mm-9" },
