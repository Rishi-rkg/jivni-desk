id = "serum-anguillae"
name = "Serum anguillae"
abbreviation = "Ser-ang."
aliases = ["Eel Serum", "Serum anguillar ichthyotoxin"]

symptoms = [
  { section = "General", text = "The serum of the eel has a toxic action on the blood, rapidly destroying its globules.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The presence of albumin and renal elements in the urine, the hemoglobinuria, the prolonged anuria (24 and 26 hours), together with the results of the autopsy, plainly demonstrate its elective action on the kidneys.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Secondarily, the liver and the heart are affected, and the alterations observed are those usually present in infectious diseases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "From all these facts it is easy to infer, a priori, the therapeutical indications of the serum of the eel.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Whenever the kidney becomes acutely affected, either from cold or infection or intoxication, and the attack is characterized by oliguria, anuria and albuminuria, we will find the eel's serum eminently efficacious to re-establish diuresis, and in rapidly arresting albuminuria.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "When during the course of heart-disease, the kidney, previously working well, should suddenly become affected and its function inhibited; and when besides we observe cardiac irregularities and a marked state of asystolia, we may yet expect good results from this serum.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "But to determine here the choice of this remedy is not an easy matter.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "While digitalis presents in its indications, the well-known symptomatic trilogy: arterial hypertension oliguria and œdema; the serum of the eel seems better adapted to cases of hypertension and oliguria, without œdema.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "We should bear in mind that the elective action of the eel's serum is on the kidney, and I believe we can well assert that if digitalis is a cardiac, the eel's serum is a renal remedy.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "So far, at least, the clinical observations published seem to confirm this distinction.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The serum of the eel has given very small results in attacks of asystolia; but it has been very efficacious in cardiac uræmia.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "There, where digitalis is powerless, the serum of the eel has put an end to the renal obstruction and produced an abundant diuresis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "But its really specific indication seems to be for acute nephritis a frigori (Jousset) Subacute nephritis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Heart diseases, in cases of failure of compensation and impending asytole.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The experiments of Dr.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Jousset have amply demonstrated the rapid hæmaturia, albuminuria and oliguria caused by it.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In the presence of acute nephritis with threatening uræmia we should always think of this serum.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Very efficacious in functional heart diseases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Mitral insufficiency, asystolia with or without œdema, dyspnœa and difficult urinary secretion.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Great analogy exists between eel serum and the venom of the Vipera. Compare also: Pelias; Lachesis.", source = "boericke-mm-9" },
  { section = "Dose", text = "Attenuations are made with glycerine or distilled water, the lower 1x to 3 in heart disease, the higher in sudden renal attacks.", source = "boericke-mm-9" },
]

