notes = [
  { section = "Relationship", text = "Antidotes: Ars; Hep. Complementary.: Chin; Alum; Hamamel. Compare: Rumex (similar in respiratory and digestive sphere and contains organic iron). Ferrum aceticum (alkaline urine in acute diseases. Pain in right deltoid. Epistaxis; especially adapted to thin, pale, weak children who grow rapidly and are easily exhausted; varices of the feet; copious expectoration of greenish pus; asthma; worse, sitting still and lying; phthisis, constant cough, vomiting of food after eating, hæmoptysis). Ferrum arsenicum (enlarged liver and spleen, with fever; undigested stool; albuminuria). Simple and pernicious anæmia and chlorosis. Skin dry. Eczema, psoriasis, impetigo (Use 3x trituration). Ferrum bromatum (sticky, excoriating leucorrhœa; uterus heavy and prolapsed, scalp feels numb). Ferrum cyanatum (neuroses with irritable weakness and hypersensitiveness, especially of a periodical character; epilepsy; cardialgia, with nausea, flatulence, constipation, alternating with diarrhœa; chorea). Ferrum magneticum (small warts on hands) Ferrum muriaticum (Arrested menstruation; tendency to seminal emissions or copious urination at puberty; very dark, watery stools; diphtheria; phlegmonous erysipelas; pyelitis; hæmoptysis of dark, clotty blood; dyspareunia; pain in right shoulder, right elbow, and marked tendency to cramps and round red spots on cheeks; bright crystals in urine. Anæmia, 3x, after meals. Tincture 1-5 drops 3 times daily for chronic interstitial nephritis). Ferrum sulphuricum (Watery and painless stools; menorrhagia pressing, throbbing between periods with rush of blood to head. Basedow's disease. Erethism. Pain in gall-bladder; toothache; acidity; eructation of food in mouthfuls); Ferrum pernitricum (cough, with florid complexion); Ferrum tartaricum (cardialgia; heat at cardiac orifice of stomach). Ferrum protoxalatum (Anæmia). Use 1x trit. Compare also; Graph; Mangan; Cupr.", source = "boericke-mm-9" },
  { section = "Dose", text = "States of debility where the blood is poor in hematin require material doses; plethoric, hæmorrhagic conditions call for small doses, from the second to the sixth potency.", source = "boericke-mm-9" },
]

