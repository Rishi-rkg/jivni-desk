id = "anisum-stellatum"
name = "Anisum stellatum"
abbreviation = "Anis."
aliases = ["Anise", "Illicium"]

symptoms = [
  { section = "General", text = "Should be remembered in the treatment of flatulent conditions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "So-called three-months' colic, especially if it recurs at regular hours; much rumbling in abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "One symptom is worthy of special remembrance- pain in region of third rib, about an inch or two from the sternum, generally on right side, but occasionally on left.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Frequent cough with this pain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Purulent tracheal and gastric catarrh of old drunkards.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Old asthmatics.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Vomiting, epileptiform convulsions with biting of tongue.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Sharp stitches beneath lip.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Acute catarrh.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Burning and numbness of inner lower lip.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dyspnœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pain near third intercostal cartilage.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough, with pus-like phlegm.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Palpitation, with aphthæ.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hæmoptysis.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Third potency.", source = "boericke-mm-9" },
]

