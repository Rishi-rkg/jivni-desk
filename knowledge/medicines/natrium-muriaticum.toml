notes = [
  { section = "Relationship", text = "Complementary to Apis; Sepia; Ign. Compare: Aqua marina -Isotonic plasma. Marine plasma is a sea water taken some miles from shore and some depth below surface, filtered and diluted with twice as much pure fresh water. It acts primarily on the blood, as in intoxications, scrofulous conditions, enteritis. It disintoxicates in cancer (administered subcutaneously in the treatment of diseases of skin, kidneys and intestines, gastro-enteritis, and tuberculosis). Scrofulous affection of children. Lymphadenitis. Lupus, eczema, varicose ulcers. A great \"blood purifier and vitalizer. \" Potentized sea-water in weakness, lack of reaction; symptoms worse seaside (Goitre). Sal marinum sea salt, (indicated in chronic enlargements of glands, especially cervical. Suppurating glands. It appears likely to become a most useful remedy as an auxiliary, if not as a principal, in the treatment of diseases in patients of a strumous diathesis. Also useful in constipation). Natrum selenicum (laryngeal phthisis with expectoration of small lumps of bloody mucus and slight hoarseness). Natrum silicum (hæmophilia; scrofulous bone affections; given intravenously every 3 days for senile pruritus); (Dolichos. Fagopyr). Ignat; Sep; Thuja; Graph; Alum. Antidote: Ars; Phos; Spir nit dulc.", source = "boericke-mm-9" },
  { section = "Dose", text = "Twelfth to thirtieth and higher. The very highest potencies often yield most brilliant results. And in infrequent dosage.", source = "boericke-mm-9" },
]

