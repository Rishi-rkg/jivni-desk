id = "colchicum-autumnale"
name = "Colchicum autumnale"
abbreviation = "Colch."
aliases = ["Meadow Saffron", "Colchicum"]

symptoms = [
  { section = "General", text = "Affects markedly the muscular tissues, periosteum, and synovial membranes of joints.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Has specific power of relieving the gouty paroxysms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It seems to be more beneficial in chronic affections of these parts.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The parts are red, hot, swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tearing pains; worse, in the evening and at night and from touch; stubbing the toes hurts exceedingly.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "There is always great prostration, internal coldness, and tendency to collapse.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Effects of night watching and hard study.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Shocks as from electricity through one half of body.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bad effects from suppressed sweat.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dreams of mice.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache chiefly frontal and temporal, but also occipital and in nape of neck, worse afternoon and evening.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pupils unequal; left pupil contracted.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Variations in visual acuity.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Lachrymation worse in open air; violent tearing pain in eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Dim vision after reading.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Spots before eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Itching in ears; sharp, shooting pains below right tragus.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Pain in facial muscles, moving about.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Tingling and œdematous swelling; cheeks red, hot, sweaty.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Very irritable with the pains (Cham).", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Pain behind angle of right lower jaw.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Dry mouth, tongue burns, gums and teeth pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Thirst; pain in stomach and flatulence.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "The smell of food causes nausea even to fainting, especially fish.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Profuse salivary secretion.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting of mucus, bile and food; worse, any motion; great coldness in stomach.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Craving for various things, but is averse to then when smelling them, seized them with nausea.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gouty gastralgia.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Burning or icy coldness in stomach and abdomen.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Thirst for effervescent, alcoholic beverages.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Pain in transverse colon.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Distention of abdomen, with gas, inability to stretch out legs.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Borborygmi.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain over liver.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Cæcum and ascending colon much distended.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Fullness and continuous rumbling.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Ascites.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Painful, scanty, transparent, jelly-like mucus; pain, as if anus were torn open, with prolapse.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Autumnal dysentery; stools contain while shreddy particles in large quantities.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Ineffectual pressing; feels feces in rectum, but cannot expel them.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pruritus of genitals.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Cold feeling in thigh after period.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Sensation of swelling in vulva and clitoris.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Dark, scanty or suppressed; bloody, brown, black, inky; contains clots of putrid decomposed blood, albumin, sugar.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Anxiety in region of heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Impulse not felt.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Pericarditis, with severe pain, oppression and dyspnœa, pulse threadlike.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Sound of heart become weaker, pulse of low tension.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Sharp pain down left arm.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tearing in limbs during warm weather, stinging during cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pins and needles in hands and wrists, fingertips numb.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in front of thigh.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Right plantar reflex abolished.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Limbs, lame, weak, tingling.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain worse in evening and warm weather.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Joints stiff and feverish; shifting rheumatism; pains worse at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Inflammation of great toe, gout in heel, cannot bear to have it touched or moved.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tingling in the finger nails.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Knees strike together, can hardly walk. Œdematous swelling and coldness of legs and feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Aching in lumbar and lumbo-sacral region.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Dull pain across loins.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Backache, better, rest and pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Blotchy papular rash on face.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Pink spots on back, chest and abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Urticaria.", grade = 1, source = "boericke-mm-9" },
]

