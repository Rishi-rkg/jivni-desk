id = "euphorbia-lathyris"
name = "Euphorbia lathyris"
abbreviation = "Euph-l."
aliases = ["Gopher-Plant, Caper Spurge"]

symptoms = [
  { section = "General", text = "The fresh milky juice is exceedingly acrid when applied to the skin and the fruit is highly purgative and poisonous.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The juice causes redness, itching, pimples, sometimes gangrene.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The symptoms point to its use in erysipelas.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Poison Oak, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Rheumatic pains during rest.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Paralytic, weakness in joints.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Delirium and hallucinations.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Stupor, coma.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Almost closed from œdema of lids.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "End of nose very much inflamed externally.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Very sensitive and œdematous mucous membranes with ulceration.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "At first ruddy glow on cheeks, afterwards death-like pallor.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Cold perspiration in beads on forehead.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Red, puffed, and in spots suppurating.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Erythema, beginning on face, gradually extending into the hair parts, and then spreading over whole body, taking eight days to do so; eruption glossy, rough œdematous, with burning and smarting; aggravated by touch and cold air; ameliorated by close room and sweet-oil applications.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Fine bran-like desquamation.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Sensation of cobwebs.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Stinging, smarting, and burning of face when touched.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue coated, slimy; acrid taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Breath cold, musty odor.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea and vomiting of copious clear water, intermingled with white, gelatinous lumps.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Drastic purgation from large doses; mild laxative condition from smaller doses; followed several weeks afterwards by obstinate constipation.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Stools of white, transparent, gelatinous mucus; later mingled with blood.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Copious flow of urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Inflammation of scrotum resulting in deep acrid ulcers, with intense itching and burning; worse, touching the parts from washing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Labored breathing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Breath cold, musty odor.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough; first, a hacking, as from inhalation of sulphur; later on, paroxysmal, like whooping-cough, in regular paroxysms, ending in diarrhœa and vomiting, with sleepiness between each paroxysm.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Weak and fluttering heart-action.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Pulse 120, full, bounding, somewhat irregular.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Restlessness at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Sleep disturbed, anxious dreams.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Temperature increased.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Body bathed in profuse perspiration, standing out like beads on forehead; later, cold, clammy perspiration on forehead.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Erythema, beginning on uncovered parts, on face, and spreading over whole body; glossy, rough, œdematous, with burning and smarting.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Fine bran-like desquamation following in the wake of the erythema.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Eruption rough, scaly, smarting, and burning; when scratched forms deep, ragged ulcers; skin where ulcerated remains red.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "touch and cold air", source = "boericke-mm-9" },
  { kind = "better", text = "close room and sweet-oil application", source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Antidoted by Rhus tox (skin symptoms); Veratr alb (vomiting, purging, cough and coma).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency.", source = "boericke-mm-9" },
]

