symptoms = [
  { section = "General", text = "Periodical nervous sick headaches, with asthenopia, weak digestion, constipation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Catarrh.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Suits debilitated, nervous, literary patients, with frequent headaches, dyspepsia and constipation.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Cracking in cervical vertebræ when moving the head.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain on top as from a nail.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pressure on vertex, in morning; worse till noon and in warm room.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Stitches.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Objects appear too large.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Migraine; first on left side.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Twitching of upper lip.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Violent sneezing; stopped up.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Nasal catarrh, with redness and swelling at tip of nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Acute pain at root of nose, extending to vertex and through temples.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Sore, right side with great tenderness; soreness to touch externally.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Strangulated feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastric", text = "Gone, empty feeling in epigastrium, without desire for food.", grade = 2, source = "boericke-mm-9" },
  { section = "Gastric", text = "Acute gastralgia with pains extending to shoulder.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastric", text = "Thirst and intense hiccough.", grade = 2, source = "boericke-mm-9" },
  { section = "Gastric", text = "Sour, fetid secretions ooze from molar teeth.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastric", text = "Diarrhœa and tenesmus after milk.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses late, scanty, with great debility and burning in eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Profuse leucorrhœa; worse, after urinating (Mag mur, Plat); also worse after menses.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarseness.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry, hacking cough, with stitches in chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Obliged to set up and hold head.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Must put arms on thighs, when coughing.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching all over, worse on neck, not relieved by scratching.", grade = 1, source = "boericke-mm-9" },
]

