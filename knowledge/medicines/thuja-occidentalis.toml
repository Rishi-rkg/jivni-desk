  { section = "General", text = "Rapid exhaustion and emaciation.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Left-sided and chilly medicine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Variola, aborts the pustule and prevents the suppurating fever.", grade = 1, source = "boericke-mm-9" },
