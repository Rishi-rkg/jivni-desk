  { section = "General", text = "Nævus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Excess of venosity.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The main action of Thuja is on the skin and genito-urinary organs, producing conditions that correspond with Hahnemann's sycotic dyscrasia, whose chief manifestation is the formation of wart-like excrescences upon mucous and cutaneous surfaces-fig-warts and condylomata.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Has a specific antibacterial action, as in gonorrhœa and vaccination.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Suppressed gonorrhœa, salpingitis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Ill-effects of vaccination.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sycotic pains, i.e, tearing in muscles and joints, worse at rest, better in dry weather, worse damp humid atmosphere; lameness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hydrogenoid constitutions, whose blood is morbidly hydroscopic, so that damp air and water are inimical.", grade = 2, source = "boericke-mm-9" },
