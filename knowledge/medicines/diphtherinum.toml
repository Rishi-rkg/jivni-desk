id = "diphtherinum"
name = "Diphtherinum"
abbreviation = "Diph."
aliases = ["Potentized Diphtheritic Virus"]

symptoms = [
  { section = "General", text = "Adapted to patients prone to catarrhal affections of respiratory organs, scrofulous individuals.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Diphtheria, laryngeal diphtheria, post-diphtheritic paralysis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Malignancy from the start.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Glands swollen; tongue red, swollen; breath and discharge very offensive.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Diphtheritic; membrane thick, dark.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Epistaxis; profound prostration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Swallows without pain, but fluids are vomited or returned by the nose.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Diphtherotoxin (Cahis) (Chronic bronchitis with rales. Cartier suggests it in the vago-paralytic forms of Bronchitis of the aged or in toxic bronchitis after grip).", source = "boericke-mm-9" },
  { section = "Dose", text = "Thirtieth, two hundredth or C. M potency. Must not be repeated too frequently.", source = "boericke-mm-9" },
]

