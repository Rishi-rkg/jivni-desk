symptoms = [
  { section = "General", text = "So-called bilious symptoms, with headache.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Despondent and irritable.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Aches as if top of head would fly off.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Arteries of forehead throb.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nose red.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Yellow; tongue yellow, coated, taking imprint of teeth (Merc; Pod; Rhus).", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Taste as of rotten eggs (Arnica).", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Sensation as if something hung down from posterior nares; cannot get it up or down.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Deep pain in right side over liver, going through back.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Stool yellowish brown, with bile.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Burning and swelling of the prepuce, with redness of meatus.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Gonorrhœa (Cann; Tussil).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Erythematous redness.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Tincture, to third potency.", source = "boericke-mm-9" },
]

