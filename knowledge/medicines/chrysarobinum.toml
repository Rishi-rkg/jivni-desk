id = "chrysarobinum"
name = "Chrysarobinum"
abbreviation = "Chrysar."
aliases = ["Goa Powder-Andira araroba"]

symptoms = [
  { section = "General", text = "Acts as a powerful irritant of the skin and used successfully in skin diseases especially in ringworm, psoriasis, herpes tonsurans acne rosacea.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Vesicular or squamous lesions, associated with foul smelling discharge and crust formation, tending to become confluent and to give the appearance of a single crust covering the entire area (Bernstein).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Violent itching, thighs, legs and ears.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Dry, scaly eruption, especially around eyes and ears, scabs with pus underneath (Mezer).", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Blepharitis, conjunctivitis keratitis.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Intense photophobia.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Optical hyperæsthesia.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Eczema behind ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Filthy, scabby condition with tendency to form thick crust.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Whole ear and surrounding tissue appears to be one scab.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Chrysarobinum contains chrysophan, which is rapidly oxidized into chrysophanic acid. This is also contained in Rhubarb and Senna.", source = "boericke-mm-9" },
  { section = "Dose", text = "Locally, as a cerate, 4-8 grains to the ounce, of vaseline. Internally, third to sixth potency. Used externally; should be used with caution on account of its ability to produce inflammation.", source = "boericke-mm-9" },
]

