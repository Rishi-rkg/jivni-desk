id = "asa-foetida"
name = "Asa foetida"
abbreviation = "Asaf."
aliases = ["Gum of the Stinkasand", "Asafoetida"]

symptoms = [
  { section = "General", text = "The flatulence and spasmodic contraction of stomach and œsophagus with reverse peristalsis are the most marked symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In its selection, its relation to the hysterical and hypochondriacal patients, must be borne in mind.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Besides these superficial symptoms, it has been found to affect favorably deep ulcerations, caries of bones, especially in the syphilitic organism; here the extreme sensitiveness and terrible throbbing, nightly pains, guiding to its use.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Irritable; complains of her troubles; sensitive.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Boring above eyebrows.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pressive pain from within outward.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Orbital neuralgia; better, pressure and rest.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Iritis and intraocular inflammations, with boring, throbbing pains at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Stitches under left frontal eminences.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Boring pains in and around eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Syphilitic iritis.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Superficial corneal ulcer with digging pains; worse at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Offensive otorrhœa, with boring pains in mastoid bone.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Mastoid disease with pain in temporal region with pushing out sensation.", grade = 2, source = "boericke-mm-9" },
  { section = "Ears", text = "Offensive, purulent discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Syphilitic ozæna, with very offensive purulent discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Caries of nasal bones (Aurum).", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Globus hystericus.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Ball rises in throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Sensation as if peristaltic motion were reversed, and œsophagus were driven from stomach to throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Great difficulty in bringing up wind.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Flatulence and regurgitation of liquid.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hysterical flatulence.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Great distention.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sensation of emptiness and weakness, with distention and beating in stomach and abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Forcible eructation of gas.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Pulsation in pit of stomach.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Violent gastralgia; cutting and burning in stomach and region of diaphragm.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gurgling and rolling of wind, which escapes afterwards with loud and difficult eructation.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Mammæ turgid with milk in the unimpregnated.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Deficient milk, with oversensitiveness.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Distended, griping, with hunger.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Obstinate constipation.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Pain in perineum, as if something dull pressed out.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "diarrhœa, extremely offensive, with meteorism, and regurgitation of food.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Spasmodic tightness, as if lungs could not be fully expanded.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Palpitation more like a tremor.", grade = 1, source = "boericke-mm-9" },
  { section = "Bones", text = "Darting pain and caries in bones.", grade = 1, source = "boericke-mm-9" },
  { section = "Bones", text = "Periosteum painful, swollen, enlarged.", grade = 1, source = "boericke-mm-9" },
  { section = "Bones", text = "Ulcers affecting bones; thin, ichorous pus.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching, better scratching; ulcers painful on edges.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Suppressed skin symptoms produce nervous disorders.", grade = 1, source = "boericke-mm-9" },
]

