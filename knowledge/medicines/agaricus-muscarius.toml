symptoms = [
  { section = "General", text = "This fungus contains several toxic compounds, the best known of which is Muscarin.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The symptoms of poisoning do not develop at once, usually twelve to fourteen hours elapse before the initial attack.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "There is no antidote, treatment, entirely symptomatic (Schneider).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Agaricus acts as an intoxicant to the brain, producing more vertigo and delirium than alcohol, followed by profound sopor with lowered reflexes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Jerking, twitching, trembling, and itching are strong indications.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Incipient phthisis; is related to the tubercular diathesis, anæmia, chorea, twitching ceases during sleep.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Various forms of neuralgia and spasmodic affections, and neurotic skin troubles are pictured in the symptomatology of this remedy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It corresponds to various forms of cerebral excitement rather than congestion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Thus, in delirium of fevers, alcoholism, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "General paralysis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation as if pierced by needles of ice.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sensitive to pressure and cold air.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Violent bearing-down pains.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Symptoms appear diagonally as right arm and left leg.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Pains are accompanied by sensation of cold, numbness and tingling.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Sings, talks, but does not answer.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Loquacity.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Aversion to work.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Indifference.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Fearlessness.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Delirium characterized by singing, shouting, and muttering; rhymes and prophesies.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Begins with paroxysm of yawning.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "The provings bring out four phases of cerebral excitement. 1.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Slight stimulation -shown by increased cheerfulness, courage, loquacity, exalted fancy. 2.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "More decided intoxication -great mental excitement and incoherent talking, immoderate gaity alternates with melancholy.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Perception of relative size of objects is lost, takes long steps and jumps over small objects as if they were trunks of trees-a small hole appears as a frightful chasm, a spoonful of water an immense lake.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Physical strength is increased, can lift heavy loads.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "With it much twitching. 3.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Third stage produces a condition of furious or raging delirium, screaming, raving, wants to injure himself, etc. 4.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Fourth stage -mental depression, languor, indifference, confusion, disinclination to work, etc.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "We do not get the active cerebral congestion of Belladonna, but a general nervous excitement such as is found in delirium tremens, delirium of fevers, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo from sunlight, and on walking.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Head in constant motion.", grade = 1, source = "boericke-mm-9" },
