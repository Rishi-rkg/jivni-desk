notes = [
  { section = "Relationship", text = "Compare: Muscarine, the alkaloid of Agaricus (has much power over secretions, increasing lachrymal, salivary, hepatic, etc, but diminishing renal; probably neurotic in origin, stimulating the terminal fibers of the secretory nerves of all these structures, hence salivation, lachrymation and excessive perspiration. Atropin exactly opposes Muscarine. Resembles Pilocarpin in action). Amanita vernus -spring mushroom-a variety of Agar Phalloides -Death cup-active principle is Phallin, active like Muscarine. Amanita phalloides (Death Cup-Deadly Agaric). The poison is a toxalbumin, resembling the poison in the rattle snake and the poison excreted by the cholera and diphtheria germs. It acts on the red blood corpuscles, dissolving them so that blood escapes into the alimentary canal and the whole system is drained. The amount of this toxic principle is small, even handling of specimens and breathing of spores affects some people unpleasantly. The poison is slow in development. Even 12 to 20 hours after taking it the patient feels all right, but vertigo violent choleraic symptoms with rapid loss of strength with death the second or third day, preceded by stupor and spasms. Fatty degeneration of liver, heart and kidneys, hæmorrhages in lungs, pleura and skin (Dr. J. Schier). Vomiting and purging. Continuous urging to stool, but no gastric, abdominal or rectal pain. Intense thirst for cold water, dry skin. Lethargic but mentally clear. Sharp changes from rapid to slow and from slow to rapid breathing, extreme collapse, suppressed urine, but no cold extremities or cramps. Agaric emet (severe vertigo; all symptoms better, cold water; longing for ice-water; gastritis cold sweat, vomiting sensation as if stomach was suspended on a string). Tamus (chilblains and freckles). Cimicif; Cann ind; Hyos; Tarantula. Antidote: Absinth; Coffea; Camphor.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth and two hundredth potency. In skin affections and brain exhaustions give the lower attenuations.", source = "boericke-mm-9" },
]

