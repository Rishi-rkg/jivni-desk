  { section = "Relationship", text = "Compare: Sodii bicarbonas (in vomiting of pregnancy with acetonuria, 30 grains in water spread over twenty-four hours); Nat sulph; Caust; Natr cacodyl (Foul breath and mouth with bad odor. Dry dermatitis of the skin of abdomen. Malignant growths. In phthisis, 5 centigrammes hypodermically, daily. Increase number of red blood corpuscles to double. Also in malignant disease). Arsynal --(Disodium methylarsenate). Introduced by M. A. Gautier, for phthisis in the second stage 4 to 6 centigrammes per day for one week followed by a week's intermission. But much smaller doses, i.e, 1x to 3x are followed by improvement, lessened fever, night sweat and hæmoptysis ceasing. Antidote: Ars. Camph.", source = "boericke-mm-9" },
