  { section = "General", text = "Prostration marked; face more active than Gels.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The superficial redness never assumes the dusky hue of Gels.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Pulse soft and flowing; no anxious restlessness of Acon.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Susceptibility to chest troubles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bronchitis of young children.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In acute exacerbation of tuberculosis, a fine palliative of wonderful power.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Corresponds to Grauvogl's Oxygenoid Constitution, the inflammatory, febrile, emaciating, wasting consumptive.", grade = 1, source = "boericke-mm-9" },
