notes = [
  { section = "Relationship", text = "Compare: Emetine -principal alkaloid of Ipecac (A powerful amebicide, but is not a bactericide. Specific for amæbiasis; of remarkable value in treatment of amæbic dysentery; also as a remedy in pyorrhea, 1/2 gr daily for three days, then less. Emetin, 1/2 gr hypodermically, in Psoriasis. Emetin hydroch. 2x, diarrhœa with colicky, abdominal pains and nausea. Emetin for endamoebic dysentery. In physiological doses must be carefully watched. May produce hepatization of lungs, rapid heart action, tendency for the head to fall forward and lobar pneumonia. In hæmatemesis and other hæmorrhages, compare: Gelatin which has a marked effect on the coagulability of the blood. Hypodermically; or if by mouth, a 10 per cent jelly, about 4 oz, three times a day) Arsenic; Cham; Puls; Tart em; Squill. Convolvulus (colic and diarrhœa). Typha latifolia -Cat-tail flag (dysentery, diarrhœa) and summer complaint. Euphorbia hypericifolia --Garden Spurge--(Very similar to Ipecac. Irritation of the respiratory and gastro-intestinal tracts and female organs). Lippia mexicana --(Persistent dry, hard, bronchial cough--asthma and chronic bronchitis). In Asthma, compare: Blatta orientalis. Antidotes: Arsenic; China; Tabac. Complementary: Cuprum; Arn.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to 200th potency.", source = "boericke-mm-9" },
]

