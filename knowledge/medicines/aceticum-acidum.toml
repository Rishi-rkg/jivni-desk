  { section = "Relationship", text = "Acetic acid is antidotal to all anæsthetic vapors. Counteracts sausage poisoning. Compare: Ammon acet (Profuse saccharine urine, patient is bathed in sweat). Benzoin oderiferum--Spice-wood (night sweats). Ars; China; Digitalis; Liatris (General anasarca in heart and kidney disease, dropsy, and chronic diarrhœa).", source = "boericke-mm-9" },
