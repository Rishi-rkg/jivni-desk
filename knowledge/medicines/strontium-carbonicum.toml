  { section = "General", text = "High blood pressure with flushed face pulsating arteries, threatened apoplexy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Violent involuntary starts.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Affections of bones, especially femur.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Restlessness at night, smothering feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "For shock after surgical operations.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Neuritis, great sensitiveness to cold.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo with headache and nausea.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Distensive pressure.", grade = 1, source = "boericke-mm-9" },
