  { section = "Head", text = "Bloody crusts in nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Face red; burns, itches.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Itching, redness and burning of nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Burning and redness of eyes.", grade = 1, source = "boericke-mm-9" },
