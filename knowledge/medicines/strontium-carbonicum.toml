  { section = "General", text = "Pains make patient faint or sick all over.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chronic sequelæ of hæmorrhages, after operations with much oozing of blood and coldness and prostration.", grade = 2, source = "boericke-mm-9" },
