  { section = "Stomach", text = "Vomiting of food and mucus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Catarrh of stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Bronchitis, and phthisis, with muco-purulent, thick, creamy expectoration.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Loud rales in chest (Kali sulph; Ant tar).", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Very loose cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Hectic fever and night-sweats, with irritating, short cough and scanty expectoration.", grade = 1, source = "boericke-mm-9" },
