notes = [
  { section = "Relationship", text = "Balsamum Tolutanum -the balsam of Myroxylon toluifera--(chronic bronchitis with profuse expectoration) (Oleum caryophyllum -oil of cloves-in profuse septic expectoration-3 to 5 minims in milk or capsules).", source = "boericke-mm-9" },
  { section = "Dose", text = "First attenuation: In hectic 6x. Extra homeopathic uses locally. As a stimulant to raw surfaces in indolent ulcers, scabies, cracked nipples, rhagades, itch. Promotes granulation, removes fetor. A one per cent solution in alcohol or ether may be used with the atomizer in respiratory affections. Internally, as an expectorant, in chronic bronchitis. Dose, 5 to 15 M, made into an emulsion with mucilage or yolk of egg.", source = "boericke-mm-9" },
]

