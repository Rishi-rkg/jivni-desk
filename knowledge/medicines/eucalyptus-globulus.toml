notes = [
  { section = "Relationship", text = "Compare: Oil of Eucalyptus.--(Produces remarkable bodily exhaustion, no desire for any motion, unable to do any real mental work, study, etc. The volatile oil possesses, in common with other terpenes, the property of converting water, in presence of air and sunlight, into hydrogen peroxide, or to convert oxygen into ozone, which is the explanation usually given of its deodorizing and antiseptic properties (Merrel). Locally, in catarrhal affections, especially when of a suppurating or putrid nature). Eucalyptus tereticoris (menstrual cough and prostration). Eucalyptol (depresses temperature of healthy body more than Quinine; acts on kidneys like Terebinth); Anacard; Hydrast; Kali sulph. Eucalyptus neutralizes ill effects of Strychnin. Angophora -Red Gum--(dysentery, pains, tenesmus; better lying flat on face; obstinate constipation). Eucalyptus rostrata; Kino.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture in one to 20 drop doses, and lower potencies. Also Oil of Eucalyptus in five-drop doses.", source = "boericke-mm-9" },
]

