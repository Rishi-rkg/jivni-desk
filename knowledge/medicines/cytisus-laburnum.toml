id = "cytisus-laburnum"
name = "Cytisus laburnum"
abbreviation = "Cyt-l."
aliases = ["Laburnum"]

symptoms = [
  { section = "General", text = "All parts of this shrub are poisonous, producing inflammation of stomach and intestines, with vomiting, diarrhœa, headache, paleness of face and cold skin.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Widespread anæsthesia, and convulsions are some of the chief effects of this drug.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cerebrospinal meningitis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great prostration, sense of constriction in throat, stiffness of nape, tearing from nape into occiput, lusterless eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Stupefaction; indifference (Phos ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Unequally dilated pupils; giddiness; twitching of facial muscles (Agaric).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Hydrocephalus.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Constant vertigo, intense sleepiness.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Excessive thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Constant nausea, vomiting; burning pain in epigastrium.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tenesmus and erections.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Grass-green urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Numbness and pain in hands.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Difficulty in moving them.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Compare: Nux; Gels.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cystine (produces motor paralysis resembling that of curare and death through respiratory paralysis).", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Third potency.", source = "boericke-mm-9" },
]

