aliases = ["Cochineal"]

symptoms = [
  { section = "General", text = "The clinical application of the symptoms of this remedy, place it among the medicines for spasmodic and whooping coughs, and catarrhal conditions of the bladder; spasmodic pains in kidneys, with visceral tenesmus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Anuria, anasarca, ascites.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Early morning or afternoon sadness.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Suboccipital soreness; worse after sleep and exertion.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache, worse from lying on back, better with the head high.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dull pain over right eye in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sensation of a foreign body between upper lid and eyeball.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Distress from cinders lodged in eye.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Constant hawking from enlarged uvula; coryza, with inflamed fauces; accumulation of thick viscid mucus, which is expectorated with great difficulty.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tickling in larynx.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sensation of a crumb behind larynx, must swallow continually; brushing teeth causes cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Fauces very sensitive.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Suffocative cough; worse, first waking, with tough, white mucus, which strangles.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Spasmodic morning cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Whooping cough attacks end with vomiting of this tough mucus.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Chronic bronchitis complicated with gravel; large quantities of albuminous, tenacious mucus, are expectorated.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Walking against wind takes breath away.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Sensation as if everything were pressed toward the heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Urging to urinate; brick-red sediment.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Urinary calculi, hæmaturia, urates, and uric acid; lancinating pains from kidney to bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Deep-colored, thick urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Dysuria.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses too early, profuse, black and thick; dark clots, with dysuria.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Intermittent menstruation; flow only in evening and at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Large clots escape when passing water.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Labia inflamed.", grade = 2, source = "boericke-mm-9" },
]

