# Cornus circinata: one remedy of the Jivni reference library. The format is described in knowledge/README.md.
# Imported from a public-domain book; do not edit this file by hand. A clinic's own changes go in its
# own layer, which is merged over this file and never rewrites it.

id = "cornus-circinata"
name = "Cornus circinata"
abbreviation = "Corn."
aliases = ["Round-leaved Dogwood"]

symptoms = [
  { section = "General", text = "Chronic malaria, hepatitis, jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Weakness in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain in pit of stomach, with distended abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Vesicular eruption associated with chronic liver disease or aphthous stomatitis.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Ulceration of tongue, gums and mouth; aphthæ.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Burning in mouth, throat and stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Loose, windy, dark stool, immediately after dinner.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Burning in anus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Dark, bilious, offensive diarrhœa, with sallow complexion.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Vesicular eczema of face in infants, with nursing sore mouth.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Cornus alternifolia -Swamp Walnut--(Weak and tired; disturbed sleep, fever, restlessness, eczema; skin cracked; chest feels cold, as if full of ice); Cornus florida (chronic malaria; indigestion and distressing acid heartburn; general debility from loss of fluids and night sweats; neuralgic pains in arms, chest, and trunk, and sensation as if broken in two; intermittent fever, with drowsiness; feels cold, but is warm to touch; great exhaustion in intervals; general clammy sweat. Chill is preceded by drowsiness, heat is associated with drowsiness. Headache after quinine).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture to sixth attenuation.", source = "boericke-mm-9" },
]

