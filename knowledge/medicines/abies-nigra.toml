  { section = "Chest", text = "Worse coughing; waterbrash succeeds cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Choking sensation in throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Dyspnœa; worse lying down; sharp, cutting pain in heart; heart's action heavy and slow; tachycardia, bradycardia.", grade = 2, source = "boericke-mm-9" },
