aliases = ["Arsenite of Quinine"]

symptoms = [
  { section = "General", text = "The symptoms of general weariness and prostration produced by the drug have been utilized in prescribing it homeopathically as a general tonic, often with very marked beneficial and prompt effect.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "In diphtheria with great prostration, cases that are prolonged, especially, and in malarial affections, neuralgia, etc, it has been found curative.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Asthmatic attacks which recur periodically, with great prostration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Icy skin.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pressure in the solar plexus, with tender spine back of it.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Tired feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Head feels too full.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Throbbing.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Great anxiety.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Great irritability.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo; worse looking up.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dull, heavy headache, frontal and occipital.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Darting pains running up into head.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Intense photophobia and orbicular spasm; gushing hot tears.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Flickering with pain and lachrymation.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue thickly furred; yellow, slimy coating.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Bitter taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "No appetite.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Alternation of hyperacidity and decrease of acid.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hyperchlorhydria (Robinia; Arg nit; Orexine tannate).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Thirst for water, yet it disturbs.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Anorexia.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Eggs produce diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Palpitation.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Sensation as if heart stopped.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Suffocative attacks, occurring in periodical paroxysms.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Must have open air.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Short of breath on ascending; cardiac dyspnœa; circulatory weakness after acute infections; early myocardial degeneration.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Sleeplessness due to nervous causes (Single dose of 5th or 6th potency).", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Weak limbs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Coldness of hands and feet, knees and limbs.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tearing pains.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Continuous, with weakness.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "System depleted.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Chininum; also Ferrum Citricum (in nephritis with great anæmia; acid dyspepsia in chlorosis. Morbus maculosus Werlhoffii); Chinin mur (in severe neuralgic pains around eyes, with chills; exaggerated sensitiveness to alcohol and tobacco; prostration and restlessness). Œnothera (effortless diarrhœa with nervous exhaustion; incipient hydrocephaloid). Macrozamia spiralis (extreme debility after illness; collapse).", source = "boericke-mm-9" },
  { section = "Dose", text = "Second and third trituration.", source = "boericke-mm-9" },
