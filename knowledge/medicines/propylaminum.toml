id = "propylaminum"
name = "Propylaminum"
abbreviation = "Prop."
aliases = ["Distilled Herring-brine", "Propylamin - trimethylaminum"]

symptoms = [
  { section = "General", text = "In acute rheumatism, dissipates fever and pain in a day or two.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Rheumatic prosopalgia, and rheumatic metastases, especially heart lesions.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in wrists and ankles; worse, slightest motion (Bry).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Great restlessness and thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatism, needle held in fingers gets too heavy.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tingling and numbness of fingers.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in wrist and ankle, unable to stand.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "(Chenopodium vulvaria. The plant has an odor of decaying fish and contains a large amount of Propylamine. Weakness is lumbar and lower dorsal region).", source = "boericke-mm-9" },
  { section = "Dose", text = "Ten to fifteen drops, in about six ounces of water; teaspoonful doses every two hours.", source = "boericke-mm-9" },
]

