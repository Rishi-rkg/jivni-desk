  { section = "Relationship", text = "Complementary: Thuja. Compare: Sanguisorba (Venous congestion and passive hæmorrhages; varices of lower extremities; dysentery. Long lasting profuse menses with congestion to head and limbs in sensitive, irritable patients. Climacteric hæmorrhages. Use 2x attenuation). Sanguisuga.--The leech--(Hæmorrhages, especially bleeding from anus. Use 6x). Rosmarinus (menses too early; violent pains followed by uterine hæmorrhage. Head heavy, drowsy. Chilly with icy coldness of lower extremities without thirst, followed by heat. Memory deficient). Croc; Calc; Trill; Ipec; Millef; Erig. Antidote: Puls.", source = "boericke-mm-9" },
