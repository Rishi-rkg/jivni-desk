id = "rumex-crispus"
name = "Rumex crispus"
abbreviation = "Rumx."
aliases = ["Yellow Dock"]

symptoms = [
  { section = "General", text = "Is characterized by pains, numerous and varied, neither fixed nor constant anywhere.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cough caused by an incessant tickling in the throat-pit, which tickling runs down to the bifurcation of the bronchial tubes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Touching the throat-pit brings on the cough.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Worse from the least cold air; so that all cough ceases by covering up all the body and head with the bedclothes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Rumex diminishes the secretions of mucous membranes, and at the same time exalts sensibility of the mucous membranes of the larynx and trachea.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Its action upon the skin is marked, producing an intense itching.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Lymphatics enlarged and secretions perverted.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tongue sore at edges; coated; sensation of hard substance in pit of stomach; hiccough, pyrosis, nausea; cannot eat meat; it causes eructations, pruritus.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Jaundice after excessive use of alcoholics.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Chronic gastritis; aching pain in pit of stomach and shooting in the chest; extends towards the throat-pit, worse any motion or talking.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Pain in left breast after meals; flatulence.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Nose dry.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tickling in throat-pit causes cough.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Copious mucous discharge from nose and trachea.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry, teasing cough, preventing sleep.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Aggravated by pressure, talking, and especially by inspiring cool air and at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Thin, watery, frothy expectoration by the mouthful: later, stringy and tough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Rawness of larynx and trachea.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Soreness behind sternum, especially left side, in region of left shoulder.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Raw pain under clavicle.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Lump in throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Brown, watery, diarrhœa early in morning, with cough, driving him out of bed.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Valuable in advanced phthisis (Seneg; Puls; Lycop; Ars).", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Itching of anus, with sensation as of a stick in rectum.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Piles.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Intense itching of skin, especially of lower extremities; worse, exposure to cold air when undressing.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Urticaria; contagious prurigo.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "evening, from inhaling cold air", source = "boericke-mm-9" },
  { kind = "worse", text = "left chest", source = "boericke-mm-9" },
  { kind = "worse", text = "uncovering", source = "boericke-mm-9" },
]

relationships = [
  { kind = "similar", medicine = "causticum", name = "Causticum", as_written = "Caust", source = "boericke-mm-9" },
  { kind = "similar", medicine = "sulphur", name = "Sulphur", as_written = "Sulph", source = "boericke-mm-9" },
  { kind = "similar", medicine = "belladonna", name = "Belladonna", as_written = "Bell", source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Caust; Sulph; Bell; Rumex contains chrysophanic acid to which the skin symptoms correspond. Rumex acetosa -Sheep sorrel--(Gathered in June and dried, used locally for Epithelioma of face (Cowperthwaite). Dry, unremitting short cough, and violent pains in the bowels; uvula elongated; inflammation of œsophagus; also cancer); Rumex obtusifolius-Lapathum -Broad-leaf dock--(nosebleed and headache following; pain in kidneys; leucorrhœa).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to sixth potency.", source = "boericke-mm-9" },
]

