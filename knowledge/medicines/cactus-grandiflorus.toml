  { section = "Chest", text = "Palpitation; pain shooting down left arm.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Hæmoptysis, with convulsive, spasmodic cough.", grade = 1, source = "boericke-mm-9" },
