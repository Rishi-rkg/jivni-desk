  { section = "Heart", text = "Violent palpitation; worse lying on left side, at approach of menses.", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "Angina pectoris, with suffocation, cold sweat, and ever-present iron band feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Pain in apex, shooting down left arm.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Palpitation, with vertigo; dyspnœa, flatulence.", grade = 1, source = "boericke-mm-9" },
