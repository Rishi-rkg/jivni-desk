  { section = "Heart", text = "Endocardial murmurs, excessive impulse, increased præcordial dullness, enlarged ventricle.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Low blood pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Œdema of hands and feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Hands soft; feet enlarged.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Numbness of left arm.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Icy-cold hands.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Restless legs.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Sleepless on account of pulsation in different parts of body.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Frightful dreams.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Fever every day at same hour.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Coldness in back and icy-cold hands.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Intermittent; paroxysms about midday (11 am) incomplete in their stages, accompanied by hæmorrhages.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Coldness predominates; cold sweat, with great anguish.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Persistent subnormal temperature.", grade = 1, source = "boericke-mm-9" },
]

