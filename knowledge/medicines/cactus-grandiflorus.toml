id = "cactus-grandiflorus"
name = "Cactus grandiflorus"
abbreviation = "Cact."
aliases = ["Night-blooming Cereus", "Selenicereus spinulosus"]

symptoms = [
  { section = "General", text = "Acts on circular muscular fibers, hence constrictions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is the heart and arteries especially that at once respond to the influence of Cactus, producing very characteristic constrictions as of an iron band.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "This sensation is found in various places, œsophagus, bladder, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The mental symptoms produced correspond to those found when there are heart affections, sadness, and melancholy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hæmorrhage, constrictions, periodicity, and spasmodic pains.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Whole body feels as if caged, each wire being twisted tighter.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Atheromatous arteries and weak heart.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Congestions; irregular distribution of blood.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Favors formation of clots speedily.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Great periodicity.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Toxic goitre with cardiac symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cactus is pulseless, panting and prostrated.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Melancholy, taciturn, sad, ill-humored.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Fear of death.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Screams with pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Anxiety.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache if obliged to pass dinner hour (Ars; Lach; Lyc).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Sensation as of a weight on vertex.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Right-sided pulsating pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Congestive headaches, periodical, threatening apoplexy.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Blood-vessels to the head distended.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feels as if head were compressed in a vise.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pulsation in ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dim sight.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Right sided prosopalgia, constricting pains, returns at same hour daily (Cedron).", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Profuse bleeding from nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Fluent coryza.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Constriction of œsophagus.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Dryness of tongue, as if burnt; needs much liquid to get food down.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Suffocative constriction at throat, with full, throbbing carotids in angina pectoris.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Constriction, pulsation, or heaviness in stomach.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting of blood.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Hard, black stools.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Diarrhœa in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Hæmorrhoids swollen and painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Sensation of great weight in anus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Hæmorrhage from bowels in malarial fevers and with heart symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Constriction of neck of bladder, causing retention of urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Hæmorrhage from bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Clots of blood in urethra.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Constant urination.", grade = 1, source = "boericke-mm-9" },
