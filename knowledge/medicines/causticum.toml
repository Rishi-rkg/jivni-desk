  { section = "Relationship", text = "According to the careful investigations of Dr. Wagner of Basel, Causticum corresponds to Ammon causticum 4x. Causticum does not agree with Phosphorus; the remedies should not be used after each other. Diphtherotoxin follows, causticum in chronic bronchitis. Antidote: Paralysis from lead-poisoning. Complementary: Carbo; Petrosel. Compare: Rhus; Arsenic; Amm phos (facial paralysis).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth attenuation. In chronic ailments and especially in paralytic states, the higher potencies once or twice a week.", source = "boericke-mm-9" },
