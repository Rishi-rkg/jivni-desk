symptoms = [
  { section = "General", text = "Manifests its action mainly in chronic rheumatic, arthritic and paralytic affections, indicated by the tearing, drawing pains in the muscular and fibrous tissues, with deformities about the joints; progressive loss of muscular strength, tendinous contractures.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Broken down seniles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In catarrhal affections of the air passages, and seems to choose preferably dark-complexioned and rigid-fibered persons.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Restlessness at night, with tearing pains in joints and bones, and faint-like sinking of strength.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This weakness progresses until we have gradually appearing paralysis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Local paralysis, vocal cords, muscles of deglutition, of tongue, eyelids, face, bladder and extremities.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Children are slow to walk.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The skin of a Causticum person is of a dirty white sallow, with warts, especially on the face.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Emaciation due to disease, worry, etc, and of long standing.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Burning, rawness, and soreness are characteristic.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Child does not want to go to bed alone.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Least thing makes it cry.", grade = 1, source = "boericke-mm-9" },
