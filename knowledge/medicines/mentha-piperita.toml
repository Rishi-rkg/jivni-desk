id = "mentha-piperita"
name = "Mentha piperita"
abbreviation = "Menth."
aliases = ["Peppermint"]

symptoms = [
  { section = "General", text = "Stimulates the cold-perceiving nerves, so just after taking it, a current of air at the ordinary temperature seems cold.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Marked action on respiratory organs and skin.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Useful in gastrodynia, flatulent cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Bloated, disturbing sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Infantile colic.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Bilious colic with great accumulation of gas.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Voice husky.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Tip of nose to touch.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Throat dry and sore, as if pin crosswise in it.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiration", text = "Dry cough, worse from air into larynx, tobacco smoke, fog, talking; with irritation in suprasternal fossa (Rumex).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiration", text = "Trachea painful to touch.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Every scratch becomes a sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching of arm and hand when writing.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Vaginal pruritus.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Herpes zoster (Ars; Ran bulb).", grade = 2, source = "boericke-mm-9" },
]

relationships = [
  { kind = "similar", medicine = "rumex-crispus", name = "Rumex crispus", as_written = "Rumex", source = "boericke-mm-9" },
  { kind = "similar", medicine = "lachesis-mutus", name = "Lachesis mutus", as_written = "Laches", source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Rumex; Laches; Mentha pulegium --European pennyroyal--(pain in bones of forehead and extremities). Mentha viridis -Spearmint--(scanty urine with frequent desire).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, 1 to 20 drops, to thirtieth potency. Locally, in pruritus vaginæ.", source = "boericke-mm-9" },
]

