  { section = "Eyes", text = "Small objects look large.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Parts of the body seem enormously swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Strabismus.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "All objects look black.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Hot, red; circumscribed redness of cheeks.", grade = 1, source = "boericke-mm-9" },
