id = "stramonium"
name = "Stramonium"
abbreviation = "Stram."
aliases = ["Thorn-apple"]

symptoms = [
  { section = "General", text = "The entire force of this drug seems to be expended on the brain, through the skin and throat show some disturbance.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Suppressed secretions and excretions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation as if limbs were separated from body.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Delirium tremens.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Absence of pain and muscular mobility especially of muscles of expression and of locomotion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gyratory and graceful motions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Parkinsonism.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Devout, earnest, beseeching and ceaseless talking.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Loquacious, garrulous, laughing, singing, swearing, praying, rhyming.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Sees ghosts, hears voices, talks with spirits.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Rapid changes from joy to sadness.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Violent and lewd.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Delusions about his identity; thinks himself tall, double, a part missing.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Religious mania.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Cannot bear solitude or darkness; must have light and company.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Sight of water or anything glittering brings on spasms.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Delirium, with desire to escape (Bell; Bry; Rhus).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Raises head frequently from the pillow.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in forehead and over eyebrows, beginning at 9 am; worse until noon.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Boring pain, preceded by obscure vision.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Rush of blood to head; staggers, with tendency to fall forward and to the left.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Auditory hallucinations.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Seem prominent, staring wide open; pupils dilated.", grade = 2, source = "boericke-mm-9" },
