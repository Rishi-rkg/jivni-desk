  { section = "General", text = "Has some reputation as a remedy for epileptic conditions, and convulsive diseases of childhood and girls at puberty.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Locally and internally is injurious to eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Petit mal.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Epilepsy without aura; after fright and other violent emotions and after masturbation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Several convulsions close together.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Somnambulism.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Gets up at night and works, remembers nothing in the morning (Kali phos).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Drawn back by spasmodic twitchings.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Mouth drawn to left.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Congestion of brain.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Colored light produces dizziness.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pain and blurring of vision; better; rubbing; worse, using eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Profuse menses.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Violent uterine contractions.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Spasms during menses.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Profuse sweat, smelling like garlic.", grade = 2, source = "boericke-mm-9" },
]

