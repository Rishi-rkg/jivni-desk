  { section = "General", text = "Diabetes, tongue dry, red, and cracked.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Cold saliva.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Multiform erythema of trunk and upper extremities. Œdema around eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Exfoliating dermatitis. Œdema of tissues around eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Climacteric flushings (Lach; Amyl nit).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Vagina cold, as if packed with ice.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Frequent urination with burning and tenesmus.", grade = 1, source = "boericke-mm-9" },
  { section = "Non-homeopathic Uses", text = "When the diplococcus of Weichselbaum is present in the sputum of pharyngitis or bronchitis, pneumonia with tenacious sputum, hacking cough and pain, five-grain doses six times daily.", grade = 1, source = "boericke-mm-9" },
  { section = "Non-homeopathic Uses", text = "A solution of Boracic Acid, as an injection, in chronic, cystitis, or, a teaspoonful to a glass of hot milk, taken internally.", grade = 1, source = "boericke-mm-9" },
  { section = "Non-homeopathic Uses", text = "Boro-Glyceride in solution (1:40) is a powerful antiseptic.", grade = 1, source = "boericke-mm-9" },
  { section = "Non-homeopathic Uses", text = "Styes, 15 gr to 1 oz water externally.", grade = 2, source = "boericke-mm-9" },
  { section = "Non-homeopathic Uses", text = "As a dusting powder on ulcerated surfaces.", grade = 1, source = "boericke-mm-9" },
  { section = "Non-homeopathic Uses", text = "In cystitis as an irrigating fluid.", grade = 1, source = "boericke-mm-9" },
]

