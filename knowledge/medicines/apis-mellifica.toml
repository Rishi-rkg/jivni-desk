symptoms = [
  { section = "General", text = "Acts on cellular tissues causing œdema of skin and mucous membranes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The very characteristic effects of the sting of the bee furnish unerring indications for its employment in disease.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Swelling or puffing up of various parts, œdema, red rosy hue, stinging pains, soreness, intolerance of heat, and slightest touch, and afternoon aggravation are some of the general guiding symptoms.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Erysipelatous inflammations, dropsical effusions and anasarca, acute, inflammation of kidneys, and other perenchymatous tissues are characteristic pathological states corresponding to Apis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Apis acts especially on outer parts, skin, coatings of inner organs, serous membranes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It produces serous inflammation with effusion, membranes of brain, heart, pleuritic effusion, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Extreme sensitiveness to touch and general soreness is marked.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Constricted sensations.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sensation of stiffness and as of something torn off in the interior of the body.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Much prostration.", grade = 1, source = "boericke-mm-9" },
