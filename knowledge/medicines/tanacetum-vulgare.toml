symptoms = [
  { section = "General", text = "Abnormal lassitude.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nervous and tired feeling. \"Half dead, half alive feeling\" all over.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Of use in chorea and reflex spasms (worms).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Said to be a specific against effects of poison ivy.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Heavy, dull, confused.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache with least exertion.", grade = 1, source = "boericke-mm-9" },
  { section = "Mental", text = "Irritable, sensitive to noise.", grade = 1, source = "boericke-mm-9" },
  { section = "Mental", text = "Mental fatigue, nausea and vertigo, worse in a closed room.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Roaring and ringing; voice sounds strange; ears seem to close up suddenly.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain in bowels; relieved by stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Desire for stool immediately after eating.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Dysentery.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Dysmenorrhœa, with bearing-down pains, tenderness, drawing in groins.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses suppressed; later, profuse.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hurried, labored, stertorous respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Frothy mucus obstructs the air-passages.", grade = 1, source = "boericke-mm-9" },
]

