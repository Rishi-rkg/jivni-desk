notes = [
  { section = "Relationship", text = "Compare: Datura arborea-Bougmancia candida (cannot concentrate thoughts; brain floats in thousands of problems and grand ideas. Floating sensation as if ideas were floating outside of brain. Headache, heartburn. Burning sensation around cardiac and of stomach, extending to œsophagus with sense of constriction. Heat and fullness over liver region). Cetraria -Iceland Moss (chronic diarrhœa, phthisis, bloody expectoration. Is used as a decoction and boiled with milk as an expectorant and nutrient in bronchorrhœa, catarrh, etc). Also compare: Eryng; Dros; Stilling; Rumex; Sambuc.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, to sixth potency.", source = "boericke-mm-9" },
]

