id = "sticta-pulmonaria"
name = "Sticta pulmonaria"
abbreviation = "Stict."
aliases = ["Lungwort", "Sticta"]

symptoms = [
  { section = "General", text = "Offers a set of symptoms like coryza, bronchial catarrh and influenza, together with nervous and rheumatic disturbances.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "There is a general feeling of dullness and malaise, as when a cold is coming on; dull, heavy pressure in forehead, catarrhal conjunctivitis, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Rheumatic stiffness of neck.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Feels as if floating in air (Datura arborea; Lac.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Can).", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Confusion of ideas; patient must talk.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Dull headache, with dull heavy pressure in forehead and root of nose.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Catarrhal headache before discharge appears.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Burning in eyes and soreness of balls.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sensation as if scalp were too small.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Burning in eyelids.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Feeling of fullness at the root of the nose (Nux).", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Atrophic rhinitis (Calc fluor).", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Dryness of nasal membrane.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Constant need to blow the nose, but no discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Dry scabs, especially in evening and night.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Hay-fever; incessant sneezing (Sabad).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Scanty flow of milk.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Diarrhœa; stools profuse, frothy; worse, morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Urine increased, with soreness and aching in bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Throat raw; dropping of mucus posteriorly.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry, hacking cough during night; worse, inspiration.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tracheitis, facilitates expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Loose cough in morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pain through chest from sternum to spiral column.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough after measles (Sang); worse towards evening and when tired.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pulsation from right side of sternum down to abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatic pain in right shoulder joint, deltoid, and biceps.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Swelling, heat, redness of joints.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Spot of inflammation and redness over affected joint.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain severe and drawing.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Chorea-like spasms; legs feel floating in air.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Housemaid's knee (Rhus; Kali hyd; Slag).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Shooting pains in knees.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Joints and neighboring muscles red, swollen, painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatic pains precede catarrhal symptoms.", grade = 1, source = "boericke-mm-9" },
]

