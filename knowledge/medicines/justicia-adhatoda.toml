  { section = "Head", text = "Irritable, sensitive to external impressions; hot, full and heavy head; lachrymation, with coryza, profuse, fluent, with constant sneezing; loss of smell and taste; coryza with cough.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Dry, pain during empty swallowing, tenacious mucus.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Mouth dry.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry cough from sternal region all over chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarseness, larynx painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Paroxysmal cough, with suffocative obstruction of respiration.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough with sneezing.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Severe dyspnœa with cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tightness across chest.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthmatic attacks, cannot endure a close, warm room.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Whooping-cough.", grade = 2, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Seems to come between Cepa and Euphrasia, which compare.", source = "boericke-mm-9" },
