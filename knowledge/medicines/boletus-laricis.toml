id = "boletus-laricis"
name = "Boletus laricis"
abbreviation = "Bol-la."
aliases = ["White Agaric", "Polyporus officinale"]

symptoms = [
  { section = "General", text = "Quotidian intermittent fever.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sweat is light, and without relief.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Night-sweat in phthisis.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feels light and hollow with deep frontal headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Thick, yellow coating of tongue; teeth indented.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Constant nausea.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chilliness along spine, with frequent, hot flashes.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Yawns and stretches when chilly.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Severe aching in shoulders and joints and small of back.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Profuse perspiration at night, with hectic chills and fever.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Hot and dry, especially in palms.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching more between scapulæ and on forearms.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Agaricin, active constituent of Polyporus officinale (phthisical and other enervating nightsweats 1-4 to 1-2 gr doses; also in chorea, in dilatation of heart with pulmonary Emphysema, fatty degeneration, profuse perspiration and erythema). Boletus luridus (Violent pain in epigastrium, urticaria tuberosa). Boletus satanus (dysentery, vomiting, great debility, cold extremities, spasm of extremities and face).", source = "boericke-mm-9" },
  { section = "Dose", text = "First attenuation.", source = "boericke-mm-9" },
]

