notes = [
  { section = "Relationship", text = "Antidote: Ipec. Compare: Tabac; Ars; Tart e; Verat; Rosa. Lobelia syphilitica or cerulea (gives a perfect picture of sneezing influenza, involving the posterior nares, palate, and fauces. Very depressed. Pain in forehead over eyes; pain and gas in bowels, followed by copious watery stools with tenesmus and soreness of anus. Pain in knees. Prickling in soles. Great oppression in lower part of chest, as if air could not reach there. Pain in chest under short ribs of left side. Dry, hacking cough. Breathing difficult. Dull, aching pain over root of nose. Eustachian catarrh. Pain in posterior part of spleen). Lobelia erinus (malignant growths, extremely rapid development; colloid cancer of the omentum; cork-screw-like pains in abdomen; great dryness of skin, nasal and buccal mucous membranes; distaste for brandy; dry, eczematous patches covering points of first fingers. Malignant disease of the face. Epithelioma).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, to thirtieth potency. Locally the tincture is antidotal to Poison-oak. Often the Acetum Lobelia acts better than any other preparation. Lobelia hypodermically acts clinically almost precisely as the antitoxin of diphtheria does upon the infection and renders the system stronger to resist future infections (F. Ellingwood).", source = "boericke-mm-9" },
]

