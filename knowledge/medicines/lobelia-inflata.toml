  { section = "General", text = "Is a vaso-motor stimulant; increases the activity of all vegetative processes; spends its force mainly upon the pneumogastric nerve, producing a depressed relaxed condition with oppression of the chest and epigastrium, impeded respiration, nausea and vomiting.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Languor, relaxation of muscles, nausea, vomiting and dyspepsia are the general indications that point to the use of this remedy, in asthma and gastric affections.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Best adapted to light complexioned fleshy people.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bad effects of drunkenness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Suppressed discharges (Sulph).", grade = 2, source = "boericke-mm-9" },
