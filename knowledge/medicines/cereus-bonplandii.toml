id = "cereus-bonplandii"
name = "Cereus bonplandii"
abbreviation = "Cere-b."
aliases = ["A Night-blooming Cereus"]

symptoms = [
  { section = "General", text = "Mind.-- Great desire to work and to be doing something useful.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Occipital headache and pain through the globe of the eyes and orbits (Cedron; Onos).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Pain across the brain from left to right.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain along right malar bone running to temple.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Convulsive pains at the heart; feels as if transfixed.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Pain in chest through heart, with pain running toward spleen.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Pain in left pectoral muscle and cartilages of left lower ribs.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Sensation of a great weight on heart, and pricking pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Hypertrophy of heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Difficult, sighing respiration, as from some compression of chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching of skin (Dolich; Sulph).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in neck, back, shoulders, down arms, hands and fingers.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in knees and joints of lower extremities.", grade = 1, source = "boericke-mm-9" },
]

