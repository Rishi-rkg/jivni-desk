symptoms = [
  { section = "General", text = "The action of this drug is centered in the liver, and portal system, causing soreness, pain, jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Has specific relation to the vascular system.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Abuse of alcoholic beverages, especially beer.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Varicose veins and ulcers.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Diseases of miners, associated with asthma.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dropsical conditions depending on liver disease, and when due to pelvic congestion and hepatic disease.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Disturbs sugar metabolism.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Influenza when liver is affected.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Debility.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hæmorrhages, especially connected with hepatic disease.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Despondency; forgetful, apathetic.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Contractive feeling above eyebrows.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dull heavy, stupid, with foul tongue.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, with tendency to fall forward.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Burning and pressure in eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nose-bleed.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Taste bitter.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Aversion to salt meat.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Appetite small; tongue furred; nausea; retching; vomiting of green, acid fluid.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Stitches in left side of stomach, near spleen (Ceanoth).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Gallstone disease with enlarged liver.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain in region of liver.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Left lobe very sensitive.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Fullness and soreness, with moist skin.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Constipation; stools hard, difficult, knotty; alternates with diarrhœa.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Stools bright yellow.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Swelling of gall bladder with painful tenderness.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Hyperæmia of liver, with jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Cirrhosis, with dropsy.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Hæmorrhagic piles, prolapse or rectum, burning pain in anus and rectum, hard and knotting, clayey stools.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Profuse diarrhœa due to rectal cancer. 10 drops doses (Wapler).", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Cloudy; golden-colored.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Stitching pains in lower right ribs and front; worse, moving, walking, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Asthmatic respiration.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Pain in chest, going to shoulders, back, loins and abdomen, with urging to urinate.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching on lying down at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Varicose ulcers (Clematis vitalba).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Eruption on lower part of sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in hip-joint, spreading through buttocks and down thigh; worse from stooping.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Difficult rising.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Weakness felt in feet, especially after sitting.", grade = 1, source = "boericke-mm-9" },
