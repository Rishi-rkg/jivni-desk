notes = [
  { section = "Relationship", text = "Complementary: Carbo; (Lowness of vitality may suggest a preliminary course of Carbo to nurse up recuperation to the point that Kali carb would come in helpfully). Follows Nux often in stomach and bladder troubles. Compare: Kali salicylicum (vomiting, especially of pregnancy; arteriosclerosis, with chronic rheumatism); kali silicum (gouty nodosities); Kali aceticum (diabetes, diarrhœa, dropsy, alkaline urine, very much increased in quantity); Kali citricum (Bright's disease-1 gr to wine-glass of water); Kali ferrocyanatum -Prussian blue--(physical and mental prostration following infection. Inability to sustained routine work. Neuralgic affections depending on impoverished blood and exhausted nerve centers, especially spinal. Fatty and functional heart troubles. Pulse weak, small, irregular. Uterine symptoms, like Sepia, bearing-down sensation and gastric sinking; profuse, pus-like leucorrhœa and passive hæmorrhage; use 6x); Kali oxalicum (lumbago, convulsions); Kali picro-nitricum and kali pricricum (jaundice, violent eructations); kali tartaricum (paraplegia); Kali telluricum (garlicky odor of breath, salivation, swollen tongue). Also compare: Calc; Ammon phos; Phos; Lycop; Bry; Natrum; Stann; Sepia. Antidotes: Camph; Coffea.", source = "boericke-mm-9" },
  { section = "Dose", text = "Thirtieth and higher. Sixth trit. Do not repeat too often. Use cautiously in old gouty cases, advanced Bright's and tuberculosis.", source = "boericke-mm-9" },
]

