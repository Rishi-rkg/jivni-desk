id = "joanesia-asoca"
name = "Joanesia asoca"
abbreviation = "Joan."
aliases = ["Bark of an Indian Tree, introduced by Dr. ND Ray, Calcutta", "Jonosia asoca"]

symptoms = [
  { section = "General", text = "Has extensive sphere of action on female organs.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Amenorrhœa and metrorrhagia.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Unilateral headache; reflex uterine, congestive headache, better open air and by free flow.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in eyeballs; supraorbital pains, photophobia.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nasal catarrh, profuse, watery discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Loss of sense of smell.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastric", text = "Desire for sweets, also acid things.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastric", text = "Thirsty, excessive nausea; obstinate constipation, hæmorrhoids.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Delayed and irregular menses; menstrual colic; amenorrhœa, pain in ovaries before flow; menorrhagia, irritable bladder; leucorrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Disturbed.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Dreams of travelling.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Pain along spine radiating to abdomen and thighs.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Tincture.", source = "boericke-mm-9" },
]

