id = "mercurius-iodatus-flavus"
name = "Mercurius iodatus flavus"
abbreviation = "Merc-i-f."
aliases = ["Proto-iodide of Mercury"]

symptoms = [
  { section = "General", text = "Throat affections, with greatly swollen glands and characteristic coating of tongue.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Worse, right side.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chancre; induration remains long time.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Swollen inguinal glands, large and hard.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Mammary tumors, with tendency to much warm perspiration and gastric disturbances.", grade = 2, source = "boericke-mm-9" },
  { section = "Tongue", text = "Coated thickly; yellow at the base.", grade = 2, source = "boericke-mm-9" },
  { section = "Tongue", text = "Tip and edges may be red and take imprint of teeth.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Lacunar tonsillitis.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "When only the superficial part of the tonsil is involved.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Cheesy exudates with offensive breath.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Swelling begins on right side.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Small ulcers on posterior pharynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Easily detached patches on inflamed pharynx and fauces; worse on right tonsil; much tenacious mucus.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Sensation of a lump.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Constant inclination to swallow.", grade = 2, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Plum iod (in mammary tumors).", source = "boericke-mm-9" },
  { section = "Dose", text = "Second trituration.", source = "boericke-mm-9" },
]

