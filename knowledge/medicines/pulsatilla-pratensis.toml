notes = [
  { section = "Relationship", text = "Penthorum, often indicated after Pulsatilla in later colds. Ionesia Asoca -Saraca indica--(Amenorrhœa. Menorrhagia-acts powerfully on female organs. Abdominal pain). Atriplex (Uterine symptoms, amenorrhœa; hysteria, coldness between shoulders, dislike of warm food, craves strange foods, palpitation, sleeplessness). Pulsatilla Nuttaliana, identical effects. Compare: Cyclamen; Kali bich; Kali sulph; Sulphur. Pimenta -Allspice--(one-sided neuralgias, parts of body hot and cold). Anagyris (headache, amenorrhœa). Complementary: Coffea; Chamom; Nux.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth attenuation.", source = "boericke-mm-9" },
]

