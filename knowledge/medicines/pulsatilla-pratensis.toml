symptoms = [
  { section = "General", text = "The weather-cock among remedies.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The disposition and mental state are the chief guiding symptoms to the selection of Pulsatilla.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is pre-eminently a female remedy, especially for mild, gentle, yielding disposition.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sad, crying readily; weeps when talking; changeable, contradictory.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The patient seeks the open air; always feels better there, even though he is chilly.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Mucous membranes are all affected.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Discharges thick, bland, and yellowish-green.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Often indicated after abuse of Iron tonics, and after badly-managed measles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Symptoms ever changing.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Thirstless, peevish, and chilly.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "When first serious impairment of health is referred to age of puberty.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great sensitiveness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Wants the head high.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Feels uncomfortable with only one pillow.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Lies with hands above head.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Weeps easily.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Timid, irresolute.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Fears in evening to be alone, dark, ghost.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Likes sympathy.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Children like fuss and caresses.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Easily discouraged.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Morbid dread of the opposite sex.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Religious melancholy.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Given to extremes of pleasure and pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Highly emotional.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Mentally, an April day.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Wandering stitches about head; pains extend to face and teeth; vertigo; better in open air.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Frontal and supra-orbital pains.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Neuralgic pains, commencing in right temporal region, with scalding lachrymation of affected side.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Headache from overwork.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pressure on vertex.", grade = 1, source = "boericke-mm-9" },
