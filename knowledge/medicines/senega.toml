id = "senega"
name = "Senega"
abbreviation = "Seneg."
aliases = ["Snakewort"]

symptoms = [
  { section = "General", text = "Catarrhal symptoms, especially of the respiratory tract, and distinct eye symptoms of a paralytic type, are most characteristic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Circumscribed spots in chest left after inflammations.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Suddenly remembers unimportant regions which he saw long ago.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Inclined to quarrel.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dullness, with pressure and weakness of eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in temples.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Bursting pain in forehead.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Hyperphoria, better by bending head backwards.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Acts on the rectus superior.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Blepharitis; lids dry and crusty (Graph).", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Dryness, with sensation as if too large for orbits.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Starting.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Lachrymation.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Flickering; must wipe eyes frequently.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Objects look shaded.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Muscular asthenopia (Caust).", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Double vision; better only by bending head backward.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Opacities of the vitreous humor.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Promotes absorption of fragments of lens, after operation.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Dry.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Coryza; much watery mucus and sneezing.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Nostrils feel peppery.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Paralysis of left side of face.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Heat in face.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Burning vesicles in corners of mouth and lips.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Catarrhal inflammation of throat and fauces, with scraping hoarseness.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Burning and rawness.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Sensation as if membrane had been abraded.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarseness.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hurts to talk.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Bursting pain in back on coughing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Catarrh of larynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Loss of voice.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hacking cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Thorax feels too narrow.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough often ends in a sneeze.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Rattling in chest (Tart emet).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Chest oppressed on ascending.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Bronchial catarrh, with sore chest walls; much mucus; sensation of oppression and weight of chest.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Difficult raising of tough, profuse mucus, in the aged.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthenic bronchitis of old people with chronic interstitial nephritis or chronic emphysema.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Old asthmatics with congestive attacks.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Exudations in Pleura.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hydrothorax (Merc sulph).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pressure on chest as though lungs were forced back to spine.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Voice unsteady, vocal cords partially paralyzed.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Greatly diminished; loaded with shreds and mucus; scalding before and after urinating.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Back, bursting distending pain in kidney region.", grade = 2, source = "boericke-mm-9" },
]

