notes = [
  { section = "Relationship", text = "Antidotes: Bell; Camph. Compare: Bellad; Stram; Agaric; Gels. Hyosc hydrobrom.--Scopolamine hydrobromide (Paralysis agitans); tremors of disseminated sclerosis. Sleeplessness and nervous agitation. Dry cough in phthisis. Similar in its effects to alcohol, both recent and remote. Corresponds to the effects of strong poisons introduced into or generated within the body. Symptoms of uræmia and acute nervous exhaustion. A remedy for shock. Third and fourth dec trituration. In physiological dosage (1-200 gr) mania and chorea; insomnia. Scopola (Japanese Belladonna)-chemically identical with Hyoscine (Joyous delirium, licking of lips and smacking of mouth; sleepless; tries to get out of bed; sees cats, picks imaginary hairs, warms hands before imaginary fire, etc).", source = "boericke-mm-9" },
  { section = "Dose", text = "Sixth, to 200th potency.", source = "boericke-mm-9" },
]

