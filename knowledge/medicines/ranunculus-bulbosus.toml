  { section = "Head", text = "Pressing pain in forehead from within outward.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Day-blindness; mist before eyes; pressure and smarting in eyes, as from smoke.", grade = 1, source = "boericke-mm-9" },
