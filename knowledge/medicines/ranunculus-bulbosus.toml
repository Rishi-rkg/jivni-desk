  { section = "Relationship", text = "Incompatible: Sulph; Staph. Compare: Ranunc acris (pain in lumbar muscles and joints by bending and turning body); Ranunc glacialis -Reindeer flower Carlina--(Pulmonary affections; broncho-pneumonical Influenza-enormous weight in head with vertigo and sensation as of impending apoplexy; night-sweats-more on thighs); Ranunc repens (crawling sensation in forehead and scalp in evening in bed); Ranunc flammula (ulceration; gangrene of arm). Compare, also: Bry; Croton; Mez; Euphorb. Antidotes: Bry; Camph; Rhus.", source = "boericke-mm-9" },
  { section = "Dose", text = "Mother tincture, in ten to thirty drop doses in delirium tremens; third to thirtieth potency generally. Chronic sciatica, apply tincture to heel of affected leg (M. Jousset).", source = "boericke-mm-9" },
]

