symptoms = [
  { section = "General", text = "Has considerable clinical reputation in the treatment of earache, toothache, and enuresis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sharp pain in eyes, reflex from decayed teeth or inflammation of middle ear.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Eyeball very tender to touch.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain plays between teeth and ears.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pyorrhea alveolaris.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Depression and insomnia of chronic Nicotinism.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Causes an aversion to tobacco.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Periodical prosopalgia, worse 7 am to 2 pm, accompanied with flow of tears, photophobia; pains radiate to temples and lower face.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Hearing acute; noise painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Sticking pain in ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Neuralgic earache; pain goes from one ear to the other through the head.", grade = 2, source = "boericke-mm-9" },
  { section = "Ears", text = "Otalgia, with toothache.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Loud noises go through one.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Sudden, yellowish, watery discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Teeth ache and are sensitive and sore to touch.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Swelling of cheeks.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Salivation; teeth feel too long; worse, cold air and contact.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Toothache, better while eating.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Profuse of saliva.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Toothache, with reflex neuralgia of eyelids.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Wants to defecate; goes often, but cannot bad, can hardly stand.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Diarrhœa, with brown watery", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Profuse flow; nocturnal enuresis (Rhus arom; Caust; Bellad).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching and burning; papulæ.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Urticaria, chilblains (Agar; Tamus).", grade = 2, source = "boericke-mm-9" },
]

