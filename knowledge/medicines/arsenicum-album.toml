  { section = "Relationship", text = "Complementary: Rhus; Carbo; Phos. Thuja; Secale. Antidotal to lead poison. Antidotes: Opium; Carbo; China; Hepar; Nux. Chemical Antidotes: Charcoal; Hydrated Peroxide of Iron; Lime Water. Compare: Arsenic stibatum 3x (Chest inflammations of children, restlessness with thirst and prostration, loose mucous cough, oppression, hurried respiration, crepitant rales). Cenchris contortrix; Iod; Phosph; China; Verat alb; Carbo; Kali phos. Epilobium (intractable diarrhœa of typhoid). Hoang Nan. Atoxyl. Sodium arseniate 3x, sleeping sickness; commencing optic atrophy. Levico Water --(containing Ars, Iron and Copper of South Tyrol). Chronic and dyscratic skin diseases, chorea minor and spasms in scrofulous and anæmic children. Favors assimilation and increases nutrition. Debility and skin diseases, especially after the use of higher potencies where progress seems suspended.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency. The very highest potencies often yield brilliant results. Low attenuations in gastric, intestinal, and kidney diseases; higher in neuralgias, nervous diseases, and skin. But if only surface conditions call for it, give the lowest potencies, 2x to 3x trit. Repeated doses advisable.", source = "boericke-mm-9" },
]

