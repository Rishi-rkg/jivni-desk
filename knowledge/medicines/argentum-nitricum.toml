notes = [
  { section = "Relationship", text = "Antidote: Nat mur. Compare: Ars; Merc; Phos; Pulsat. Argent cyanatum (angina pectoris, asthma, spasm of œsophagus) Argent iodat (throat disorders, hoarseness, gland affected). Protargol (gonorrhœa after acute stage 2 per cent solution; syphilitic mucous patches, chancres and chancroids, 10 per cent solution applied twice a day; ophthalmia neonatorum, 2 drops of 10 per cent solution). Argent phosph (An excellent diuretic in dropsy). Argent oxyd (Chlorosis with menorrhagia and diarrhœa).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency. Best form an aqueous solution 1 to 9, 2 or 3 drops doses. This solution in water preferable to lower triturations; unless fresh, these readily decompose into the oxide.", source = "boericke-mm-9" },
