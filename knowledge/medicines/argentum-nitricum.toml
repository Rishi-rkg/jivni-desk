  { section = "General", text = "Sensation as if a part were expanding and other errors of perception are characteristic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Withered up and dried constitutions present a favorable field for its action, especially when associated with unusual or long continued mental exertion.", grade = 1, source = "boericke-mm-9" },
