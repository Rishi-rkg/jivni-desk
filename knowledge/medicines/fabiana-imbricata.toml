id = "fabiana-imbricata"
name = "Fabiana imbricata"
abbreviation = "Fab."
aliases = ["Pichi"]

symptoms = [
  { section = "General", text = "A South American shrub cultivated in Southern California.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is a terebrinthine diuretic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It has also tonic and chologogue properties, used in the treatment of nasal catarrh, jaundice, dyspepsia and to increase the secretion of bile (Albert Schneider).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Useful in the uric acid diathesis, cystitis, gonorrhœa, prostatitis, dysuria, vesical catarrh with suppurative prostatic conditions; post-gonorrhœal urinary conditions; cholethiasis and liver affections.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Vesical tenesmus and burning after urination.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Excoriating urine and calculi.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Ten to twenty drops of the tincture.", source = "boericke-mm-9" },
]

