id = "strychninum-phosphoricum"
name = "Strychninum phosphoricum"
abbreviation = "Stry-p."
aliases = ["Phosphate of Strychnin", "Strychnia phosphorica"]

symptoms = [
  { section = "General", text = "This drug acts through the cerebro-spinal system upon muscles, causing twitching, stiffness, weakness and loss of power; upon circulation, producing irregularity of pulse, and upon the mind, producing lack of control, uncontrollable desire to laugh and disinclination to use the brain.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Very irregular pulse.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tachycardia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Rapid and weak pulse.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Useful in chorea, hysteria, acute asthenia after acute fevers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Symptoms worse motion, better rest and in open air.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "An excellent remedy in anæmia of spinal cord; paralysis; burning, aching, and weakness of spine; pain extends to front of chest; tenderness on pressure in mid-dorsal region; cold, clammy feet; hands and axillæ covered with clammy perspiration.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Atelectasis and break in the compensation of a hypertrophied heart; the beginning of fatty degeneration of the heart muscle (Royal).", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Third trituration.", source = "boericke-mm-9" },
]

