symptoms = [
  { section = "General", text = "Strophanthus is a muscle poison; it increases the contractile power of all striped muscles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts on the heart; increasing the systole and diminishes the rapidity.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "May be used with advantage to tone the heart, and run off dropsical accumulations.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In small doses for weak heart; it feels enlarged.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In mitral regurgitation, where œdema and dropsy have supervened (Digit).", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Strophanthus occasions no gastric distress, has no cumulative effects, is a greater diuretic, and is safer for the aged, as it does not affect the vaso-motors.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In pneumonia and in severe prostration from hæmorrhage after operations and acute diseases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "After the long use of stimulants; irritable heart of tobacco-smokers.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Arterio-sclerosis; rigid arteries of aged.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Restores tone to a brittle tissue, especially of the heart muscle and valves.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Especially useful in failing compensation dependent upon fatty heart.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hives.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Anæmia with palpitation and breathlessness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Exophthalmia goitre.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Corpulent persons.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Temporal pains with double vision, impaired sight; brilliant eyes, flushed face.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Senile vertigo.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea with special disgust for alcohol and so aids in treatment of dipsomania.", grade = 1, source = "boericke-mm-9" },
