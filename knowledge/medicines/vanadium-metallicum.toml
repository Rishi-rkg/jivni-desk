id = "vanadium-metallicum"
name = "Vanadium metallicum"
abbreviation = "Vanad."
aliases = ["The Metal", "Vanadium"]

symptoms = [
  { section = "General", text = "Its action is that of an oxygen carrier and a catalyzer, hence its use in wasting diseases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Increases amount of hemoglobin, also combines its oxygen with toxines and destroys their virulence.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Also increases and stimulates phagocytes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A remedy in degenerative conditions of the liver and arteries.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Anorexia and symptoms of gastro intestinal irritation; albumen, casts and blood in urine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tremors; vertigo; hysteria and melancholia; neuro-retinitis and blindness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Anæmia, emaciation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cough dry, irritating and paroxysmal, sometimes with hæmorrhages.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Irritation of nose, eyes and throat.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tuberculosis, chronic rheumatism, diabetes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts as a tonic to digestive function and in early tuberculosis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Arterio-sclerosis, sensation as if heart was compressed, as if blood had no room in the aorta.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Anxious pressure on whole chest.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Fatty heart.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Degenerative states, has brain softening.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Atheroma of arteries of brain and liver.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Compare: Ars; Phos.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Ammon vanad (fatty degeneration of liver).", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "6-12 potency. The best form is Vanadiate of Soda, 2 mg daily, by mouth.", source = "boericke-mm-9" },
]

