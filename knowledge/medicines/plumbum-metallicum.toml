notes = [
  { section = "Relationship", text = "Compare: Plumb acet (painful cramps in paralyzed limbs; severe pain and muscular cramps in gastric ulcer; locally, as an application (non-homeopathic) in moist eczema, and to dry up secretions from mucous surfaces. Care must be used, as sufficient lead can be absorbed to produce lead poison, one to two drams of the liquor plumbi subacetatis to the ounce of water; also in pruritus pudendi, equal parts of the liquor plumbi and glycerin). Plumb iodat (Has been used empirically in various forms of paralysis, sclerotic degenerations, especially of spinal cord, atrophies, arterio-sclerosis, pellagra. Indurations of mammary glands, especially when a tendency to become inflamed appears; sore and painful. Indurations of great hardness and associated with a very dry skin. Lancinating pains of Tabes). Compare: Alumina; Plat; Opium; Podoph; Merc; Thall. Plectranthus (paralysis, spastic, spinal form); Plumb chromicum (convulsions, with terrible pains; pupils greatly dilated; retracted abdomen;); Plumb phosph (loss of sexual power; locomotor ataxia). Antidotes: Plat; Alum; Petrol.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to thirtieth potency.", source = "boericke-mm-9" },
]

