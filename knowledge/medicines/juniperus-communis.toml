notes = [
  { section = "Relationship", text = "Compare: Sabina; Juniperus Virginianus -Red Cedar--(Violent tenesmus vesical. Persistent dragging in back; hyperæmia of the kidneys; pyelitis and cystitis; dropsy of the aged with suppressed urine. Dysuria, burning, cutting pain in urethra when urinating. Constant urging apoplexy, convulsions, strangury, uterine hæmorrhage). Terebinthina.", source = "boericke-mm-9" },
  { section = "Dose", text = "Best form is the infusion. One ounce to a pint of boiling water. Dose, one-half to two ounces, or tincture, one to ten drops. JUSTICIA ADHATODA An Indian Shrub, Singhee (JUSTICIA ADHATODA BASAKA) Highly efficacious medicine for acute catarrhal conditions of the respiratory tract (used in the beginning)", source = "boericke-mm-9" },
  { section = "Relationship", text = "Seems to come between Cepa and Euphrasia, which compare.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third potency and higher. Severe aggravation have been noticed from lower potencies.", source = "boericke-mm-9" },
]

