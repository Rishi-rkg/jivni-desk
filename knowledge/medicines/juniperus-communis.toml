  { section = "Head", text = "Irritable, sensitive to external impressions; hot, full and heavy head; lachrymation, with coryza, profuse, fluent, with constant sneezing; loss of smell and taste; coryza with cough.", grade = 2, source = "boericke-mm-9" },
