id = "magnesium-carbonicum"
name = "Magnesium carbonicum"
abbreviation = "Mag-c."
aliases = ["Carbonate of Magnesia", "Magnesia carbonica"]

symptoms = [
  { section = "General", text = "Gastro-intestinal catarrh, with marked acidity.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Often used with advantage for complains arising in people who have been taking this drug to sweeten the stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Is frequently indicated in children; whole body smells sour, and disposed to boils.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Broken-down, \"worn-out\" women, with uterine and climacteric disorders.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "With numbness and distension in various, parts and nerve prostration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensitive to the least start, noise, touch, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Affection of the antrum of Highmore.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Effects of shock, blows, mental distress.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sense of numbness; nerve prostration; tendency to constipation after nervous strain; sensitive to least touch, it causes starting, or cold winds or weather or from excess of care and worry with constipation and heaviness.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Intense neuralgic pains.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sticking pain in the side of the head on which he lies, as if the hair was pulled; worse, mental exertion.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Itching of scalp worse in damp weather.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain above margin of right orbit.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Blank motes before eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Diminished hearing.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Deafness; comes suddenly and varies.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Numbness of outer ear.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Feeling of distention of middle ear.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Subdued tinnitus.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Tearing pain in one side; worse; quiet; must move about.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Toothache, especially during pregnancy; worse at night; worse, cold and quiet.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Teeth feel too long.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Ailments from cutting wisdom teeth (Cheiranthus).", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Pain in malar bone, worse during rest, night.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Swelling of malar bone with pulsating pain, worse exposure to cold wind.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Dry at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Sour taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Vesicular eruption; bloody saliva.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Sticking pain in throat; hawking up fetid, pea-colored particles.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Desire for fruit, acids, and vegetables.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Eructations sour, and vomiting of bitter water.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Craving for meat.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Rumbling, gurgling.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Dragging towards pelvis.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Very heavy; contractive, pinching, pain in right illiac region.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Preceded by griping, colicky pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Green, watery, frothy, like a frog-pond's scum.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Bloody mucous stools.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Milk passes undigested in nursing children.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Sour, with tenesmus (Rheum).", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Constipation after mental shock or severe nervous strain.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Sore throat before menses appear.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Before menses, coryza and nasal stoppage.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses too late and scanty, thick, dark, like pitch; mucous leucorrhœa.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Menses flow only in sleep; more profuse at night (Amm m), or when lying down; cease when walking.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Ticking cough, with salty, bloody expectoration.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Constrictive pains in chest, with dyspnœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Soreness in chest during motion.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tearing in shoulders as if dislocated.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Right shoulder painful, cannot raise it (Sang).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Whole body feels tired and painful, especially legs and feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Swelling in bend of knee.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Earthy, sallow and parchment-like; emaciation.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching vesicles on hands and fingers.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Nodosities under skin.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Sore; sensitive to cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chilly in evening.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Fever at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Sour, greasy perspiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Unrefreshing; more tired on rising than on retiring.", grade = 1, source = "boericke-mm-9" },
]

