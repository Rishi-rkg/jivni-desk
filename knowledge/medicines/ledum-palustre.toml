symptoms = [
  { section = "General", text = "Affects especially the rheumatic diathesis, going through all the changes, from functional pain to altered secretions and deposits of solid, earthy matter in the tissues.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The Ledum rheumatism begins in feet, and travels upward.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It affects also the skin, producing an eruption like Poison-oak, and is antidotal thereto, as well as to stings of insects.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "There is a general lack of animal heat, and yet heat of bed is intolerable.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "For punctured wounds, produced by sharp-pointed instruments or bites particularly if the wounded parts are cold, this is the remedy.", grade = 2, source = "boericke-mm-9" },
