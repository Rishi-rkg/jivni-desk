  { section = "Head", text = "Vertigo when walking, with tendency to fall to one side.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Distress when head is covered.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nosebleed (Mellilot; Bry).", grade = 2, source = "boericke-mm-9" },
