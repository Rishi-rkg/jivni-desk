  { section = "General", text = "Every organ and tissue of the body is more or less affected by this powerful drug; it transforms healthy cells into decrepit, inflamed and necrotic wrecks, decomposes the blood, producing a profound anæmia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This malignant medicinal force is converted into useful life saving and life preserving service if employed homeopathically, guided by its clear cut symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The lymphatic system is especially affected with all the membranes and glands, and internal organs, bones etc.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Lesions produced by mercury very similar to those of syphilis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Very often indicated in the secondary stage of syphilis where there is a febrile chloro-anæmia, rheumatoid pains behind sternum, around joints, etc; ulcerations of mouth and throat, falling of the air, the eruptions and ulcerations of mouth and throat, etc.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "These are the special conditions and stages to which Mercur is homeopathic and where the 2x will do surprising work.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Again, hereditary syphilis manifestations, are within its range; bullæ, abscesses, snuffles, marasmus, stomatitis or destructive inflammations.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tremors everywhere.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Weakness with ebullitions and tremblings from least exertion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "All Mercury symptoms are worse at night, from warmth of bed, from damp, cold, rainy weather, worse during perspiration.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Complaints increase with the sweat and rest; all associated with a great deal of weariness, prostration, and trembling.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A human \"thermometer\".", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensitive to heat and cold.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Parts are much swollen, with raw, sore feeling; the profuse, oily perspiration does not relieve.", grade = 1, source = "boericke-mm-9" },
