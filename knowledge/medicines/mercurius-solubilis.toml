notes = [
  { section = "Relationship", text = "Compare: Capparis coriaccea (polyuria, glandular affections, mucous diarrhœa; influenza); Epilobium --Willow herb--(chronic diarrhœa with tenesmus and mucous discharges; ptyalism, dysphagia; wasting of body and much debility; cholera infantum); Kali hyd (in hard chancre); Mercur acet (Congestion with stiffness, dryness and heat of parts affected. Eyes inflamed, burn and itch. Lack of moisture. Throat dry, talking difficult. Pressure in lower sternum; chancre in urethra; tenia capitis favosa margin of ulcers painful): Mercurius auratus (psoriasis and syphilitic catarrh; brain tumors; lues of nose and bones; ozæna; swelling of testicles); Mercurius bromatus (secondary syphilitic skin affection); Mercurius nitrosus -Nitrate of Mercury--(especially in postular conjunctivitis and keratitis; gonorrhœa and mucous patches, with sticking pains; syphilides); Mercurius phosphoricus (nervous diseases from syphilis; exostoses); Mercurius precipitatus ruber (suffocative attacks at night on lying down while on the point of falling asleep, obliged to jump up suddenly which relieves; gonorrhœa; urethra felt as a hard string; chancroid; phagedenic ulcer and bubo; pemphigus, mucous patches, eczema with rhagades and fissures, barber's itch; blepharitis, internally and externally; leaden heaviness in occiput, with otorrhœa); Mercurius tannicus (syphilides in patients with gastro-intestinal diseases, or, if very sensitive, to ordinary mercurial preparations); Erythrinus -South American Red Mullet Fish--(in pityriasis rubra and syphilis; red rash on chest; pityriasis); Lolium temulentum (in trembling of hands and legs); Mercur cum kali (inveterate colds, acute facial paralysis). Henchera -Alum root--(Gastro-enteritis nausea, vomiting of bile and frothy mucus; stools watery, profuse, slimy, tenesmus, never-get-done feeling. Dose, 2 to 10 drops of tincture). Compare: Mez; Phos; Syph; Kali mur; Aethiops. Antidote: Hep; Aur; Mez. Complementary: Badiaga.", source = "boericke-mm-9" },
  { section = "Dose", text = "Second to thirtieth potency.", source = "boericke-mm-9" },
]

