  { section = "General", text = "The root contains a crystalline solid, that stimulates the growth of epithelium on ulcerated surfaces.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It may be administered internally in the treatment of gastric and duodenal juries to sinews, tendons and the periosteum.", grade = 1, source = "boericke-mm-9" },
