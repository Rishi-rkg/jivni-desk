  { section = "General", text = "Neuralgia of knee.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Of great use in wounds penetrating to perineum and bones, and in non-union of fractures; irritable stump after amputation, irritable bone at point of fracture.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Psoas abscess.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pricking pain and soreness of periosteum.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in occiput, top and forehead; changing places.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain comes down bone of nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Inflammation of inferior maxillary bone, hard, red, swelling.", grade = 1, source = "boericke-mm-9" },
  { section = "Eye", text = "Pain in eye after a blow of an obtuse body.", grade = 2, source = "boericke-mm-9" },
  { section = "Eye", text = "For traumatic injuries of the eyes no remedy equals this.", grade = 1, source = "boericke-mm-9" },
