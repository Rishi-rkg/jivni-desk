notes = [
  { section = "Relationship", text = "Compare: Sanguisorba officinals 2x-6x, a member of the Rosaceæ family, (Profuse, long-lasting menses, especially in nervous patients with congestive symptoms to head and limbs. Passive hæmorrhages at climacteric. Chronic metritis. Hæmorrhage from lungs. Varices and ulcers). Mandragora --(Mandrake). A narcotic of the ancients-Restless excitability and bodily weakness. Desire for sleep. Has antiperiodic properties like China and Aranea. Useful in epilepsy and hydrophobia, also Cetonia (A. E. Lavine). Hyos (less fever, more agitation); Stram (more sensorial excitement, frenzy); Hoitzia -A Mexican drug, similar in action to Bellad (Useful in fever, scarlatinal eruption, measles, urticaria, etc. High fever with eruptive fevers. Dry mouth and throat, red face, injected eyes, delirium). Calcar is often required after Bell; Atropia. Alkaloid of Belladonna covers more the neurotic sphere of the Belladonna action (Great dryness of throat, almost impossible to swallow. Chronic stomach affections, with great pain and vomiting of all food. Peritonitis. All kind of illusions of sight. Everything appears large. Platina opposite). Hypochlorhydria; pyrosis. Motes over everything. On reading, words run together; double vision, all objects seem to be elongated. Eustachian tube and tympanic congestion. Affinity for the pancreas. Hyperacidity of stomach. Paroxysms of gastric pain; ovarian neuralgia.", source = "boericke-mm-9" },
  { section = "Non-Homeopathic Uses", text = "Atropia and its salts are used for ophthalmic purposes, to dilate the pupil and paralyze the accommodation. Given internally or hypodermically, it is antagonistic to Opium and Morphine. Physostigma and Prussic Acid. Narcotic poisons and mushroom poisoning. Renal colic 1-200 of a grain hypodermically. Atropin injected subcutaneously in doses from a milligram upwards for intestinal obstruction threatening life. Hypodermically 1-80 gr night sweats in phthisis. Atropia 1-20 gr is antagonistic to 1 gr. Morphine. Also used as a local anæsthetic, antispasmodic, and to dry up secretions, milk, etc. Hypodermically 1-80 gr night sweats in phthisis.", source = "boericke-mm-9" },
  { section = "Dose", text = "Atropia Sulph, 1-120 to 1-60 grain. Antidotes to Belladonna: Camph; Coff; Opium; Acon. Complementary: Calc. Bellad (contains lime). Especially in semi-chronic and constitutional diseases. Incompatible: Acet ac.", source = "boericke-mm-9" },
  { section = "Dose", text = "First to thirtieth potency and higher. Must be repeated frequently in acute diseases.", source = "boericke-mm-9" },
]

