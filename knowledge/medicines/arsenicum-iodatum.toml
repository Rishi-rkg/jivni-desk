  { section = "General", text = "Epithelioma of the lip.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cancer of breast after ulceration has set in.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It seems probable that in Arsenic iod, we have a remedy most closely allied to manifestations of tuberculosis.", grade = 1, source = "boericke-mm-9" },
