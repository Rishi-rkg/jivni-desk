  { section = "General", text = "This remedy is also to be remembered in phthisis with hoarse, racking cough and profuse expectoration of a purulent nature, and attended with cardiac weakness, emaciation and general debility; in chronic, watery diarrhœa in phthisical subjects; in cases of emaciation with good appetite; in amenorrhœa, with anæmic palpitation and dyspnœa.", grade = 1, source = "boericke-mm-9" },
