notes = [
  { section = "Relationship", text = "Compare: Bellad; Solanum Carolinense -Horse-nettle--(conclusions and epilepsy, twenty to forty-drop doses; is of great value in grand mal of idiopathic type, where the disease has begun beyond age of childhood; hystero-epilepsy, also in whooping-cough); Solan mammosum -Apple of Sodom--(pain in left hip-joint); Solan oleraceum (swelling of mammary gland, with profuse secretion of milk); Solan tuberosum (cramps in calves and contraction of fingers; spitting through closed teeth); Solan vesicarium (recommended in facial paralysis); Solaninum aceticum (threatening paralysis of the lungs in the course of bronchitis in the aged and children must cough a long time before able to raise expectoration); Solan pseudocaps (acute pains, in lower abdomen); Solan tuberos ægrotans -Diseased potato--(prolapse of the rectum, patulous anus; offensive breath and odor of body; tumors of rectum look like decayed potato; dreams of pools of blood); Solanum tuberosum -Potato berries--(cramps in the calves of the legs and fingers).", source = "boericke-mm-9" },
  { section = "Dose", text = "Second to thirtieth potency.", source = "boericke-mm-9" },
]

