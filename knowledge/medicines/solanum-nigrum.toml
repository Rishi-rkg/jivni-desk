id = "solanum-nigrum"
name = "Solanum nigrum"
abbreviation = "Sol-n."
aliases = ["Black Nightshade"]

symptoms = [
  { section = "General", text = "Used with success in ergotism, with tetanic spasms and stiffness of whole body, with mania.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Marked action on head and eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Meningitis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Chronic intestinal toxæmia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Brain irritation during dentition.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Restlessness of a violent and convulsive nature.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Formication with contraction of extremities.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Furious delirium.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo; terrible headache and complete cessation of the mental faculties.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Night terrors.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Congestive headache.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Acute coryza; profuse, watery discharge from right nostril; left stopped up, with chilly sensation, alternating with heat.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pain over both eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Alternate dilatation and contraction of pupils; weak sight; floating spots.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Constructive feeling in chest, with difficult breathing; cough with tickling in throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Expectoration thick, yellow.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pain in left chest, sore to touch.", grade = 2, source = "boericke-mm-9" },
  { section = "Fever", text = "Alternation of coldness and heat.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Scarlet fever; eruption in spots, large and vivid.", grade = 1, source = "boericke-mm-9" },
]

