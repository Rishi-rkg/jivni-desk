  { section = "General", text = "An important addition to the Materia Medica, especially since the provings by Diffenbach have precisionized its use.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Radium brom of 1,800,000 radio-activity was employed.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Found effective in the treatment of rheumatism and gout, in skin affections generally, acne rosacea, nævi, moles, ulcers and cancers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Lowered blood pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Severe aching pains all over, with restlessness, better moving about.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Chronic rheumatic arthritis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Lateness in appearance of symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Ulcers due to Radium burns, take a long time to heal.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Marked increase in the polymorphonuclear neutrophiles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great weakness.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Apprehensive, depressed; fear of being alone in the dark; great desire to be with people.", grade = 1, source = "boericke-mm-9" },
