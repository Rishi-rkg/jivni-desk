notes = [
  { section = "Relationship", text = "Antidotes: Acon; Camph; Puls. Compare: Cantharidin --(Glomerular nephritis). The immediate pharmacological action of Cantharidin is irritability of the capillaries, rendering the passage of nutritive fluids through them less difficult. This is most marked in the capillaries of the kidneys. The increase of blood sugar coincident with the glomerular nephritis appears to be a valuable observation. Vesicaria --(Urinary and kidney remedy. Smarting, burning sensation along urethra and in bladder with frequent desire to void urine often with strangury. Cystitis, irritable bladder. Tincture 5-10 drop doses). Fuschina coloring substance used in adulteration of wine (Cortical nephritis with albuminuria, 6th-30th potency. Redness of ears, mouth, swollen gums; deep, red urine; red, profuse diarrhœa, with severe abdominal pains). Androsace lactea (urinary troubles, diuretic; dropsy). Apis; Ars; Merc cor. Complementary: Camph.", source = "boericke-mm-9" },
  { section = "Dose", text = "Sixth to thirtieth potency. Bears repeated doses well. Locally, in burns and eczema, 1x and 2x, in water, or as cerate.", source = "boericke-mm-9" },
]

