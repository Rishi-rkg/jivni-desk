id = "bryonia-alba"
name = "Bryonia alba"
abbreviation = "Bry."
aliases = ["Wild Hops", "Bryonia"]

symptoms = [
  { section = "General", text = "Acts on all serous membranes and the viscera they contain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Aching in every muscle.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The general character of the pain here produced is a stitching, tearing; worse by motion, better rest.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "These characteristic stitching pains, greatly aggravated by any motion, are found everywhere, but especially in the chest; worse pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Mucous membranes are all dry.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "The Bryonia patient is irritable; has vertigo from raising the head, pressive headache; dry, parched lips, mouth; excessive thirst, bitter taste, sensitive epigastrium, and feeling of a stone in the stomach; stools large, dry, hard; dry cough; rheumatic pains and swellings; dropsical effusions into synovial and serous membranes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bryonia affects especially the constitution of a robust, firm fiber and dark complexion, with tendency to leanness and irritability.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It prefers the right side, the evening, and open air, warm weather after cold days, to manifest its action most markedly.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Children dislike to be carried or raised.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Physical weakness, all-pervading apathy.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Complaints apt to develop slowly.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Exceedingly irritable; everything puts him out of humor.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Delirium; wants to go home; talks of business.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, nausea, faintness on rising, confusion.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Bursting, splitting headache, as if everything would be pressed out; as if hit by a hammer from within; worse from motion, stooping, opening eyes.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Headache becomes seated in occiput.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Drawing in bones towards zygoma.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache; worse on motion, even of eyeballs.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Frontal headache, frontal sinuses involved.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Frequent bleeding of nose when menses should appear.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Also in the morning, relieving the headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Coryza with shooting and aching in the forehead.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Swelling of tip of nose, feels as if it would ulcerate when touched.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Aural vertigo (Aur; Nat sal; Sil; Chin).", grade = 2, source = "boericke-mm-9" },
  { section = "Ears", text = "Roaring, buzzing.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pressing, crushing, aching pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Glaucoma.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Sore to touch and when moving them.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Lips parched, dry, cracked.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Dryness of mouth, tongue, and throat, with excessive thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue coated yellowish, dark brown; heavily white in gastric derangement.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Bitter taste (Nux; Col).", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Burning in lower lip in old smokers.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Lip swollen, dry, black, and cracked.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Dryness, sticking on swallowing, scraped and constricted (Bell).", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Tough mucus in larynx and trachea, loosened only after much hawking; worse coming into warm room.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea and faintness when rising up.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Abnormal hunger, loss of taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Thirst for large draughts.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting of bile and water immediately after eating.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Worse, warm drinks, which are vomited.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Stomach sensitive to touch.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Pressure in stomach after eating, as of a stone.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Soreness in stomach when coughing.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Dyspeptic ailments during summer heat.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sensitiveness of epigastrium to touch.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Liver region swollen, sore, tensive.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Burning pain, stitches; worse, pressure, coughing, breathing.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Tenderness of abdominal walls.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Constipation; stools hard, dry, as if burnt; seem too large.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Stools brown, thick, bloody; worse in morning, from moving, in hot weather, after being heated, from cold drinks, every spell of hot weather.", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Red, brown, like beer; scanty, hot.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menses too early, too profuse; worse from motion, with tearing pains in legs; suppressed, with vicarious discharge or splitting headache.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Stitching pains in ovaries on taking a deep inspiration; very sensitive to touch.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pain in right ovary as if torn, extending to thigh (Lilium; Croc).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Milk fever.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Pain in breasts at menstrual period.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Breasts hot and painful hard.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Abscess of mammæ.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Frequent bleeding of nose at appearance of menses.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Menstrual irregularities, with gastric symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Ovaritis.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Intermenstrual pain, with great abdominal and pelvic soreness (Ham). Respiratory.-- Soreness in larynx and trachea.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Hoarseness; worse in open air.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Dry, hacking cough from irritation in upper trachea.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Cough, dry, at night; must sit up; worse after eating or drinking, with vomiting, with stitches in chest, and expectoration of rust-colored sputa.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Frequent desire to take a long breath; must expand lungs.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Difficult, quick respiration; worse every movement; caused by stitches in chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Cough, with feeling as if chest would fly to pieces; presses his head on sternum; must support chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Croupous and pleuro-pneumonia.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Expectoration brick shade, tough, and falls like lumps of jelly.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Tough mucus in trachea, loosened only with much hawking.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Coming into warm room excites cough (Nat carb).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Heaviness beneath the sternum extending towards the right shoulder.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Cough worse by going into warm room.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Stitches in cardiac region.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Angina pectoris (use tincture).", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Painful stiffness in nape of neck.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Stitches and stiffness in small of back.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "From hard water and sudden changes of weather.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Knees stiff and painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Hot swelling of feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Joints red, swollen, hot, with stitches and tearing; worse on least movement.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Every spot is painful on pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Constant motion of left arm and leg (Helleb).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Yellow; pale, swollen, dropsical; hot and painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Seborrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Hair very greasy.", grade = 2, source = "boericke-mm-9" },
  { section = "Sleep", text = "Drowsy; starting when falling asleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Delirium; busy with business matters and what he had read.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Pulse full, hard, tense, and quick.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill with external coldness, dry cough, stitches.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Internal heat.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Sour sweat after slight exertion.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Easy, profuse perspiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Rheumatic and typhoid marked by gastro-hepatic complications.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "warmth, any motion, morning, eating, hot weather, exertion, touch", source = "boericke-mm-9" },
  { kind = "note", text = "Cannot sit up; gets faint and sick.", source = "boericke-mm-9" },
  { kind = "better", text = "lying on painful side, pressure, rest, cold things", source = "boericke-mm-9" },
]

relationships = [
  { kind = "antidote", medicine = "aconitum-napellus", name = "Aconitum napellus", as_written = "Acon", source = "boericke-mm-9" },
  { kind = "antidote", medicine = "chamomilla", name = "Chamomilla", as_written = "Cham", source = "boericke-mm-9" },
  { kind = "antidote", medicine = "nux-vomica", name = "Nux vomica", as_written = "Nux", source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Complementary: Upas when Bryonia fails. Rhus; Alumina. Illecebrum.--A Mexican drug.--(Fever with catarrhal symptoms, gastric and typhoid fever symptoms). Antidotes: Acon; Cham; Nux. Compare: Asclep tub; Kali mur; Ptelia.", source = "boericke-mm-9" },
  { section = "Dose", text = "First to twelfth attenuation.", source = "boericke-mm-9" },
]

