notes = [
  { section = "Relationship", text = "Cymarin is the active principle of Apocyn, lowers pulse rate and increases blood-pressure. Strophanthus (extreme cardiac depression with intense gastric disturbance; dropsy). Aralia hispida -Wild Elder-a valuable diuretic, useful in dropsy of the cavities, either due to hepatic or renal disease with constipation. Urinary disorders, especially with dropsy. Scudder advises doses of five to thirty drops in sweetened cream of tartar, (Solution). Apis, Arsenic, Digital; Helleb.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture (ten drops three times daily) and in acute alcoholism 1 dram of decoction in 4 oz water.", source = "boericke-mm-9" },
]

