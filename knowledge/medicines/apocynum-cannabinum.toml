abbreviation = "Apoc."
aliases = ["Indian Hemp"]

symptoms = [
  { section = "General", text = "Increases secretions of mucous and serous membranes and acts on cellular tissue, producing œdema and dropsy and on skin causing diaphoresis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acute hydrocephalus.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "A diminished frequency of the pulse is a prime indication.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This is one of our most efficient remedies, in dropsies, ascites, anasarca and hydrothorax, and urinary troubles, especially suppression and strangury.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "In the digestive complaints of Bright's disease, with the nausea, vomiting, drowsiness, difficult breathing, it will be found of frequent service.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The dropsy is characterized by great thirst and gastric irritability.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Arrhythmia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Mitral and tricuspid regurgitation.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Acute alcoholism.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Relaxation of sphincters.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Bewildered.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Low spirited.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Long-continued sneezing.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Snuffles of children (Sambucus).", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Chronic nasal catarrh with tendency to acute stuffiness with dull, sluggish memory.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Dull headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Takes cold easily, nostrils become congested and blocked up easily.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea, with drowsiness.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Thirst on walking.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Excessive vomiting.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Food or water is immediately ejected.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Dull, heavy, sick feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Oppression in epigastrium and chest, impeding breathing (Lobelia infl).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sensation of sinking in stomach.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Abdomen bloated.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Ascites.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Watery, flatulent, with soreness in anus; worse after eating.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Feeling as if sphincter were open and stools ran right out.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Bladder much distended.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Turbid, hot urine, with thick mucus and burning in urethra, after urinating.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Little expulsive power.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Dribbling.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Strangury.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Renal Dropsy.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Amenorrhœa, with bloating; metrorrhagia with nausea; fainting, vital depression.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Hæmorrhages at change of life.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Blood expelled in large clots.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Short, dry cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Respiratory short and unsatisfactory.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sighing.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Oppression about epigastrium and chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Tricuspid regurgitation; rapid and feeble, irregular cardiac action, low arterial tension, pulsating jugulars, general cyanosis and general dropsy.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Great restlessness and little sleep.", grade = 1, source = "boericke-mm-9" },
]

