  { section = "General", text = "Children's diarrhœa with constant cutting pains.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Nervous, timid, easily startled.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Has erroneous notions about himself.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Imagines that he is very sick; that parts are shrunken; that she is pregnant; that she has cancer; delirium during intermittents.", grade = 1, source = "boericke-mm-9" },
