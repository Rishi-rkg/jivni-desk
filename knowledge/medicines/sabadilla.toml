  { section = "Head", text = "Over-sensitiveness to odors.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Thinking produces headache and sleeplessness.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Eyelids red, burning.", grade = 2, source = "boericke-mm-9" },
