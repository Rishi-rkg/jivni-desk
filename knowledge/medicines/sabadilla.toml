  { section = "Relationship", text = "Complementary: Sepia. Compare: Veratrina (is alkaloid of Sabadilla, not of Veratrum, locally in neuralgias, and for removal of dropsy. Five grains to two drams Lanolin, rubbed on inside of thighs, causes diuresis). Colch; Nux; Arundo and Pollatin. Phleum pratense -Timothy-Hay-fever-Potentized-12-specific to many cases and evidently acts in a desensitizing manner (Rabe). Cumarinum (hay-fever). Antidotes: Puls; Lycop; Conium; Lach.", source = "boericke-mm-9" },
