  { section = "Throat", text = "Dry fauces and throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Sensation of a lump in throat with constant necessity to swallow.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Chronic sore throat; worse, from cold air.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Tongue as if burnt.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Spasmodic pain in stomach with dry cough and difficult breathing.", grade = 1, source = "boericke-mm-9" },
