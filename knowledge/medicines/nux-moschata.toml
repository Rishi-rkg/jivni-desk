  { section = "Relationship", text = "Oleum myristicae -Oil of Nutmeg--(as a remedy for boils, felons, poisonous ulcers, it has been used in the 2x potency); Ornithogalum (flatulence, swollen feeling across lower chest; whenever she turns in bed, feels as if a bag of water turned also; gastric ulcer and cancer). Myristica Sebifera (phlegmonous inflammations, hastens suppuration; powerful antiseptic. Ulcerative tendency in all tissues. Said to act more powerfully than Hepar and Silica). Compare: Nux v; Puls; Rhus; Ign; Asaf. Antidotes: Camph; Gels; Valer.", source = "boericke-mm-9" },
