id = "cimex-lectularius"
name = "Cimex lectularius"
abbreviation = "Cimx."
aliases = ["Bedbug", "Cimex - acanthia"]

symptoms = [
  { section = "General", text = "Of use in intermittent fever, with weariness and inclination to stretch.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hamstrings feel too short (Ammon mur).", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Flexors mostly affected.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation of retraction of arm tendons.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Stretching.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Violent headache, caused by drinking.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Great rage; vehement at beginning of chilly stage.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Would like to tear everything to pieces.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain under right frontal bone.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Shooting pain from vagina up towards left ovary.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chilliness of whole body.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Sensation as of wind blowing on knees.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Pains in all joints, as if tendons were too short, especially knee-joints.", grade = 2, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill; worse lying down.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Thirst during apyrexia, but little during chilly stage; still less during hot stage, and none during sweating.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Musty, offensive sweat.", grade = 1, source = "boericke-mm-9" },
  { section = "Bowels", text = "Constipation, feces dry and in small balls (Op; Plumb; Thuj) and hard.", grade = 2, source = "boericke-mm-9" },
  { section = "Bowels", text = "Ulcer of rectum.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Sixth to two hundredth attenuation.", source = "boericke-mm-9" },
]

