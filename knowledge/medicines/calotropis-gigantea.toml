  { section = "General", text = "In the secondary symptoms of syphilis, where Mercury has been used but cannot be pushed safely any farther, it rapidly recruits the constitution, heals the ulcers and blotches from the skin, and perfects the cure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Primary anæmia of syphilis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Heat in stomach is a good guiding symptom.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Obesity, while flesh decreases, muscles become harder and firmer.", grade = 2, source = "boericke-mm-9" },
]

