symptoms = [
  { section = "General", text = "Cerebral congestion, with neuralgia; migraine; rheumatic and gouty pains.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sensation of a band around head; cannot keen hat on (Carbol ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Skin of forehead tense.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Fear of falling when standing up.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Violent vertigo, as if everything turned around.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Buzzing in ears; better in open air.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough, with burning and pricking in respiratory tracts.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Weak voice.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Urine smells strongly of violets (Terebinth).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Right axillary muscles painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Weight and lassitude in limbs, especially the shoulders.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Burning in hollow of right hand.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Drawing pain in thumb and big toe.", grade = 1, source = "boericke-mm-9" },
]

