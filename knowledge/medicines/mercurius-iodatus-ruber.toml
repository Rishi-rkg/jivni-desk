id = "mercurius-iodatus-ruber"
name = "Mercurius iodatus ruber"
abbreviation = "Merc-i-r."
aliases = ["Bin-iodide of Mercury"]

symptoms = [
  { section = "General", text = "Diphtheria and ulcerated sore throats, especially on left side, with much glandular swelling.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chronic suppurating buboes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hard chancres.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Old cases of syphilis in scrofulous patients.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Early stages of cold, especially in children.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Fauces dark red; swallowing painful.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Phlegm in nose and throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Disposition to hawk, with sensation of a lump in throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Stiffness of muscles of throat and neck.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Coryza and dull hearing; right side of nose hot.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Hawks mucus from posterior nares.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Turbinated bones swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Boggy mucus membrane of nose and throat; closure of Eustachian tube, opening with a pop.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Gums swollen; toothache; glands swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Scalded feeling on tongue.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Aphthæ.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Profuse saliva.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue feels stiff at base, and pains on moving.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Diphtheria; submaxillary glands painfully engorged, fauces dark red; worse on left tonsil.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Parenchymatous tonsillitis.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Will often abort peritonsillitis if given frequently.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Cough form elongated uvula, with sore throat, Laryngeal troubles with aphonia.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Small fissures and cracks; hard papules; Hunterian chancre; syphilitic ulcers.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Bubo.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Sarcocele.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Third trituration. Mercuric iodide is far more active as a bactericide than the other mercurials, including the chloride.", source = "boericke-mm-9" },
]

