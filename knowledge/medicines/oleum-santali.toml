id = "oleum-santali"
name = "Oleum santali"
abbreviation = "Ol-sant."
aliases = ["Oil of Sandalwood"]

symptoms = [
  { section = "General", text = "The action in the urinary and sexual spheres is most utilizable, especially in gonorrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is also a stimulating, disinfectant expectorant.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Two or three drops on sugar will frequently relieve the hacking cough, when but little sputum is expectorated.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Painful erections; swelling of the prepuce.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Thick, yellowish, muco-purulent discharge.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Deep pain in perineum.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Frequent, burning, smarting swelling, and redness of meatus.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Stream small and slow.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Acute aching in kidney region.", grade = 2, source = "boericke-mm-9" },
  { section = "Urine", text = "Sensation of a ball pressing against the urethra; worse, standing.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Gleet, with profuse, thick discharge; chronic cystitis.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Two to ten m in capsules.", source = "boericke-mm-9" },
]

