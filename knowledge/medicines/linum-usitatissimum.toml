id = "linum-usitatissimum"
name = "Linum usitatissimum"
abbreviation = "Linu-u."
aliases = ["Common Flax"]

symptoms = [
  { section = "General", text = "The application of Linseed poultice has produced in sensitive subjects severe respiratory disturbances, as asthma, hives, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Its action in such cases is marked by intense irritation.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "It has been found to contain small quantity of Hydrocyanic acid, which may account for this intensity.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The decoction is of service in inflammation of the urinary passages, cystitis, strangury, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Also in diseases of the intestinal tract.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It has a place in the treatment of asthma, hay-fever and urticaria.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Trismus and paralysis of the tongue.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Linum Catharticum -Purging flax --(Similar respiratory symptoms, but also colic and diarrhœa).", source = "boericke-mm-9" },
  { section = "Dose", text = "Lower potencies.", source = "boericke-mm-9" },
]

