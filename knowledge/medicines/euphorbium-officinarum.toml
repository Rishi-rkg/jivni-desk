notes = [
  { section = "Relationship", text = "Compare: Euphorbia amygdaloides -Wood Spurge (in pain in antrum, illusion of smell, odor of mice. Sense of taste blunted. Diarrhœa; stools difficult, with painful anal spasm). Euphorbia corollata -Large Flowering Spurge--(a diaphoretic expectorant and cathartic of the old school in gastro-enteric disturbance, with deathly nausea. Vomiting of food, water, and mucus and copious evacuations. Attacks recur after short intermissions. Feeling of clawing in stomach; cold sweat) (Verat alb). Euphorbia marginata -Snow on the mountain--(Honey from the flowers is poisonous, detected by the hot, acrid taste. The milky juice produces skin symptoms like Rhus). Euphorbia pilulifera -Pillbearing Spurge--(Humid asthma, cardiac dyspnœa, hay-fever, and bronchitis. Urethritis, with intense pain on urinating, and much urging. Acrid leucorrhœa; worse least movement. Hæmorrhages from sunstroke and traumatism). Compare, also: Psoralea -A Columbian plant--(Pain of cancer, ulcers. Leucorrhœa fetid. Pruritus. Uterine tumors). Croton; Jatropha; Colchic. Antidotes: Camph; Opium.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to sixth potency.", source = "boericke-mm-9" },
]

