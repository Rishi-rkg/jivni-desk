# own layer, which is merged over this file and never rewrites it.

id = "verbascum-thapsus"
name = "Verbascum thapsus"
abbreviation = "Verb."
aliases = ["Mullein", "Verbascum"]

symptoms = [
  { section = "General", text = "Has a pronounced action on the inferior maxillary branch of the fifth pair of the cranial nerves; on the ear; and respiratory tract and bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Catarrhs, and colds, with periodical prosopalgia.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Quiets nervous, and bronchial, and urinary irritation, and cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Neuralgia affecting zygoma, temporo maxillary joint, and ear (Menyanth), particularly of left side, with lachrymation, coryza, and sensation as if parts were crushed with tongs.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Talking, sneezing, and change of temperature aggravate the pains; also, pressing teeth together.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Pains seem to come in flashes, excited by least movement, occurring periodically at same hour in morning and afternoon each day.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Otalgia, with a sense of obstruction.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Deafness.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Dry, scaly condition of meatus (use locally).", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain extends deep down, causing contraction of sphincter ani.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Many movements a day, with twisting about navel.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Hæmorrhoids, with obstructed, hardened stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Inflamed and painful piles.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarse; voice deep, harsh; sounds like a trumpet; \"basso profundo\".", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough; worse at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthma.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Soreness in pharynx, cough during sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Constant dribbling.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Enuresis.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Burning urination.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Increase with pressure in bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cramp-like pain in soles, right foot, and knee.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Lower extremities feel heavy.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Thumb feels numb.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Neuralgic pain in left ankle.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Stiffness and soreness of joints of lower extremities.", grade = 2, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "change of temperature, talking, sneezing, biting hard (inferior dental nerve)", source = "boericke-mm-9" },
  { kind = "worse", text = "9 am to 4 pm", source = "boericke-mm-9" },
]

relationships = [
  { kind = "similar", medicine = "rhus-aromatica", name = "Rhus aromatica", as_written = "Rhus arom", source = "boericke-mm-9" },
  { kind = "similar", medicine = "causticum", name = "Causticum", as_written = "Caust", source = "boericke-mm-9" },
  { kind = "similar", medicine = "platinum-metallicum", name = "Platinum metallicum", as_written = "Platin", source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Rhus arom; Caust; Platin; Sphingurus (pain in zygoma).", source = "boericke-mm-9" },
  { section = "Dose", text = "Mullein oil, (locally, for earache and dry, scaly condition of meatus. Also for teasing cough at night or lying down. Internally, tincture and lower potencies). Enuresis, five-drop doses night and morning.", source = "boericke-mm-9" },
]

