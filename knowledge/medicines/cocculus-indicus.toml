id = "cocculus-indicus"
name = "Cocculus indicus"
abbreviation = "Cocc."
aliases = ["Indian Cockle", "Cocculus"]

symptoms = [
  { section = "General", text = "Within the sphere of action of Cocculus are many spasmodic and paretic affections, notably those affecting one-half of the body.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Affects the cerebrum, will not cure convulsive seizures proceeding from the spinal cord (A.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hinsdale) Painful contracture of limbs and trunk; tetanus.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Many of the evil effects of night-watching are relieved by it.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "It shows a special, attraction for light-haired females, especially during pregnancy, causing much nausea and backache.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Unmarried and childless women, sensitive and romantic girls, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "All its symptoms are worse riding in a carriage or on shipboard; hence its use in seasickness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sensation of hollowness, or emptiness, as if parts had gone to sleep.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Feels too weak to talk loud.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Capricious.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Heavy and stupid.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Time passes too quickly; absorbed in reveries.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Inclination to sing irresistible.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Slow of comprehension.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Mind benumbed.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Profound sadness.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Cannot bear contradiction.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Speaks hastily.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Very anxious about the health of others.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo, nausea, especially when riding or sitting up.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Sense of emptiness in head.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache in occiput and nape; worse, lying on back of head.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Sick headache from carriage riding, cannot lie on back part of head.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pupils contracted.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Opening and shutting sensation, especially in occiput.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Trembling of head.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in eyes as if torn out of head.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Paralysis of facial nerve.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Cramp-like pain in masseter muscle; worse, opening mouth.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Prosopalgia in afternoon, with wide radiations of pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea from riding in cars, boat, etc, or looking at boat in motion; worse on becoming cold or taking cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea, with faintness and vomiting.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Aversion to food, drink, tobacco.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Metallic taste.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Paralysis of muscles preventing deglutition.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Dryness of œsophagus.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Seasickness (Resorcin. 1x).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Cramp, in stomach during and after meal.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Hiccough and spasmodic yawning.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Loss of appetite.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Desire for cold drinks, especially beer.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Sensation in stomach as if one had been a long time without food until hunger was gone.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Smell of food disgusts (Colch).", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Distended, with wind, and feeling as if full of sharp stones when moving; better, lying on one side or the other.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain in abdominal ring, as if something were forced through.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Abdominal muscles weak; it seems as if a hernia would take place.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Dysmenorrhœa, with profuse dark menses.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Too early menses, clotted, with spasmodic colic.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Painful pressing in uterine region, followed by hæmorrhoids.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Purulent, gushing leucorrhœa between menses; very weakening, can scarcely speak.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "So weak during menstruation, scarcely able to stand.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sensation of emptiness and cramp in chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dyspnœa as from constriction of trachea, as if irritated by smoke.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Choking constriction in upper part of œsophagus, oppressing breathing and inducing cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Cracking of cervical vertebræ when moving head.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Paralytic pain in small of the back.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Pain in shoulder and arms as if bruised.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Pressure in scapula and nape.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Stiffness on moving shoulders.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Lameness; worse by bending.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Trembling and pain in limbs.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Arms go to sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "One-sided paralysis; worse after sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Hands are alternately hot and cold; numbness and cold sweat now of one, now of the other hand.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Numb and unsteady.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Knees crack on motion.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Lower limbs very weak.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Inflammatory swelling of knee.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Intensely painful, paralytic drawing.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Limbs straightened out, painful when flexed.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Spasmodic yawning.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Coma vigil.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Constant drowsiness.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "After loss of sleep, night-watching, nursing.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill, with flatulent colic, nausea, vertigo, coldness of lower extremities, and heat of head.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Sweat general.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Nervous form of low fever.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chilliness, with perspiration, and heat of skin.", grade = 2, source = "boericke-mm-9" },
]

