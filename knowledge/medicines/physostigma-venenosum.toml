notes = [
  { section = "Relationship", text = "Compare: Eserine -the alkaloid of Physostigma--(slows action of heart and increases arterial tension; in ciliary spasm and spasmodic astigmatism due to irregular action of ciliary muscles; blepharo-spasms; pupils contracted. Twitching of lids, soreness of eyeballs, blurring of vision after using eyes, pains around eyes and head). Used locally to contract the pupil. Eserine contracts the pupils dilated by Atropin, but not those dilated by Gelsemium. Internally 6x. Eserin Salicylate (post-operative intestinal paralysis; meteorism. Hypodermically 1/60-1/40 gr). Compare also: Muscarin; Conium; Curare; Gels; Thebainum (tetanus); Piperazinum --(Uric acid conditions. Pruritus. Gout and urinary calculi. Constant backache. Skin dry, urine scanty. Rheumatic urthritis. Give one grain daily in carbonated water. First and second decimal trituration three times a day). Antidote: Atropia. In full medicinal doses will relieve most of the effects of physostigmine.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third potency. The neutral sulphate of Eserine is instilled into the eye, from one-half to four grains to one ounce distilled water, to induce contraction of pupil, in mydriasis, injuries to the eye, iritis, corneal ulcers, etc.", source = "boericke-mm-9" },
]

