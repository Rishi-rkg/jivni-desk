symptoms = [
  { section = "General", text = "A mucous membrane medicine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bearing-down sensations in pelvic organs and bronchial symptoms are most marked.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Substernal pain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Diabetes.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo on stooping; throbbing after eating, pressure in temples and forehead.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry cough; worse at night and lying down; larynx painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Chronic bronchitis; cough, with much thick expectoration, with languor and weak digestion.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Stitches behind sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Teasing cough with much and free expectoration.", grade = 1, source = "boericke-mm-9" },
