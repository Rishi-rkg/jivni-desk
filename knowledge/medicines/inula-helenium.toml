  { section = "Female", text = "Menses too early and painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Labor-like pains; urging to stool; dragging in genitals, with violent backache.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Itching of legs during menses, chattering of teeth from cold during menstruation.", grade = 1, source = "boericke-mm-9" },
