  { section = "Female", text = "Chronic metritis.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Pressing toward rectum as of something extruding.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Frequent urging to urinate; passes only in drops.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Violet odor (Tereb).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in right shoulder and wrist; tearing in left palm, unable to double fingers; pain in lower limbs, feet and ankles.", grade = 1, source = "boericke-mm-9" },
