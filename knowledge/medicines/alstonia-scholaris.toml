  { section = "General", text = "A tonic after exhausting fevers.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Violent purging and cramp in bowels.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Heat and irritation in lower bowels.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Camp diarrhœa, bloody stool, dysentery; diarrhœa from bad water and malaria.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Painless watery stools (Phosph ac). Diarrhœa immediately after eating.", grade = 2, source = "boericke-mm-9" },
]

