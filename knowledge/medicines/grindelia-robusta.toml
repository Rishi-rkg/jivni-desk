symptoms = [
  { section = "General", text = "Both Grindelia robusta and Grindelia squarrosa have been used for the symptoms here recorded.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "There is practically no difference in their action, although the G.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Squarrosa is credited with more splenic symptoms, dull pains and fullness in left hypochondrium; chronic malaria; gastric pains associated with splenic congestion.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Induces paralysis, beginning in extremities Its action is shown on the heart first quickening, then retarding it.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts on the cardio-pulmonary distribution of the pneumo-gastric in dry catarrh (Tart Emetic in muco-purulent).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Produces a paresis of the pneumo-gastric, interfering with respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Smothering after falling asleep.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Asthmatic conditions, chronic bronchitis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bronchorrhœa with tough mucus, difficult to detach.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Raises the blood pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nausea and retching of gastric ulcer.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sugar in urine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "An effective antidote to Rhus-poisoning, locally and internally; also for burns, blisters, vaginal catarrh and herpes zoster.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hyperchlorhydria when attended with asthmatic and other neurotic symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hyperæmia of gastric mucous membrane with difficult respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feels full, as from quinine.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain in eyeballs, running back to brain; worse, moving eyes.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Pupils dilated.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Purulent ophthalmia and iritis.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "An efficacious remedy for wheezing and oppression in bronchitic patients.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "The sibilant rales are disseminated with foamy mucus, very difficult to detach.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Acts on the pulmonary circulation.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Asthma, with profuse tenacious expectoration, which relieves.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Stops breathing when falling asleep; wakes with a star, and gasps for breath.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Must sit up to breathe.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cannot breathe when lying down.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pertussis, with profuse mucous secretion (Coccus).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Bronchorrhœa, with tough, whitish, mucous expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sibilant rales.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Weak heart and respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cannot breathe lying down.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cheyne-Stokes respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Spleen", text = "Cutting pain in region of spleen, extending to hips.", grade = 1, source = "boericke-mm-9" },
  { section = "Spleen", text = "Spleen enlarged (Ceanoth; Carduus).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Rash, like roseola, with severe burning and itching.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Vesicular and papular eruptions.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Herpes zoster.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching and burning.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Poison oak (locally as a wash).", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Ulcers, with swollen, purplish skin.", grade = 1, source = "boericke-mm-9" },
