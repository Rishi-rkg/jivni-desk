  { section = "Relationship", text = "Acetic acid, vinegar, and wine are incompatible. Antidote: Cham; Coffea. Compare: Calc; Bryon; Sanicula; Sulph ac.", source = "boericke-mm-9" },
  { section = "Dose", text = "First to third trituration. In skin diseases continue its use for several weeks. Locally, in pruritus pudendi. A piece of borax, the size of a pea, dissolved in the mouth, acts magically in restoring the voice, in cases of sudden hoarseness brought on by cold, and frequently for an hour or so, it renders the voice silvery and clear.", source = "boericke-mm-9" },
