  { section = "General", text = "Sensation of a tight girdle around chest, as of a knife piercing the heart.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain in neck, back, and extremities.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Compare: Arnica; Lachesis.", grade = 2, source = "boericke-mm-9" },
]

