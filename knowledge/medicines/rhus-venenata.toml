id = "rhus-venenata"
name = "Rhus venenata"
abbreviation = "Rhus-v."
aliases = ["Poison-elder"]

symptoms = [
  { section = "General", text = "The skin symptoms of this species of Rhus are most severe.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Great melancholy; no desire to live, gloomy.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Heavy, frontal headache; worse, walking or stooping.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Eyes nearly closed with great swelling.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vesicular inflammation of ears.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Nose red and shiny.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Face swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Tongue", text = "Red at tip.", grade = 1, source = "boericke-mm-9" },
  { section = "Tongue", text = "Fissured in middle.", grade = 1, source = "boericke-mm-9" },
  { section = "Tongue", text = "Vesicles on under side.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Profuse, watery, white stools in morning, 4 am, with colicky pains; expelled with force.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain in hypogastrium before every stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Paralytic drawing in right arm, especially wrist, and extending to fingers.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching; relieved by hot water.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Vesicles.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Erysipelas; skin dark red.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Erythema nodosum, with nightly itching and pains in long bones.", grade = 1, source = "boericke-mm-9" },
]

relationships = [
