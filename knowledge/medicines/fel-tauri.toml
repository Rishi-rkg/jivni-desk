  { section = "General", text = "Biliary calculi.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Eructations, gurgling in stomach and epigastric region.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Violent peristaltic movements.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tendency to sleep after eating.", grade = 2, source = "boericke-mm-9" },
