symptoms = [
  { section = "General", text = "Congestions and hæmorrhages seem to be the special manifestations of this drug.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Violent congestive and nervous headaches.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Infantile spasms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Epilepsy from blow on head.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain and debility point to it.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Coldness but also increase of temperature; tenderness, and pain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Muscular system depressed.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dreams and emissions.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Unable to fix mind.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Memory treacherous.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Stupor.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Wants to run away and hide.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Delusions; thinks every one is looking at her, fears to talk loud, and wants to run away, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache with retching, vomiting, sense of pressure over orbits, pallor, cold hands and feet, black spots before eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Heavy, oppressed; frontal, throbbing, undulating sensation in brain.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Sick headache; relieved by epistaxis or menstrual flow.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Fullness all over head.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Eyes heavy; blurred sight; wants to close them tightly for relief.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Neuralgia around and over right side of head and neck.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Scalp sore and tender to touch.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Stopped up, dry, must breathe through mouth; dry, hard clinkers in nose; profuse epistaxis.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Intensely red and flushed, with throbbing carotids (Bell).", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "Difficult, painful, constipated.", grade = 1, source = "boericke-mm-9" },
  { section = "Stool", text = "Anus feels constricted, full, throbs.", grade = 2, source = "boericke-mm-9" },
  { section = "Stool", text = "No desire until there is a large accumulation (Bry; Alum).", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Menses scanty, intermit, with nausea and bearing down sticking pain in external parts.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Dysmenorrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Ovarian neuralgia.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Feels as if smothering, especially from rapid walking.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hæmoptysis.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Weight on chest.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Tickling in throat with cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Pain in knee; wants to stretch leg, but does not relieve.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Joints sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Skin and extremities cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Numbness and aching in knee-joints.", grade = 1, source = "boericke-mm-9" },
]

