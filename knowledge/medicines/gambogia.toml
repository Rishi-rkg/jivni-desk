id = "gambogia"
name = "Gambogia"
abbreviation = "Gamb."
aliases = ["Gummi Gutti", "Gambogia - garcinia morella"]

symptoms = [
  { section = "General", text = "The use of this drug in Homeopathy has been confined to its action on the alimentary tract.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It produces a diarrhœa very similar to Croton. >From its pathogenesis, it is very evident that it has very intense and definite action especially on the gastro-enteric tract.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Heavy, with inertia, and drowsiness.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Itching and burning in eyes; lids stick together, with sneezing.", grade = 2, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Feeling of coldness at edge of teeth.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Great irritability of the stomach; burning, smarting, and dryness of the tongue and throat.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Pain in the stomach after food.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Tenderness in epigastrium.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Pain and distention of abdomen from flatulence, after stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Rumbling and rolling.", grade = 2, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Dysentery, with retained scybala, with pain in sacral region.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Diarrhœa, with sudden and forcible ejection of bilious stools.", grade = 2, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Tenesmus after, with burning at anus.", grade = 2, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Ileo-cæcal region sensitive to pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Profuse, watery diarrhœa in hot weather, particularly old people.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-enteric Symptoms", text = "Pain in coccyx.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "towards evening and at night", source = "boericke-mm-9" },
]

relationships = [
