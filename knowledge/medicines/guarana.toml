symptoms = [
  { section = "General", text = "Contains a large percentage of Caffeine, which may explain its use as a remedy for certain forms os sick headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Intellectual excitement.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sick headache in persons who have used tea and coffee in excess.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Throbbing headache after use of liquor.", grade = 1, source = "boericke-mm-9" },
  { section = "Bowels", text = "Stools profuse, bloody, bright green; flakes inter-mixed; odorless.", grade = 1, source = "boericke-mm-9" },
  { section = "Bowels", text = "Cholera infantum.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Chloasmata on temples and arms.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Urticaria (Dulc; Apis; Chloral).", grade = 2, source = "boericke-mm-9" },
  { section = "Sleep", text = "Uncontrollable sleepiness and heaviness of head, with flushed face after eating.", grade = 1, source = "boericke-mm-9" },
]

notes = [
