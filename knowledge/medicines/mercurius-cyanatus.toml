id = "mercurius-cyanatus"
name = "Mercurius cyanatus"
abbreviation = "Merc-cy."
aliases = ["Cyanide of Mercury"]

symptoms = [
  { section = "General", text = "Acute infections, pneumonia, nephritis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Its action is similar to that of the toxines of infections diseases.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Great and rapid prostration, tendency toward hæmorrhages, from the different orifices, of dark fluid blood, cyanosis, rapid respiration and heart action, albuminuria and twitching and jerking of muscles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Typhoid pneumonia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Livid states from great struggling, where suffocation is imminent and paralysis of lung threatening; great sweat.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Affects most prominently the buccal cavity.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "This, together with marked prostration, gives it a place in the treatment of diphtheria, where it has achieved unquestioned great results.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Malignant types, with prostration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Coldness and nausea.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Syphilitic ulcers when perforation threatens.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Great excitement, fits of passion; fury; talkativeness.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Atrocious headache.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Eyes sunken; face pale.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Covered with ulcerations.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue pale.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Free salivation.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Fetor of breath.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Pain and swelling of salivary glands.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Astringent taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Ulcerations of mouth have a gray membrane.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Feels raw and sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Mucous membranes broken down, ulcerated.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Looks raw in spots, especially in public speakers.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Hoarseness, and talking is painful.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Necrotic destruction of soft parts of palate and fauces.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Intense redness of fauces.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Swallowing very difficult.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Dark blood from nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Diphtheria of the larynx and nose (Kali bich).", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea, vomiting, bilious, bloody; hiccough; abdomen painful, tender to pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Intolerable pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Redness around anus.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Frequent hæmorrhage; stools with tenesmus.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Discharge of fetid liquid with gangrenous odor.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Black stools.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Amber color, painful, albuminous, scanty.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Nephritis with great debility and chilliness.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Suppression of urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Moisture, with icy coldness.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Sixth to thirtieth potency. Aggravation is apt to occur from potencies below the sixth.", source = "boericke-mm-9" },
]

