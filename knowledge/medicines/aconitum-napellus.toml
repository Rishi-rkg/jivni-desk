notes = [
  { section = "Relationship", text = "Acids, wine and coffee, lemonade, and acid fruits modify its action. Not indicated in malarial and low fevers or hectic and pyæmic conditions, and in inflammations when they localize themselves. Sulphur often follows it. Compare Cham and Coffea in intense pain and sleeplessness. Agrostis acts like Acon in fever and inflammations, also Spiranthes. Complementary: Coffea; Sulph. Sulphur may be considered a chronic Aconite. Often completes a cure begun with Aconite. Compare; Bellad; Cham; Coffea; Ferr, phos. Aconitine.-- (Heavy feeling as of lead; pains in supraorbital nerve; ice-cold sensations creep up; hydrophobia symptoms. Tinnitus aurium 3x). Tingling sensation. Aconitum Lycotonum.-- Great yellow wolfsbane.--(Swelling of glands; Hodgkin's disease. Diarrhœa after eating pork. Itching of nose, eyes, anus and vulva. Skin of nose cracked; taste of blood). Aconitum Cammarum.-- (Headache with vertigo and tinnitus. Cataleptic symptoms. Formication of tongue, lips and face). Aconitum ferox.-- Indian Aconite.--Rather more violent in its actions than A. napellus. It is more diuretic and less antipyretic. It has proved valuable in cardiac dyspnœa, neuralgia, and acute gout. Dyspnœa. Must sit up. Rapid respiration. Anxiety, with suffocation from feeling of paralysis in respiratory muscles. Cheynes-Stokes breathing. Quebracho (cardiac dyspnœa) (Achyranthes.--A Mexican drug--very similar to Aconite in fevers, but of larger range, being also adapted to typhoidal states and intermittents. Muscular rheumatism. A great diaphoretic. Use 6x). Eranthis hymnalis --(Winter Aconite--acts on solar plexus and works upwards causing dyspnœa. Pain in occiput and neck).", source = "boericke-mm-9" },
  { section = "Dose", text = "Sixth potency for sensory affections; first to third for congestive conditions. Must be repeated frequently in acute diseases. Acon is a rapid worker. In Neuralgias tincture of the root often preferable, one drop doses (poisonous), or again, the 30th according to susceptibility of patient.", source = "boericke-mm-9" },
]

