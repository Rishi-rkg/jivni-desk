symptoms = [
  { section = "General", text = "A state of fear, anxiety; anguish of mind and body.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Physical and mental restlessness, fright, is the most characteristic manifestation of Aconite.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Acute, sudden, and violent invasion, with fever, call for it.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Does not want to be touched.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sudden and great sinking of strength.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Complaints and tension caused by exposure to dry, cold weather, draught of cold air, checked perspiration, also complaints from very hot weather, especially gastro-intestinal disturbances, etc.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "First remedy in inflammations, inflammatory fevers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Serous membranes and muscular tissues affected markedly.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Burning in internal parts; tingling, coldness and numbness.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Influenza.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tension of arteries; emotional and physical mental tension explain many symptoms.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "When prescribing Aconite remember Aconite causes only functional disturbance, no evidence that it can produce tissue change--its action is brief and shows no periodicity.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Its sphere is in the beginning of an acute disease and not to be continued after pathological change comes.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "In Hyperæmia, congestion not after exudation has set in.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Influenza (Influenzin) Mind.-- Great fear, anxiety, and worry accompany every ailment, however trivial.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Delirium is characterized by unhappiness worry, fear, raving, rarely unconsciousness.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Forebodings and fears.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Fears death but believes that he will soon die; predicts the day.", grade = 1, source = "boericke-mm-9" },
