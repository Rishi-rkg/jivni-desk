symptoms = [
  { section = "General", text = "Often indicated in the transition season when the air is cold, but the sun is still powerful enough to heat the blood.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Develops most of its symptoms in the abdomen and head, causing intense neuralgias.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is especially suitable for irritable persons easily angered, and ill effects therefrom.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Women with copious menstruation, and of sedentary habits.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Persons with a tendency to corpulency.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The neuralgic pains are nearly always relieved by pressure.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cramps and twitching and shortening of muscles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Constrictions and contractions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cystospasm following operations on orifices (Hyper).", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Urinous odor of perspiration (Berb; Nitr ac).", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Agonizing pain in abdomen, causing patient to bend double, is most characteristic.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Sensations; cutting, twisting, grinding, contracting and bruised; as if clamped with iron bands.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Extremely irritable.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Becomes angry when questioned.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Mortification caused by offense.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Anger, with indignation (Cham; Bry; Nux).", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo when turning head to the left.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Lateral cutting headache, with nausea, vomiting.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pains (better pressure and heat), with soreness of scalp.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Burning pains, digging, rending, and tearing.", grade = 1, source = "boericke-mm-9" },
