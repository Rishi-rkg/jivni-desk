  { section = "Eyes", text = "Violent pain in eyeballs which precede the development of glaucoma.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Tearing, shooting, and swelling of face; left side great soreness.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Get relief from pressure (China).", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Neuralgia, with chilliness; teeth seem too long.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Sounds re-echo in ears.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Pain in stomach, always with pain of teeth or head.", grade = 1, source = "boericke-mm-9" },
