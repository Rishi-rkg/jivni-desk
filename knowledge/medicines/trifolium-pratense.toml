id = "trifolium-pratense"
name = "Trifolium pratense"
abbreviation = "Trif-p."
aliases = ["Red Clover"]

symptoms = [
  { section = "General", text = "Produces most marked ptyalism.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Feeling of fullness with congestion of salivary glands, followed by increased copious flow of saliva.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Feeling as if mumps were coming on.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Crusta lactea; dry, scaly crusts.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Stiff neck.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cancerous diathesis.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Confusion and headache on awaking.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Dullness in anterior brain.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Mental failure, loss of memory.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Increased flow of saliva (Merc; Syphil).", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Sore throat, with hoarseness.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Coryza like that which precedes hay-fever; thin mucus, with much irritation.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hoarse and choking; chills with cough at night.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cough on coming into the open air.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Hay-fever.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Spasmodic cough; whooping cough, paroxysms; worse at night.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Neck stiff; cramp in sterno-cleido muscles; relieved by heat and irritation.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tingling in palms.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Hands and feet cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tibial ulcers.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Trifolium repens.--White clover- (Prophylactic against mumps, feeling of congestion in salivary glands, pain and hardening, especially submaxillary; worse, lying down. Mouth filled with watery saliva, worse lying down. Taste of blood in mouth and throat. Sensation as if heart would stop, with great fear, better sitting up or moving about; worse, when alone, with cold sweat on face).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture", source = "boericke-mm-9" },
]

