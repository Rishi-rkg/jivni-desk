symptoms = [
  { section = "General", text = "According to the great Dr.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Hering, a large proportion of chronic diseases of women and children are developed by using too much sugar.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sugar is an antiseptic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Combats infection and putrefaction; has a solvent action on fibrin and stimulates secretion by the intense osmotic changes induced, thus rinsing out the wound with serum from within outward, favoring healing.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Leg ulcers.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sugar must be considered a sustainer and developer of the musculature of the heart and hence useful in failure of compensation and a variety of cardio-vascular troubles.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acts as a nutrient and tonic, in wasting disorders, anæmia, neurasthenia, etc, increasing weight and power.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Opacity of cornea.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dim sight.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acidity and anal itching.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Cold expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Myocardial degeneration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Fat, bloated, large-limbed children, who are cross, peevish, whining; capricious; want dainty things, tidbits, and refuse substantial food. Œdema of feet.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Headache every seven days", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Saccharum lactis -Sugar of milk-lactose--(diuresis; amblyopia; cold pains, as if produced by fine, icy cold needle with tingling, as if frost bitten; great physical exhaustion. Sugar of milk in large doses to develop the Bacillus acidophilus to correct putrefactive intestinal conditions and also constipation).", source = "boericke-mm-9" },
  { section = "Dose", text = "Thirtieth potency and higher. Locally in gangrene. One ounce of lump sugar morning and evening valuable adjunct in the treatment of obstinate cases of heart failure due to deficient heart muscle without valvular lesion. Epilepsy; blood with reduced sugar content irritates the nervous system with tending to convulsions. Sugar as an oxytocic has its most suitable application towards the end of labor when there is no mechanical obstruction and delay is due to uterine inertia. 25 grammes dissolved in water, several times every half hour. Compare: Saccharin (hinders both the salivary and peptic ferment actions with consequent dyspepsia. Prof. Lewin believes its action to be on the secretory cells themselves and it has caused pain (right hypogastrium), loss of appetite, diarrhœa and wasting).", source = "boericke-mm-9" },
]

