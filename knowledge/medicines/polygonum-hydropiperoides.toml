  { section = "Female", text = "Aching pains in hips and loins.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Sensation as if hips were being drawn together.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Sensation of weight and tension within pelvis.", grade = 1, source = "boericke-mm-9" },
