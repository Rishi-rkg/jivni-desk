  { section = "Urinary", text = "Feeling of the bladder being distended and neuralgic pain in the anterior crural region. (Staph.) Dribbling after micturition. (Selen.) Violent pain in glans penis.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Itching along urethra; urethritis, with prostatic trouble.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Inflammation of urethra; becomes almost cartilaginous.", grade = 1, source = "boericke-mm-9" },
]

