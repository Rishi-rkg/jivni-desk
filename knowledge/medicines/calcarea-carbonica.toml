notes = [
  { section = "Relationship", text = "Antidotes: Camph; Ipec; Nit ac; Nux. Complementary: Bell; Rhus; Lycop; Silica. Calcar is useful after Sulphur where the pupils remain dilated. When Pulsatilla failed in school girls. Incompatible: Bry; Sulphur should not be given after Calc. Compare: Aqua calcar.--Lime-water--(1/2 teaspoonful in milk); (as injection for oxyuris vermicularis), and Calc caust --slaked lime--(pain in back and heels, jaws and malar bones; also symptoms of influenza). Calc brom (removes inflammatory products from uterus; children of lax fiber, nervous and irritable, with gastric and cerebral irritation. Tendency to brain disease. Insomnia and cerebral congestion. Give 1x trituration). Sulph (differs in being worse by heat, hot feet, etc). Calcar calcinata -Calcined oyster-shell-a remedy for warts. Use 3d trituration. Calcarea ovorum. Ova tosta -Toasted egg-shells--(backache and leucorrhœa. Feeling as if back were broken in two; tired feeling. Also effective in controlling suffering from cancer). Calcar lactic (anæmias, hæmophilia, urticaria, where the coagulability of the blood is diminished; nervous headache with œdema of eyelids, lips or hands; 15 grains three times a day, but low potencies often equally effective). Calcar lacto-phosph (5 grains 3 times a day in cyclic vomiting and migraine). Calc mur.--Calcium chloratum -Rademacher's Liquor--(1 part to 2 of distilled water, of which take 15 drops in half a cup of water, five times daily. Boils. Porrigo capitis. Vomiting of all food and drink, with gastric pain. Impetigo, glandular swellings, angioneurotic œdema. Pleurisy with effusion. Eczema in infants). Calcar picrata, (peri-follicular inflammation; a remedy of prime importance in recurring or chronic boils, particularly when located on parts thinly covered with muscle tissue, as on shinbones, coccyx, auditory canal, dry, scurfy accumulation and exfoliation of epithelial scales, etc, styes, phlyctenules. Use 3x trit). Compare also with Calcarea: Lycop; Silica; Pulsat; Chamom.", source = "boericke-mm-9" },
  { section = "Dose", text = "Sixth trit. Thirtieth and higher potencies. Should not be repeated too frequently in elderly people.", source = "boericke-mm-9" },
]

