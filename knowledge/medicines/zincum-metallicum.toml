notes = [
  { section = "Relationship", text = "Compare: Agaric; Ign; Plumb; Argent; Puls; Helleb; Tuberc. Inimical: Nux; Cham. Compare in amelioration by secretions: Lach; Stan; Mosch. Compare: Zincum aceticum (effects of night-watching and erysipelas; brain feels sore; Rademacher's solution, five-drop doses three times a day in water, for those who are compelled to work, on an insufficient amount of sleep); Zinc, bromatum (dentition, chorea, hydrocephalus); Zinc oxydatum (Nausea and sour taste). Sudden vomiting in children. Vomiting of bile and diarrhœa. Flatulent abdomen. Watery stools with tenesmus. Debility after grip. Fiery red face, great drowsiness with dreamlike unrefreshing sleep. Similar to effect of night watching. Mental and physical exertion (Rademacher). Zinc. Sulph, not repeated frequently (high potency) will clear up opacities of the cornea (McFarland). Corneitis; granular lids; tongue paralyzed; cramps in arms and legs; trembling and convulsions. Hypochondriasis due to masturbation; nervous headaches; Zinc cyanatum (as a remedy for meningitis and cerebro-spinal meningitis, paralysis agitans, chorea, and hysteria, it has received some attention); Zinc ars (chorea, anæmia, profound exhaustion on slight exertion. Depression and marked involvement of lower extremities); Zinc carb (post-gonorrhœal throat affections, tonsils swollen, bluish superficial spots); Zinc phos (herpes zoster 1x); Zinc muriat (disposition to pick the bedclothes; sense of smell and taste perverted; bluish-green tint of skin; cold and sweaty); Zinc phos (neuralgia of head and face; lightning-like pains in locomotor ataxia, brain-fag, nervousness, and vertigo; sexual excitement and sleeplessness); Ammon valerian (violent neuralgia, with great nervous agitation); Zinc picricum (facial paralysis; brain-fag, headache in Bright's disease; seminal emissions; loss of memory and energy). Oxide of zinc is used locally as an astringent and stimulant application to unhealthy ulcers, fissures, intertrigo, burns, etc.", source = "boericke-mm-9" },
  { section = "Dose", text = "Second to sixth potency.", source = "boericke-mm-9" },
]

