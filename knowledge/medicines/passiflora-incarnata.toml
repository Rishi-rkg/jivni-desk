id = "passiflora-incarnata"
name = "Passiflora incarnata"
abbreviation = "Passi."
aliases = ["Passion-flower"]

symptoms = [
  { section = "General", text = "An efficient anti-spasmodic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Whooping-cough.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Morphine habit.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Delirium tremens.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Convulsions in children; neuralgia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Has a quieting effect on the nervous system.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Insomnia, produces normal sleep, no disturbance of cerebral functions, neuroses of children, worm-fever, teething, spasms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tetanus.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Hysteria; puerperal convulsions.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Painful diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Acute mania.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Atonic condition generally present.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Asthma, 10-30 gtt every ten minutes for a few doses.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Locally, in erysipelas.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Violent ache as if top of head would come off-eyes felt as if pushed out.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Leaden, dead feeling after or between meals; flatulence and sour eructations.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Restless and wakeful, resulting from exhaustion.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Especially in the feeble, infants and the aged.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Insomnia of infants and the aged, and the mentally worried, and overworked, with tendency to convulsions.", grade = 1, source = "boericke-mm-9" },
  { section = "Sleep", text = "Nocturnal cough.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "Large doses of mother tincture are required-thirty to sixty drops, repeated several times.", source = "boericke-mm-9" },
]

