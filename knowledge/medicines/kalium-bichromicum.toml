symptoms = [
  { section = "General", text = "The special affinities of this drug are the mucous membrane of stomach, bowels, and air-passages; bones and fibrous tissues.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Kidneys, heart, and liver are also affected.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Incipient parenchrymatous; nephritis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Nephritis with gastric disturbances.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cirrhosis of liver.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Anæmia and absence of fever are characteristic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "General weakness bordering on paralysis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is especially indicated for fleshy, fat, light complexioned persons subject to catarrhs or with syphilitic or scrofulous history.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Symptoms are worse in the morning; pains migrate quickly, rheumatic and gastric symptoms alternate.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "More adapted to subacute rather than the violent acute stage.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Mucous membranes everywhere are affected.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Catarrh of pharynx, larynx, bronchi and nose, and a tough, stringy, viscid secretion is produced, which condition is a very strong guiding symptom for this drug.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Perforation of the septum.", grade = 2, source = "boericke-mm-9" },
