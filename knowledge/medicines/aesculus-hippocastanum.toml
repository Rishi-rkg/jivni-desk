id = "aesculus-hippocastanum"
name = "Aesculus hippocastanum"
abbreviation = "Aesc."
aliases = ["Horse Chestnut"]

symptoms = [
  { section = "General", text = "The action of this drug is most marked on the lower bowel, producing engorged hæmorrhoidal veins, with characteristic backache, with absence of actual constipation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Much pain but little bleeding.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Venous stasis general, varicose veins of purple color; everything is slowed down, digestion, heart, bowels, etc.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Torpor and congestion of the liver and portal system, with constipation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The back aches and gives out and unfits the patient for business.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Flying pains all over.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Fullness in various parts, dry, swollen mucous membranes.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Throat with hæmorrhoidal conditions.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Depressed and irritable.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Head dull, confused, aching as from a cold.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pressure in forehead, with nausea, followed by stitches in right hypochondrium.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Pain from occiput to frontal region, with bruised sensation of the scalp; worse in the morning.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Neuralgic stitches from right to left through forehead, followed by flying pains in epigastrium.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo when sitting and walking.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Heavy and hot, with lachrymation, with enlarged blood vessels.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Eyeballs sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Dry; inspired air feels cold, nasal passages sensitive to it.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Coryza, sneezing.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Pressure at root of nose.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Membrane over turbinate bones distended and boggy, dependent upon hepatic disorders.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Scalded feeling.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Metallic taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Salivation.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue thickly coated, feels as if scalded.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Hot, dry, raw, stitching pain into ears when swallowing.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Follicular pharyngitis connected with hepatic congestion.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Veins in pharynx distended and tortuous.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Throat sensitive to inspired air; feels excoriated and constricted, burns like fire on swallowing, in afternoon.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Early stages of atrophic pharyngitis in dried-up, bilious subjects.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Hawking of ropy mucus of sweetish taste.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Weight of a stone, with gnawing, aching pain; most manifest about three hours after meals.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tenderness and fullness in region of liver.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Dull aching in liver and epigastrium.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Pain at umbilicus.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Jaundice; throbbing in hypogastrium and pelvis.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Dry, aching.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Feels full of small sticks.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Anus raw, sore.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Much pain after stool, with prolapse.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Hæmorrhoids, with sharp shooting pains up the back; blind and bleeding; worse during climacteric.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Large, hard, dry stools.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Mucous membrane seems swollen and obstructs the passage.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Irritation caused by ascarides and aids their expulsion.", grade = 1, source = "boericke-mm-9" },
  { section = "Rectum", text = "Burning in anus with chills up and down back. Urinary.-- Frequent, scant, dark, muddy, hot urine.", grade = 2, source = "boericke-mm-9" },
  { section = "Rectum", text = "Pain in kidneys, especially left and ureter.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Discharge of prostatic fluid at stool.", grade = 1, source = "boericke-mm-9" },
  { section = "Female", text = "Constant throbbing behind symphysis pubis.", grade = 2, source = "boericke-mm-9" },
  { section = "Female", text = "Leucorrhœa, with lameness of back across the sacro-iliac articulation; dark yellow, sticky corroding; worse after menses.", grade = 2, source = "boericke-mm-9" },
  { section = "Chest", text = "Feels constricted.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Heart's action full and heavy, can feel pulsations all over.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Laryngitis; coughs depending on hepatic disorders; hot feeling in chest; pain around heart in hæmorrhoidal subjects.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Aching and soreness in limbs, in left acromion process with shooting down arms; finger tips numb.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Lameness in neck; aching between shoulder blades; region of spine feels weak; back and legs give out.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "Backache affecting sacrum and hips; worse walking or stooping.", grade = 2, source = "boericke-mm-9" },
  { section = "Back", text = "When walking feet turn under.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Soles feel sore, tired, and swell.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Hands and feet swell, and become red after washing, feel full.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chill at 4 pm.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chilliness up and down back.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Fever 7 to 12 pm.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Evening fever, skin hot and dry.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Sweat profuse and hot with the fever.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "morning on awaking, and from any motion, walking", source = "boericke-mm-9" },
  { kind = "worse", text = "moving bowels", source = "boericke-mm-9" },
  { kind = "worse", text = "after eating, afternoon, standing", source = "boericke-mm-9" },
