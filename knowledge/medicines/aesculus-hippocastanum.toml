notes = [
  { section = "Relationship", text = "Aesculus glabra -Ohio-Buckeye Proctitis. Very painful, dark purple, external hæmorrhoids, with constipation and vertigo and portal congestion. Speech thick, tickling in throat, impaired vision, paresis. Phytolacca (throat dry, more often in acute cases). Negundium Americanum --Box-elder--(Engorgements of rectum and piles with great pain, ten-drop doses of tincture every two hours). Compare also: Aloe, Collinson. Nux. Sulphur.", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, to third potency.", source = "boericke-mm-9" },
]

