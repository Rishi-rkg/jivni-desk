id = "drosera-rotundifolia"
name = "Drosera rotundifolia"
abbreviation = "Dros."
aliases = ["Sundew", "Drosera"]

symptoms = [
  { section = "General", text = "Affects markedly the respiratory organs and was pointed out by Hahnemann as the principal remedy for whooping-cough.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Drosera can break down resistance to tubercle and should therefore be capable of raising it (Dr.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tyler).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Laryngeal phthisis is benefited by it.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Phthisis pulmonum; vomiting of food from coughing with gastric irritation and profuse expectoration.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pains about hip-joint.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tubercular glands.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo when walking in open air, with inclination to fall to the left side.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Coldness of left half of face, with stinging pains and dry heat of right half.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Aversion to and bad effects from acids.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Spasmodic, dry irritative cough, like whooping-cough, the paroxysms following each other very rapidly; can scarcely breathe; chokes.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Cough very deep and hoarse; worse, after midnight; yellow expectoration, with bleeding from nose and mouth; retching.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Deep, hoarse voice; hoarseness; laryngitis.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Rough, scraping sensation deep in the fauces and soft palate.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Sensation as if crumbs were in the throat, of feather in larynx.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Laryngeal phthisis, with rapid emaciation.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Harassing and titillating cough in children-not at all through the day, but commences as soon as the head touches the pillow at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Clergyman's sore throat, with rough, scraping, dry sensation deep in the fauces; voice hoarse, deep, toneless, cracked, requires exertion to speak.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory Organs", text = "Asthma when talking, with contraction of the throat at every word uttered.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Paralytic pains in the coxo-femoral joint and thighs.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Stiffness in joints of feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "All limbs feel lame.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Bed feels too hard.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Internal chilliness; shivering, with hot face, cold hands, no thirst.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Is always too cold, even in bed.", grade = 1, source = "boericke-mm-9" },
]

modalities = [
  { kind = "worse", text = "after midnight, lying down, on getting warm in bed, drinking, singing, laughing", source = "boericke-mm-9" },
]

relationships = [
  { kind = "antidote", medicine = "camphora", name = "Camphora", as_written = "Camph", source = "boericke-mm-9" },
  { kind = "similar", medicine = "chelidonium-majus", name = "Chelidonium majus", as_written = "Chelid", source = "boericke-mm-9" },
  { kind = "similar", medicine = "cuprum-metallicum", name = "Cuprum metallicum", as_written = "Cupr", source = "boericke-mm-9" },
  { kind = "similar", medicine = "castanea-vesca", name = "Castanea vesca", as_written = "Castanea", source = "boericke-mm-9" },
  { kind = "similar", medicine = "menyanthes-trifoliata", name = "Menyanthes trifoliata", as_written = "Menyanth", source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Antidote: Camph. Compare: Fluoroform (2 per cent watery solution, 2-4 drops, after paroxysms, considered specific for whooping-cough). Ouabain from leaves of Carissa schimperi-arrow poison (Respiratory spasm-Whooping cough is cut short in first stage and reduced in frequency of attacks and hastens convalescence). Chelid; Corall; Cupr; Castanea; Argent; Menyanth.", source = "boericke-mm-9" },
  { section = "Dose", text = "First to twelfth attenuation.", source = "boericke-mm-9" },
]

