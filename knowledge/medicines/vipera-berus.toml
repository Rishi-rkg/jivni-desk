id = "vipera-berus"
name = "Vipera berus"
abbreviation = "Vip."
aliases = ["The German Viper", "Vipera"]

symptoms = [
  { section = "General", text = "Viper poisoning causes a temporary increase in reflexes, paresis supervenes, a paraplegia of the lower extremities extending upwards.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Resembles acute ascending paralysis of Landry (Wells).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Has special action on kidneys and induces hæmaturia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cardiac dropsy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Indicated in inflammation of veins with great swelling; bursting sensation.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Enlargement of liver.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Ailments of menopause. Œdema of glottis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Poly-neuritis, polio-myelitis.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Excessively swollen.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Lips and tongue swollen, livid, protruding.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Tongue dry, brown, black.", grade = 1, source = "boericke-mm-9" },
  { section = "Face", text = "Speech difficult.", grade = 1, source = "boericke-mm-9" },
  { section = "Liver", text = "Violent pain in enlarged liver, with jaundice and fever; extends to shoulder and hip.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Patient is obliged to keep the extremities elevated.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "When they are allowed to hang down, it seems as if they would burst, and the pain is unbearable (Diad).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Varicose veins and acute phlebitis.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Veins swollen, sensitive; bursting pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Severe cramps in lower extremities.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Livid.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Skin peels in large plates.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Lymphangioma, boils, carbuncles, with bursting sensation, relieved by elevating parts.", grade = 2, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Pelius berus -Adder (Prostration and fainting, faltering pulse, skin yellow, pain about navel. Swelling of arm, tongue, right eye; giddiness, nervousness, faintness, sickness, compression of chest, could not breathe properly or take a deep breath; aching and stiffness of limbs, joints stiff, collapsed feeling, great thirst). Eel serum (heart and kidney diseases. Failure of compensation and impending asystole).", source = "boericke-mm-9" },
  { section = "Dose", text = "Twelfth potency.", source = "boericke-mm-9" },
]

