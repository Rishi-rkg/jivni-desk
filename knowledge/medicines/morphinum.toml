id = "morphinum"
name = "Morphinum"
abbreviation = "Morph."
aliases = ["An Alkaloid of Opium"]

symptoms = [
  { section = "General", text = "Morphine bears the same relation to Opium as Atropine to Belladonna-i.e, represents its nervous side.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is less stimulating, less convulsant, and more decidedly hypnotic.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Constipates less and affects contractility of the bladder more.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It is less diaphoretic and more pruritic.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Profound depression.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Irritable, fault-finding, hysterical.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Shock induced by terror.", grade = 2, source = "boericke-mm-9" },
  { section = "Mind", text = "Dream-like state.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Vertigo from the least movement of the head.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Headache with sensation of being \"wound-up\".", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Bursting pain; head drawn back.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Bluish, drooping lids.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Itching of eyes.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Delusion of vision on closing eyes.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Starting, injected; diverging strabismus.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pupils unequally contracted.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Look unsteady.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Ptosis.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Paresis of recti interni.", grade = 2, source = "boericke-mm-9" },
  { section = "Ears", text = "Left ear throbs painfully; better, heat.", grade = 1, source = "boericke-mm-9" },
  { section = "Ears", text = "Seems to hear circulation all over body.", grade = 2, source = "boericke-mm-9" },
  { section = "Face", text = "Dusky red or pallid lividity of face, lips, tongue, mouth or throat.", grade = 2, source = "boericke-mm-9" },
  { section = "Nose", text = "Sneezing in paroxysms.", grade = 1, source = "boericke-mm-9" },
  { section = "Nose", text = "Itching and tingling on end of nose.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Very dry.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Tongue dry, brown violet in middle.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Thirst.", grade = 2, source = "boericke-mm-9" },
  { section = "Mouth", text = "Loss of appetite, with aversion to meat.", grade = 2, source = "boericke-mm-9" },
  { section = "Throat", text = "Dry and constricted.", grade = 1, source = "boericke-mm-9" },
  { section = "Throat", text = "Pharynx paralyzed, swallowing almost impossible; better hot drinks, worse solids.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea incessant and deathly, faintness, constant retching.", grade = 2, source = "boericke-mm-9" },
  { section = "Stomach", text = "Vomiting of green fluid.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Nausea and vomiting on rising up.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Distended.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Acute pain in abdomen and along spinal column.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Tympanitis. Rectum.-- Diarrhœa watery, brown, or black with horrible tenesmus.", grade = 2, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Constipation; stools large, dry knotty, with tendency to bruise and fissure.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Paresis of bladder.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Strangury.", grade = 2, source = "boericke-mm-9" },
  { section = "Urinary", text = "Slow and difficult urination.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Retention of prostatic hypertrophy.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Uræmia, acute and chronic.", grade = 2, source = "boericke-mm-9" },
  { section = "Male", text = "Impotency.", grade = 1, source = "boericke-mm-9" },
  { section = "Male", text = "Pain in right spermatic cord, (Oxal ac).", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "Alternation of tachycardia and bradycardia.", grade = 2, source = "boericke-mm-9" },
  { section = "Heart", text = "Cardiac muscular tissue is intact, even if severely exhausted.", grade = 1, source = "boericke-mm-9" },
  { section = "Heart", text = "Pulse small, weak, dicrotic.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Faint and struggling for breath diaphragmatic paralysis; hiccough; dyspnœa, paroxysmal, on first falling asleep (Lach; Grindel).", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Cheyne-Stokes respiration.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Chest tight.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Pain in middle of sternum.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Dry, hard, teasing, exhausting cough, worse at night.", grade = 2, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Strangling cough, with viscid mucus sputum; thin, scanty, but sounds loose and abundant.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Pain along spine.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Weakness of loins.", grade = 1, source = "boericke-mm-9" },
  { section = "Back", text = "Aching across lumbo-sacral region; cannot walk erect (Cimicif).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Staggering gait.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Numbness.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Livid; purple spots; zoster-like herpes.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Skin lost its elasticity.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Urticaria appearing at climaxis.", grade = 1, source = "boericke-mm-9" },
  { section = "Nervous", text = "Restlessness and hyperethesia; trembling, twitching, jerking, convulsions.", grade = 1, source = "boericke-mm-9" },
  { section = "Nervous", text = "Extremely susceptible to pain.", grade = 2, source = "boericke-mm-9" },
  { section = "Nervous", text = "Pain causes twitching and jerking of limbs.", grade = 1, source = "boericke-mm-9" },
  { section = "Nervous", text = "Violent and sudden neuralgic pains and sudden fainting.", grade = 2, source = "boericke-mm-9" },
  { section = "Nervous", text = "Delirium, melancholic in character.", grade = 2, source = "boericke-mm-9" },
  { section = "Nervous", text = "Neuralgias intensely painful, left supraorbital; right intercostal, better from heat; multiple neuritis.", grade = 2, source = "boericke-mm-9" },
  { section = "Nervous", text = "Sore feeling all over.", grade = 1, source = "boericke-mm-9" },
  { section = "Nervous", text = "Bed feels too hard.", grade = 2, source = "boericke-mm-9" },
  { section = "Nervous", text = "Aggravation after sleep (Lach).", grade = 2, source = "boericke-mm-9" },
  { section = "Nervous", text = "Neuralgia after zoster (Mezer).", grade = 2, source = "boericke-mm-9" },
  { section = "Sleep", text = "Yawning, drowsy; prolonged, deep sleep, Sleepless; restless sleep, with frequent startings.", grade = 2, source = "boericke-mm-9" },
  { section = "Sleep", text = "Sleepy, but cannot sleep.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Chills.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Icy coldness.", grade = 1, source = "boericke-mm-9" },
  { section = "Fever", text = "Burning heat; profuse sweat.", grade = 1, source = "boericke-mm-9" },
]

notes = [
