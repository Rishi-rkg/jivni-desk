symptoms = [
  { section = "General", text = "Symptoms found in munition workers handling T.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "T who inhale and ingest it and also absorb some through the skin.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "They were compiled by Dr.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Conrad Wesselhoeft and published in the December, 1926 number of the Journal of the American Institute of Homeopathy.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The destructive action of T.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "T on the red blood corpuscles is responsible for the anæmia and the jaundice with their secondary symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The hemoglobin is changed so it cannot act satisfactorily as an oxygen carrier and as a result we have breathlessness, dizziness, headache, faintness, palpitation, undue fatigue, muscle cramps and cyanosis; also drowsiness, depression and insomnia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Later stages of the poisoning produce toxic jaundice and aplastic anæmia.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "The jaundice is the result of cellular destruction in contrast to obstructive jaundice.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Depression and headache (frontal).", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Aversion to company, apathetic and weeps easily.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Faintness, dizziness, mental sluggishness; delirium, convulsions, coma.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Face very dark.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Nose dry with stuffed sensation.", grade = 1, source = "boericke-mm-9" },
  { section = "Respiratory", text = "Sneezing, coryza, burning of trachea, choking weight on chest; dry, convulsive cough, raising mucous plugs.", grade = 1, source = "boericke-mm-9" },
  { section = "Gastro-Intestinal", text = "Bitter taste, much thirst, sour regurgitation; dull burning behind the ensiform; nausea, vomiting, constipation followed by diarrhœa with cramps.", grade = 1, source = "boericke-mm-9" },
  { section = "Cardio-Vascular", text = "Palpitation, tachycardia, bradycardia, intermittent pulse.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "High colored urine, burning on urination, sudden desire, incontinence and retention.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Hands stained yellow.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Dermatitis, nodular erythema, vesicles, itching and burning; puffiness.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Tendency to hæmorrhage under the skin and from the nose.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Tired pain in back of knees.", grade = 2, source = "boericke-mm-9" },
]

