id = "lathyrus-sativus"
name = "Lathyrus sativus"
abbreviation = "Lath."
aliases = ["Chick-pea", "Lathyrus"]

symptoms = [
  { section = "General", text = "Affects the lateral and anterior columns of the cord.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Does not produce pain.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Reflexes always increased.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Paralytic affections of lower extremities; spastic paralysis; lateral sclerosis; Beri-beri.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Athetosis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Infantile paralysis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "After influenza and wasting, exhaustive diseases where there is much weakness and heaviness, slow recovery of nerve power.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Sleepy, constant yawning.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Depressed; hypochondriacal.", grade = 1, source = "boericke-mm-9" },
  { section = "Mind", text = "Vertigo when standing with eyes closed.", grade = 1, source = "boericke-mm-9" },
  { section = "Mouth", text = "Burning pain in tip of tongue; with tingling and numbness of tongue and lips, as if scalded.", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tips of fingers numb.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Tremulous, tottering gait.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Excessive rigidity of legs; spastic gait.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Knees knock against each other when walking.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cramps in legs worse cold, and cold feet.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cannot extend or cross legs when sitting.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Myelitis, with marked spastic symptoms.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Rheumatic paralysis.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Gluteal muscles and lower limbs emaciated.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Legs blue; swollen, if hanging down.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Stiffness and lameness of ankles and knees, toe do not leave the floor, heels do not touch floor, Muscles of calves very tense.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Patient sits bent forward, straightens with difficulty.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Increased bladder reflex.", grade = 1, source = "boericke-mm-9" },
  { section = "Urine", text = "Frequent, must hurry, else voided involuntarily.", grade = 1, source = "boericke-mm-9" },
]

