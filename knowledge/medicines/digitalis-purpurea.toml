symptoms = [
  { section = "General", text = "Comes into play in all diseases where the heart is primarily involved, where the pulse is weak, irregular, intermittent, abnormally slow, and dropsy of external and internal parts.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Weakness and dilatation of the myocardium.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Its greatest indication is in failure of compensation and especially when auricular fibrillation has set in.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Slow pulse in recumbent posture, but irregular and dicrotic on sitting up.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Auricular flutter and fibrillation especially when subsequent to rheumatic fever.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Heart block, very slow pulse.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Other symptoms of organic heart disease, such as great weakness and sinking of strength, faintness, coldness of skin, and irregular respiration; cardiac irritability and ocular troubles after tobacco; jaundice from induration and hypertrophy of the liver, frequently call for Digitalis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Jaundice with heart disease.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Faint, as if dying.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Bluish appearance of face.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Cardiac muscular failure when asystole is present.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Stimulates the heart's muscles, increases force of systole, increases length.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Prostration from slight exertion.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Collapse.", grade = 1, source = "boericke-mm-9" },
