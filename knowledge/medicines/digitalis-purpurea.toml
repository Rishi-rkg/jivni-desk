notes = [
  { section = "Relationship", text = "Antidotes: Camph; Serpentaria. Incompatible: China. Compare: Nerium odorum (resembles in heart effects Digitalis, but also has an action like Strychnia on spinal cord. Spasms appear more in upper part of body. Palpitation; weak heart will be strengthened by it. Lock-jaw). Adonia; Cratægus (a true heat tonic); Kalmia; Spigel; Liatris; Compare also; Digitoxinum (Digitalis dissolved in Chloroform; which has yellow vision very marked, and distressing nausea, aggravated by champagne and aerated waters). Nitri spir dulc increases action of Digit. Ichthyotoxin. Eel Serum (Experiments show great analogy between the serum and the venom of vipera. Indicated whenever the systole of the heart is insufficient, decompensated valvular disease, irregular pulse due to fibrillation of the auricle. Assytole, feeble, frequent, irregular pulse, dyspnœa and scanty urine. Liver enlarged, dyspnœa, albuminuria. No œdema). Convallaria (heart disease with vertigo and digestive disturbances). Quinidin -Isomeric methoxyl compound.--(Restores normal rhythm in auricular fibrillation, often supplements the action of Digitalis. Two doses of 3 grains each, three hours apart-if no symptoms of cinchonism develop, 4 doses 6 grs each daily (C. Harlan Wells). Paroxysmal tachycardia. Establishes normal heart rhythm at least temporarily, less in valvular lesions).", source = "boericke-mm-9" },
  { section = "Dose", text = "The third to thirtieth attenuation will bring about reaction when the drug is homeopathically indicated; but for palliative purposes the physiological dosage is required. For this purpose, the tincture made from the fresh plant, in doses of five to twenty drops, when the cardiac stimulation is desired, or the infusion of 1 1/2 per cent. Dose, one-half to one ounce if the diuretic action is wanted. The tincture may be given on sugar or bread, and nothing liquid be taken for twenty minutes before or after its administration. Of the powdered leaves, 1/2 to 2 grains in capsules. Digitoxin 1-250 grain. No matter what form of digitalis is given the dose should be reduced as soon as the pulse rate has been lowered to 80 beats a minute and the normal rhythm has been partially or completely restored. Under such conditions a good rule is to cut the dose in half and still more if there be a sudden falling off of the urinary output.", source = "boericke-mm-9" },
]

