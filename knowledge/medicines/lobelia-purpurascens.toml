id = "lobelia-purpurascens"
name = "Lobelia purpurascens"
abbreviation = "Lob-p."
aliases = ["Purple Lobelia"]

symptoms = [
  { section = "General", text = "Profound prostration of all the vital forces and of the nervous system; respiratory paralysis.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Nervous prostration of influenza.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Coma.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tongue white and paralyzed.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Confused and depressed.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Headache with nausea, vertigo; especially between eyebrows.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Cannot keep eyes open; spasmodic closure of lids.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Superficial respiration; heart and lungs feel paralyzed; respiration slow.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Heart beats sound to him like boom of a drum.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Impossible to keep open.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Drowsy.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Baptisa; Lobelia cardinalis (debility, especially of lower extremities; oppressed breathing, pleurisy, sticking pain in chest on taking a long breath. Pain in left lung, intermitting pricking during the day).", source = "boericke-mm-9" },
  { section = "Dose", text = "Third potency.", source = "boericke-mm-9" },
]

