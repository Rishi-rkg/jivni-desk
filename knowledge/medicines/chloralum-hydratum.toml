  { section = "General", text = "This drug, used in physiological doses, is a powerful hypnotic and cardiac depressant.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "It has a marked effect on the skin, producing erythema, ecchymosis, etc, which symptoms have been utilized homeopathically with much success, especially in the treatment of hives.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Emotional excitability, hallucinations.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Night terrors in children.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Muscular prostration.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Morning headache; worse in forehead, also in occiput, on motion; better in open air.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Passive cerebral hyperæmia (use 30th).", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Feeling as if hot band were drawn from temple to temple.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Hears voices.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Eyes blood-shot and watery.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Circles of light, black spots.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Illusions of sight where eyes are closed or at night.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Dim vision.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Conjunctivitis, burning in eye and lids; eyeball feels too large; everything looks white.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Red blotches, like measles.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Urticaria, worse, spirituous liquors, hot drinks.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Erythema aggravated by alcoholic drinks, with palpitation; causes pain in tendons and extensors.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Intense itching.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Surface of body stone-cold.", grade = 2, source = "boericke-mm-9" },
  { section = "Skin", text = "Wheals come on from a chill; better, warmth.", grade = 1, source = "boericke-mm-9" },
