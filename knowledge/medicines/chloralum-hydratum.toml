notes = [
  { section = "Relationship", text = "Antidotes: Ammon; Atrop; Dig; Mosch. Compare: Bell; Opium; Apis; Veronal --(a dangerous drug made by the action of alcohol upon urea and contains the same radical that alcohol does. Makes a man just as drunk as pure alcohol. Staggers, cannot stand up) (Dr. Varney). (Confluent reddish spots; dermatitis, itching of glans and prepuce; circumscribed dermatitis patch on first metacarpal phalangeal joint). Luminal --(Sleeplessness with skin symptoms in migraine; lethargy like epidemic encephalitis) (Dr. Royal).", source = "boericke-mm-9" },
  { section = "Dose", text = "First trituration in hives, otherwise, higher potencies. Locally, in offensive foot-sweat, bathe with one per cent solution. For its physiological effects, five to twenty grains. Use cautiously.", source = "boericke-mm-9" },
]

