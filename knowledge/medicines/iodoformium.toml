  { section = "Chest", text = "Pain in left breast, like a hand grasping at the base of the heart.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Hæmoptysis.", grade = 1, source = "boericke-mm-9" },
  { section = "Chest", text = "Asthmatic breathing.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Scaphoid abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Chronic diarrhœa with suspected tuberculosis.", grade = 1, source = "boericke-mm-9" },
  { section = "Abdomen", text = "Abdomen distended; mesenteric glands enlarged.", grade = 1, source = "boericke-mm-9" },
