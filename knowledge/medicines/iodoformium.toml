symptoms = [
  { section = "General", text = "Should not be forgotten in the treatment of tubercular meningitis, both as a local application to the head and internally (Bacil).", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Tuberculous conditions.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Subacute and chronic diarrhœa of children.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Sharp, neuralgic pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Head feels heavy, as if it could not be lifted from pillow.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Itching of occiput.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Meningitis.", grade = 2, source = "boericke-mm-9" },
  { section = "Head", text = "Sleep interrupted by sighing and cries.", grade = 1, source = "boericke-mm-9" },
  { section = "Head", text = "Very drowsy.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Pupils, dilated; contract unequally, react poorly.", grade = 2, source = "boericke-mm-9" },
  { section = "Eyes", text = "Diplopia.", grade = 1, source = "boericke-mm-9" },
  { section = "Eyes", text = "Failing sight due to retro-bulbar neuritis, central scotoma-partial atrophy of optic disc.", grade = 1, source = "boericke-mm-9" },
