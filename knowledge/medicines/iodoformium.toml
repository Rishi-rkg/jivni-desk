  { section = "Abdomen", text = "Chronic diarrhœa; stools greenish, watery, undigested, with irritable temper.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Legs weak; cannot stand and walk with eyes closed.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Weakness of knees when going upstairs.", grade = 1, source = "boericke-mm-9" },
