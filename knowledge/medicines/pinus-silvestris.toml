  { section = "General", text = "Pinus sylvestris combines rheumatic, bronchial and urticarious symptoms; the chest seems thin and to give way.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Stiffness; gouty pain in all joints, especially finger-joints.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cramps in calves.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Nettle-rash.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Itching all over, especially about joints and on abdomen.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Nose itches.", grade = 1, source = "boericke-mm-9" },
]

