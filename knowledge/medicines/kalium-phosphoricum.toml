  { section = "General", text = "Marked disturbance of the sympathetic nervous system.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Conditions arising from want of nerve power, neurasthenia, mental and physical depression, are wonderfully improved this remedy.", grade = 2, source = "boericke-mm-9" },
