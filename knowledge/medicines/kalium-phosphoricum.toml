notes = [
  { section = "Relationship", text = "Compare: Kali hypophosph (Debility with wasting of muscular tissue. Phosphaturia with general anæmia or leucocythemia. Effects of excessive tea drinking. Chronic bronchitis where the expectoration is thick and fetid, sometimes scanty and tough.", source = "boericke-mm-9" },
  { section = "Dose", text = "5 grains of crude to 3x). Genista.--Dyer's Weed--(contains scopolamin; frontal headache and vertigo, worse motion, better open air and eating. Dry throat, awakes with waterbrash. Itching eruption on elbows, knees and ankles. Promotes diuresis in dropsical conditions). Macrozamia Spiralis (Extreme debility after severe illness; collapse. Weariness from no assignable cause, no pains. Boring pain at vertex; vomiting and retching all night; impossible to open eyes, giddiness and cold). Zinc; Gels; Cimicif; Laches; Mur ac.", source = "boericke-mm-9" },
  { section = "Dose", text = "Third to twelfth trituration. The highest potencies seem to be indicated in certain cases.", source = "boericke-mm-9" },
]

