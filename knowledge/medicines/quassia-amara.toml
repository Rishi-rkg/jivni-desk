id = "quassia-amara"
name = "Quassia amara"
abbreviation = "Quas."
aliases = ["Quassia-wood", "Quassia - picraena excelsa"]

symptoms = [
  { section = "General", text = "Acts on gastric organs as a tonic (Gentian; Hydr).", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Seems to possess marked action on eyes, producing amblyopia and cataract.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pain in right intercostal muscles above the liver.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Pressure and stitches in liver, and sympathetically in spleen.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Atonic dyspepsia, with gas and acidity.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Heart-burn and gastralgia.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Regurgitation of food.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Abdomen feels empty and retracted.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Dyspepsia after infectious diseases; especially grip, dysentery.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Tongue dry or with brown sticky coating.", grade = 1, source = "boericke-mm-9" },
  { section = "Stomach", text = "Cirrhosis of liver with ascites.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Excessive desire-impossible to retain urine; copious micturition day and night.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "As soon as the child wakes up the bed is drenched.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Inclination to yawn and stretch (Rhus).", grade = 2, source = "boericke-mm-9" },
  { section = "Extremities", text = "Sensation of coldness over back.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Prostration, with hunger.", grade = 1, source = "boericke-mm-9" },
  { section = "Extremities", text = "Cold extremities, with sensation of internal coldness (Helo-derma).", grade = 2, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "First to third potency, or spoonful doses of Aqua Quassiae.", source = "boericke-mm-9" },
]

