id = "uva-ursi"
name = "Uva ursi"
abbreviation = "Uva."
aliases = ["Bearberry"]

symptoms = [
  { section = "General", text = "Urinary symptoms most important.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cystitis, with bloody urine.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Uterine hæmorrhage.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Chronic vesical irritation, with pain, tenesmus, and catarrhal discharges.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Burning after the discharge of slimy urine.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "Pyelitis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Calculous inflammation.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Dyspnœa, nausea, vomiting, pulse small and irregular.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Cyanosis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Urticaria without itching.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Frequent urging, with severe spasms of bladder; burning and tearing pain.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Urine contains blood, pus, and much tenacious mucus, with clots in large masses.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Involuntary; green urine.", grade = 1, source = "boericke-mm-9" },
  { section = "Urinary", text = "Painful dysuria.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Relationship", text = "Compare: Arbutin (a crystallized glucoside of Uva; found also in Kalmia, Gaultheria and other genera of the family of Eriaceæ; given in doses of 3 to 8 grains with sugar three times a day. Used as an urinary antiseptic and diuretic). Arctosphylos manzanita (acts on renal and reproductive organs. Gonorrhœa, vesical catarrh, diabetes menorrhagia. Tincture of leaves). Vaccinum myrtillus -Huckleberries--(dysentery; typhoid, keeps intestines aseptic and prevents absorption and reinfection).", source = "boericke-mm-9" },
  { section = "Dose", text = "Tincture, five to thirty drops. In pyelitis a trituration of the leaves.", source = "boericke-mm-9" },
]

