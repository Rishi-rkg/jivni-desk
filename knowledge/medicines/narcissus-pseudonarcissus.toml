aliases = ["Daffodil", "Narcissus"]

symptoms = [
  { section = "General", text = "Symptoms of nausea followed by violent vomiting and diarrhœa.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Daffodil bulbs contain an alkaloid the action of which, according to authorities, varies as to whether the alkaloid is extracted from the flowering bulb or from the bulb after flowering.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Thus in the former case the alkaloid produces dryness of the mouth, checks cutaneous secretions, dilates the pupil of the eye, quickens the pulse, and slows and weakens the heart contractions.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "On the other hand, the alkaloid from the bulbs after flowering produces copious salivation, increases cutaneous secretion, contracts the pupil of the eye, produces slight relaxation of the pulse, and slight faintness and nausea.--The Lancet.", grade = 2, source = "boericke-mm-9" },
  { section = "General", text = "A remedy for cough and bronchitis.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Continuous cough, Coryza; frontal headache.", grade = 1, source = "boericke-mm-9" },
  { section = "General", text = "Convulsive stage of whooping-cough.", grade = 1, source = "boericke-mm-9" },
  { section = "Skin", text = "Erythema of a papular, vesicular and pustular type, aggravation in wet weather.", grade = 1, source = "boericke-mm-9" },
]

notes = [
  { section = "Dose", text = "First attenuation.", source = "boericke-mm-9" },
]

